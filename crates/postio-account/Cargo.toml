[package]
name = "postio-account"
description = "The account crate: the MailBackend seam, discovery, the keyring, and (behind the imap feature) an IMAP backend built on Pimalaya io-imap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["imap"]

# The io-imap-backed implementation, and everything it drags in: the protocol
# crate, its SASL companion, and our own TLS stack. On by default.
#
# Turn it off and what is left is the MailBackend seam, its mock, autoconfig
# discovery and the keyring. That is all `postio-sync` needs, and it is what
# keeps a pre-1.0 protocol crate — and the CI rule that bans io-imap from
# `postio-gtk` — out of everything above this one. See ADR 0001.
imap = [
    "dep:io-imap",
    "dep:io-sasl",
    "dep:log",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:tokio-rustls",
]

# Test-only: lets `MockMailbox::corpus` seed mailboxes from the shared `.eml`
# fixtures. Off by default so nothing in a normal build carries them; the
# self dev-dependency below turns it on for this crate's own test suite.
test-corpus = ["postio-model/test-corpus"]

# Test-only: the in-process IMAP server in `test_server`. Off by default so a
# shipped build carries no listening socket at all. It implies `test-corpus`
# because its mailboxes are seeded from the shared `.eml` fixtures rather than
# from fixtures invented here, and it deliberately does *not* imply `imap`:
# the server is written against the wire, not against `io-imap`, so a bug in
# the protocol crate cannot hide inside the thing meant to catch it.
test-server = ["test-corpus"]

[dependencies]
# Not a choice about error handling in this crate: io-pim-discovery's
# `with_factory` hook is typed `FnMut(&Url) -> anyhow::Result<S>`, so
# supplying a stream of our own (discovery/transport.rs, #57) means naming
# the type. Already in the graph underneath that crate, so it costs nothing.
anyhow = "1.0.104"
async-trait = "0.1.92"
# PKCE's S256 challenge (`oauth::pkce`) and the `code_verifier`/`state`
# randomness behind it. Both already resolve at these exact versions
# transitively under `io-pim-discovery`'s `pacc` feature (unused here), so
# depending on them directly adds no new version to the graph.
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
# `oauth::exchange`'s token POST and RFC 8414 metadata GET: the same
# io-http coroutines `io-pim-discovery` already builds on for autoconfig,
# used directly here because that crate has no POST-capable coroutine of
# its own (ADR 0006 Q3 -- "no new dependency class"). `default-features =
# false`: `io-pim-discovery`'s own `rustls-ring` feature already turns on
# `io-http/client`, which is all `HttpClientStd` needs.
io-http = { version = "0.5", default-features = false }
io-imap = { version = "=0.6.0", default-features = false, features = ["client"], optional = true }
# The OAuth 2.0 wire core (#537): RFC 6749 token request/response types
# and encodings, RFC 7636 PKCE, the RFC 6749 §10.12 state value — the
# maintained upstream for what `oauth/exchange.rs` and `oauth/pkce.rs`
# hand-rolled first. `client` is only the random generators (rand); the
# HTTP itself stays on this crate's own cancellable pimalaya-stream
# transport, because io-oauth's optional client wrapper consumes the HTTP
# status that the 200-with-error-body shim in `exchange.rs` needs.
# The DNS wire format, for the MX query #94 adds. `io-pim-discovery` carries
# the exchange (`DiscoveryDnsExchange`) and the stream pool but publishes no
# MX lookup of its own, and this is the crate it builds its own TXT and SRV
# queries with -- so this is the family's own extension point rather than a
# second DNS stack. Already in the graph transitively under
# `io-pim-discovery`; naming it here adds no new version.
domain = { version = "0.12", default-features = false, features = ["alloc", "std", "unstable-new"] }
io-oauth = { version = "0.3", default-features = false, features = ["client"] }
io-pim-discovery = { version = "0.7", default-features = false, features = ["autoconfig", "rfc6186", "rfc8414", "rustls-ring"] }
io-sasl = { version = "=0.1.0", default-features = false, optional = true }
log = { version = "0.4", features = ["std"], optional = true }
oo7 = "0.6.0-alpha"

pimalaya-stream = { version = "0.3", features = ["rustls-ring"] }
postio-config.workspace = true
postio-model.workspace = true
# `oauth::pkce`'s `code_verifier`/`state` randomness.
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
secrecy = { version = "0.10", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# `oauth::exchange`'s token responses, and RFC 8414 metadata's own parsing
# (`io_pim_discovery::rfc8414`) -- already in the graph underneath it.
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "time", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
toml = "1.1.4"
tracing = "0.1"
url = "2.5.8"
zeroize = "1.9.0"


# `providers_toml.rs` is compiled a second time by build.rs (`#[path]`), the
# same idiom `postio-gtk/build.rs` uses for design tokens (ARCHITECTURE.md
# §10) -- so the build script needs everything that module needs.
[build-dependencies]
postio-config.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"
# The protocol crate, for the handful of commands `postio-account` does not wrap
# yet — QRESYNC SELECT, ENABLE, STORE, COPY, APPEND — which `tests/imap_loopback.rs`
# drives against the in-process server directly. Same exact pin as above, so
# cargo resolves one copy and the types match.
io-imap = { version = "=0.6.0", default-features = false, features = ["client"] }
postio-account = { path = ".", features = ["test-corpus", "test-server"] }
postio-model = { path = "../postio-model", features = ["test-corpus"] }
serde-xml-rs = "0.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

# The Keychain store (ADR 0019). Already in `Cargo.lock` via
# `rustls-platform-verifier`, so this adds no new dependency class -- only a
# direct edge to something the graph already contains.
#
# Platform sections live at the foot of the manifest, after every plain
# dependency table. A TOML table runs until the next header, so one of these
# placed mid-list silently makes everything below it conditional --
# `check-target-sections-last.py` and #642.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[lints.rust]
# Not the workspace floor: see EXCEPTIONS in scripts/checks/check-lint-floor.py.
unsafe_code = "deny"
