# Return from the search field reaches the hits (#693, #1252).
#
# #693 asked for the keyboard to move from the query to the hits; #1252 was
# the same handoff flaking. Chain delivery passes the key through every
# controller on the real focus chain, which is what that flake was about.
#
# Re-expressed for Focus (T265), and again for spec 010's search (#1825):
# the dropdown lists the top hits under the field as the word is typed,
# with Show all under the ring; Return opens the results in the inbox's
# place, the keyboard on them, and the arrows walk the results from there.
apps   = ["focus"]
source = { kind = "issue", ref = "#693" }
proof  = "pinned"

[[step]]
command = "search"

[[step]]
type    = "harbour"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
check   = { keyboard.region = "search", app.focus.bar.highlighted = "show_all" }

[[step]]
key     = "Return"
check   = { keyboard.region = "results", keyboard.reachable = true, overlay.kind = "none" }
expect  = "Return opens the results for the word, the first ringed; the keyboard is on them, not left in a field that has gone."

[[step]]
key     = "Down"
check   = { keyboard.region = "results", keyboard.reachable = true }
expect  = "Down walks the ring on to the next result."
