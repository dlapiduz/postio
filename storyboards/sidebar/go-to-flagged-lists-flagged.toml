# Go to Flagged lists the flagged mail (#1747, T257).
#
# In the classic app the go_to_flagged chord showed "Flagged is empty" while
# its sidebar counted nine (#1747). In Focus `g *` lists flagged mail (C13,
# T257): the small seed's eight flagged conversations, with no flag mark on
# the rows.
#
# Re-expressed for Focus (T265), where it holds: pinned.
apps   = ["focus"]
source = { kind = "issue", ref = "#1747" }
proof  = "pinned"

[[step]]
command = "go_to_flagged"
settle  = { until = { rows.count = 8 } }
check   = { scope = "Flagged", rows.count = 8, keyboard.region = "list" }
expect  = "The Flagged list shows the eight flagged conversations, and the header says Flagged."
