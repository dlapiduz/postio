[package]
name = "postio-sync"
description = "Sync engine: operation queue, QRESYNC resync, IDLE, and backoff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["std"] }
# `default-features = false` drops `io-imap` and its TLS stack (ADR 0001). A path, not the workspace
# entry: an inherited dependency cannot turn default features off.
postio-account = { version = "0.6.2", path = "../postio-account", default-features = false }
postio-calendar.workspace = true
postio-classify.workspace = true
postio-config.workspace = true
# A body is only indexable at the moment it lands, which is in this crate (`fetch_body`, #327).
postio-index.workspace = true
postio-model.workspace = true
postio-smtp.workspace = true
postio-storage.workspace = true
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
postio-workspace-hack.workspace = true

[dev-dependencies]
base64 = { workspace = true }
# Tests only: the real io-imap backend and the in-process IMAP server, so the engine runs over a
# loopback socket.
# No io-imap type appears in this crate; the ordinary build keeps `default-features = false`.
postio-account = { path = "../postio-account", features = ["imap", "test-server"] }
postio-storage = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
