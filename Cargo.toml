[workspace]
resolver = "3"
members = [
    "crates/postio-model",
    "crates/postio-storage",
    "crates/postio-search",
    "crates/postio-extract",
    "crates/postio-body",
    "crates/postio-index",
    "crates/postio-config",
    "crates/postio-account",
    "crates/postio-jmap",
    "crates/postio-gmail",
    "crates/postio-render",
    "crates/postio-ui",
    "crates/postio-smtp",
    "crates/postio-transport",
    "crates/postio-sync",
    "crates/postio-core",
    "crates/postio-runtime",
    "crates/postio-session",
    "crates/postio-ffi",
    "crates/postio-bench",
    "crates/postio-test-support",
    "crates/postio-client",
    "crates/postio-host",
    "crates/postio-tui",
    "crates/postio-mcp",
    "crates/postio-widgets",
    "crates/postio-gtk",
    "crates/postio-classify",
    "crates/postio-calendar",
    "crates/postio-ai",
    "crates/postio-vault",
    "crates/postio-storyboard",
    "crates/postio-focus",
    "crates/postio-demo",
    "crates/postio-workspace-hack",
    "crates/postio-vcard",
    "crates/postio-contact-sync",
]
exclude = ["vendor"]

# What a bare `cargo build` compiles: everything except `postio-ffi`, whose `uniffi` `cli` feature
# pulls `uniffi_bindgen`, `clap` and `cargo_metadata` (#1306).
# `--workspace` ignores this list. A new member belongs in both lists, or bare cargo silently stops
# building it (#1500).
default-members = [
    "crates/postio-model",
    "crates/postio-storage",
    "crates/postio-search",
    "crates/postio-extract",
    "crates/postio-body",
    "crates/postio-index",
    "crates/postio-config",
    "crates/postio-account",
    "crates/postio-jmap",
    "crates/postio-gmail",
    "crates/postio-render",
    "crates/postio-ui",
    "crates/postio-smtp",
    "crates/postio-transport",
    "crates/postio-sync",
    "crates/postio-core",
    "crates/postio-runtime",
    "crates/postio-session",
    "crates/postio-bench",
    "crates/postio-test-support",
    "crates/postio-client",
    "crates/postio-host",
    "crates/postio-tui",
    "crates/postio-mcp",
    "crates/postio-widgets",
    "crates/postio-gtk",
    "crates/postio-classify",
    "crates/postio-calendar",
    "crates/postio-ai",
    "crates/postio-vault",
    "crates/postio-storyboard",
    "crates/postio-focus",
    "crates/postio-demo",
    "crates/postio-workspace-hack",
    "crates/postio-vcard",
    "crates/postio-contact-sync",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
# The compiler the workspace is built with; `scripts/checks/check-toolchain-pinned.py` keeps it
# equal to rust-toolchain.toml.
# An MSRV promises something downstream and the only consumer is this repository, so the promise is
# the pin.
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/dlapiduz/postio"
# Not published: crates.io refuses path dependencies, and it is what lets `deny.toml`'s
# `allow-wildcard-paths` apply.
publish = false

# The lint floor every crate answers to, kept the only table by
# `scripts/checks/check-lint-floor.py`.
# `forbid`, not `deny`: an `#[allow]` inside the crate can switch `deny` off, and this client holds
# credentials and parses hostile input.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
# A future nobody awaits silently does not run; fifty-six survived into a green build as warnings.
unused_must_use = "deny"

# Cargo 1.100's `cargo::unused_dependencies` flags every `postio-workspace-hack` line, which only
# unifies features (ADR 0047);
# `cargo machete` (`scripts/checks/check-unused-deps.py`) gates unused dependencies and knows that.
[workspace.lints.cargo]
unused_dependencies = "allow"

[workspace.lints.clippy]
# `let _ = some_async_call();` binds the future to `_`, so `unused_must_use` is satisfied and it is
# dropped unpolled.
let_underscore_future = "deny"

[workspace.metadata.cargo-machete]
ignored = ["postio-workspace-hack"]

[workspace.dependencies]
postio-model   = { path = "crates/postio-model" }
postio-storage = { path = "crates/postio-storage" }
postio-search  = { path = "crates/postio-search" }
postio-extract = { path = "crates/postio-extract" }
postio-body    = { path = "crates/postio-body" }
postio-index   = { path = "crates/postio-index" }
postio-config  = { path = "crates/postio-config" }
postio-session = { path = "crates/postio-session" }
postio-account = { path = "crates/postio-account" }
postio-jmap    = { path = "crates/postio-jmap" }
postio-gmail   = { path = "crates/postio-gmail" }
postio-ui      = { path = "crates/postio-ui" }
postio-render  = { path = "crates/postio-render" }
postio-smtp    = { path = "crates/postio-smtp" }
postio-transport = { path = "crates/postio-transport" }
postio-sync    = { path = "crates/postio-sync" }
postio-core    = { path = "crates/postio-core" }
postio-runtime = { path = "crates/postio-runtime" }
postio-gtk     = { path = "crates/postio-gtk" }
postio-test-support = { path = "crates/postio-test-support" }
postio-client = { path = "crates/postio-client" }
postio-host    = { path = "crates/postio-host" }
postio-widgets = { path = "crates/postio-widgets" }
postio-classify = { path = "crates/postio-classify" }
postio-calendar = { path = "crates/postio-calendar" }
postio-ai      = { path = "crates/postio-ai" }
postio-vault   = { path = "crates/postio-vault" }
postio-storyboard = { path = "crates/postio-storyboard" }
postio-focus = { path = "crates/postio-focus" }
postio-demo = { path = "crates/postio-demo" }
postio-mcp = { path = "crates/postio-mcp" }
postio-workspace-hack = { path = "crates/postio-workspace-hack" }
postio-vcard   = { path = "crates/postio-vcard" }
postio-contact-sync = { path = "crates/postio-contact-sync" }

# Third-party crates shared by two or more members (#1498). A member adds features but cannot take
# defaults away,
# so entries turn them off only where every member already had.
async-channel = "2.5.0"
async-trait = "0.1.92"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
io-sasl = { version = "=0.2.0", default-features = false }
pimalaya-stream = { version = "0.4", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-xml-rs = "0.8"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
turso = { version = "=0.8.4", default-features = false, features = ["fts"] }
url = "2.5.8"
zeroize = "1.9.1"

[profile.release]
lto = "thin"
codegen-units = 1

# The terminal build must be under half its desktop counterpart (docs/archive/specs/005-tui-frontend
# SC-004): LTO, `s`, no unwinding tables, no symbols.
# `panic = "abort"` is safe because a panic hook restores the terminal before the abort.
[profile.release-tui]
inherits = "release"
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

# debug = 0: cold test build 282s vs 301s and a 70 MB binary vs 239 MB, measured. `file:line`
# survives in panic and assertion messages
# (`#[track_caller]`); only backtrace frames lose it.
# `strip = "debuginfo"` was measured: a byte-identical binary and 44s slower. Do not add it.
# Debug info for one run: `CARGO_PROFILE_DEV_DEBUG=line-tables-only cargo test -p <crate>` (rebuilds
# every unit).
[profile.dev]
debug = 0

# Dependencies stay at `opt-level = 2`: no gate observes it, but the application suite ran in 200s
# against 382s at 1.
# Not a leftover to tidy away.
[profile.dev.package."*"]
opt-level = 2

# Turso from Postio's fork (branch postio-0.8.4-tantivy-0.27): v0.8.4 plus fuzzy and prefix word
# expansion in the full-text index,
# on tantivy 0.27 so zstd is 0.14 (0.26's 0.13 is named by RUSTSEC-2026-0391, -0398, -0403). Every
# query search runs is quoted and parses as upstream.
# It names `TursoVecInExt::new_in` in full where Rust 1.100's `Vec::new_in` would win. Every turso
# crate comes from one commit.
[patch.crates-io]
turso = { git = "https://github.com/dlapiduz/turso", rev = "fa342b793f8a8b006da570fb6bca6196cb65dacc" }
turso_core = { git = "https://github.com/dlapiduz/turso", rev = "fa342b793f8a8b006da570fb6bca6196cb65dacc" }
turso_ext = { git = "https://github.com/dlapiduz/turso", rev = "fa342b793f8a8b006da570fb6bca6196cb65dacc" }
turso_macros = { git = "https://github.com/dlapiduz/turso", rev = "fa342b793f8a8b006da570fb6bca6196cb65dacc" }
turso_parser = { git = "https://github.com/dlapiduz/turso", rev = "fa342b793f8a8b006da570fb6bca6196cb65dacc" }
turso_sdk_kit = { git = "https://github.com/dlapiduz/turso", rev = "fa342b793f8a8b006da570fb6bca6196cb65dacc" }
turso_sdk_kit_macros = { git = "https://github.com/dlapiduz/turso", rev = "fa342b793f8a8b006da570fb6bca6196cb65dacc" }
turso_sync_engine = { git = "https://github.com/dlapiduz/turso", rev = "fa342b793f8a8b006da570fb6bca6196cb65dacc" }
turso_sync_sdk_kit = { git = "https://github.com/dlapiduz/turso", rev = "fa342b793f8a8b006da570fb6bca6196cb65dacc" }

blitz-dom = { path = "vendor/blitz-dom" }
blitz-paint = { path = "vendor/blitz-paint" }
mail-parser = { path = "vendor/mail-parser" }
