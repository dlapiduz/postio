# The reading walk: open, walk the thread, reply, send, leave
# (ux-architect §4).
#
# `Return` opens the thread over the list, `[`/`]` step its messages, `e`
# replies to the one shown, `Ctrl+Return` sends, `Esc` returns. Each step
# asks the §4 questions: where am I, did the app tell me, did I lose
# anything. The runner has no network, so `send` only queues.
#
# Re-expressed for Focus (T265): its open message shows one message and
# steps the thread with `[` and `]` (C2, FR-037), where the classic app's
# `J`/`K` never reached the conversation (#1748).
apps   = ["focus"]
source = { kind = "flow", ref = "ux-architect §4" }
seed   = "long-thread"

[[step]]
command = "next_message"

[[step]]
id      = "open"
command = "open_message"
check   = { view = "reader", reading.id = "7", composer.open = false }
expect  = "The thread is open over the list on its newest message."

[[step]]
command = "prev_in_conversation"
check   = { reading.id = "6" }
expect  = "`[` shows the message before it."

[[step]]
command = "next_in_conversation"
check   = { reading.id = "7" }
expect  = "`]` moves back."

[[step]]
id      = "reply"
command = "reply"
check   = { composer.open = true, keyboard.field = "body" }
expect  = "The reply opens, its recipient filled in, the caret in the body."

[[step]]
type    = "Thanks, that works for me."

[[step]]
id      = "send"
command = "send"
check   = { composer.open = false, view = "reader", reading.id = { same_as = "open" } }
expect  = "The composer closes and the message is back where it was. The app says the message went (or is queued); silence here is the failure."

[[step]]
command = "back"
check   = { composer.open = false, view = "list", keyboard.region = "list", cursor.index = 0 }
expect  = "Escape leaves the message to the list without losing the place."
