[package]
name = "postio-model"
description = "Postio domain model: pure types and threading. No storage or protocol dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Test-only: embeds the `.eml` corpus; downstream crates enable it from dev-dependencies so nothing
# ships.
test-corpus = []

[dependencies]
chrono = { workspace = true, features = ["serde", "std"] }
mail-builder = { version = "2.0", default-features = false }
mail-parser = { version = "1.0", features = ["full_encoding"] }
serde = { workspace = true }
unicode-normalization = "0.1"
postio-workspace-hack.workspace = true

[dev-dependencies]
serde_json = { workspace = true }
postio-model = { path = ".", features = ["test-corpus"] }

[lints]
workspace = true
