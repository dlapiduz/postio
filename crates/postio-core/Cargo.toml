[package]
name = "postio-core"
description = "UI-agnostic runtime: command bus, event stream, app state, undo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-channel = "2.5.0"
postio-model.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
