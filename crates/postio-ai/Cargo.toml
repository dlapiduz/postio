[package]
name = "postio-ai"
description = "The client for the model a person runs on this computer: questions in a fixed schema, answers checked before they are believed, and no path that sends mail."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["std"] }
# HTTP/1.1 framing over a loopback port or local socket (R16). `client` only, TLS off, so nothing
# can speak to another machine.
io-http = { version = "0.8", default-features = false, features = ["client"] }
postio-classify.workspace = true
postio-config.workspace = true
postio-model.workspace = true
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
postio-workspace-hack.workspace = true

[lints]
workspace = true

[features]
# The fake runtime for other crates' tests; the default suite opens no connection.
test-support = []
