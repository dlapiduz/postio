[package]
name = "postio-index"
description = "FTS5 search index and query executor over postio-search's parser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["std"] }
# Owns the HTML-to-text extraction the `body` column requires: "raw markup must never reach this
# column" is enforced by the crate that holds it (#327).
postio-body = { workspace = true }
# The attachments half stores what the extractor produced and re-extracts when `EXTRACTOR_VERSION`
# moves; the indexer in postio-session runs it.
postio-extract = { workspace = true }
postio-model = { workspace = true }
postio-search = { workspace = true }
postio-storage = { workspace = true }
# Row and Value types. This is the one crate besides postio-storage that speaks SQL (ADR 0016).
turso = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
postio-workspace-hack.workspace = true

[dev-dependencies]
postio-model = { workspace = true, features = ["test-corpus"] }
postio-storage = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
