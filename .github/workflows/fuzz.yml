name: Fuzz

# Hostile input, on a timer: the `.eml` corpus holds only inputs somebody thought of. The hunt is
# for panics, unbounded memory and sanitizer bypasses.
# Not a gate: a find is a bug report, and the instrumented build is expensive, so `fuzz/` is its own
# workspace.
# PAUSED 2026-08-25: workflow_dispatch-only to save a private repository's free minutes; restore the
# schedule below when public.
on:
  # schedule:
  #   - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target"
        required: false
        default: "5"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The checkers first: a property that cannot fail reports "clean" forever, so
  # `postio_fuzz::properties` feeds each a deliberate violation.
  properties:
    name: Fuzz properties
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Install the fuzzing toolchain
        run: rustup toolchain install nightly-2026-08-24 --profile minimal

      - name: Install the linker and cc shims
        run: scripts/install-shims.sh
      - name: Test the checkers
        working-directory: fuzz
        run: cargo test

  fuzz:
    needs: properties
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-26.04
    # One runner per target, with no `fail-fast`: a find in one must not cut short the others.
    strategy:
      fail-fast: false
      matrix:
        target: [parse_message, sanitize_html, parse_query]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # The one pinned nightly in the repository: libFuzzer needs `-Z sanitizer=address`, absent on
      # stable.
      # A dated pin, not a bare `nightly` (`check-toolchain-pinned.py` refuses that); keep in step
      # with fuzz/rust-toolchain.toml.
      - name: Install the fuzzing toolchain
        run: rustup toolchain install nightly-2026-08-24 --profile minimal

      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      - name: Identify the compiler
        id: rust
        run: |
          echo "version=$(rustup run nightly-2026-08-24 rustc --version | tr ' ()/' '----')" \
            >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and the fuzz target dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: |
            fuzz-${{ runner.os }}-${{ steps.rust.outputs.version }}-

      - name: Install cargo-fuzz
        run: |
          if cargo fuzz --version 2>/dev/null | grep -qw "0.13.2"; then
            echo "cargo-fuzz 0.13.2 restored from the cache"
          else
            cargo install cargo-fuzz --locked --version 0.13.2 --force
          fi

      # No target links GTK, WebKit or SQLite (they reach the pure leaves), so no apt step.

      - name: Seed the corpus
        run: scripts/fuzz-seed.sh ${{ matrix.target }}

      # `-rss_limit_mb` and `-timeout` are findings, not guard rails: unbounded memory or a
      # minute-long parse is the denial of service.
      - name: Fuzz
        working-directory: fuzz
        run: |
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time=$(( ${{ github.event.inputs.minutes || 5 }} * 60 )) \
            -rss_limit_mb=2048 \
            -timeout=25 \
            -print_final_stats=1

      # A crash artifact is a mutated piece of somebody's mail. Logs on a public repository are
      # public, so it is uploaded and never printed.
      - name: Upload the crash artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-find-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: Say what to do with it
        if: failure()
        run: |
          echo "::error::${{ matrix.target }} found an input that fails."
          echo "The reproducer is in the fuzz-find-${{ matrix.target }} artifact."
          echo "It is deliberately not printed here -- see docs/archive/engineering-notes.md,"
          echo "'Fuzzing the hostile-input pipeline', for how to triage it."
