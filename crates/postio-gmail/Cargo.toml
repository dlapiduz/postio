[package]
name = "postio-gmail"
description = "Gmail REST MailBackend adapter over Pimalaya's io-gmail (ADR 0018)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The Gmail REST v1 protocol crate — coroutines plus the std blocking
# client. No TLS features: connections open on this workspace's own
# cancellable pimalaya-stream, like the JMAP adapter beside it.
io-gmail = { version = "0.3", default-features = false, features = ["client"] }
pimalaya-stream = { version = "0.3", features = ["rustls-ring"] }

# The MailBackend seam and nothing else.
postio-account = { version = "0.2.0", path = "../postio-account", default-features = false }
postio-model = { version = "0.2.0", path = "../postio-model" }

tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
