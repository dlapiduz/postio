# The window opens with the keyboard on the list (#1473).
#
# The defect: the window opened with the keyboard in the search field, so
# `j`, `a` and `?` typed letters into it. If the keyboard starts anywhere but
# the list, `j` lands in a text field and the first check fails.
#
# Re-expressed for Focus (T265): Focus opens with no cursor row (its list is
# windowed, and the cursor is a row a key puts there), so the first `j` puts
# the cursor on the first row, index 0.
apps   = ["focus"]
source = { kind = "issue", ref = "#1473" }
proof  = "pinned"

[[step]]
key    = "j"
check  = { keyboard.region = "list", keyboard.typing = false, overlay.kind = "none", cursor.index = 0 }
expect = "The first key puts the cursor ring on the first row; nothing is typed anywhere."
