name: Mutants

# Mutation-tests the pure/logic crates weekly (see `on:` below), and
# never gates a PR -- it is slow by construction (a full rebuild and test
# run per mutant; ~1900 mutants across these four crates), so blocking a PR
# on it would be an hours-long check for a signal that changes rarely. See
# #99 and scripts/mutants.sh's own comment.
#
# Was paused 2026-08-25 -- 2026-09-03 (same reason as ci.yml and bench.yml
# were): a daily run spent this repository's limited free minutes while it
# was still private, whether a mutant regressed or not. Restored now that
# the repository is public, matching bench.yml's own schedule.
#
# The very first dispatch of this job is expected to fail: there is no
# docs/mutants-baseline.txt yet (scripts/mutants.sh says so plainly rather
# than crashing). Run it once, read what survived, file an issue for any
# genuinely missing test, then seed the baseline with
# `MUTANTS_UPDATE_BASELINE=1 scripts/mutants.sh` and commit the result --
# on this runner, not on a shared workstation, which is exactly the
# distinction this workflow exists to draw. #99's own acceptance criteria
# are what that first triage has to satisfy.
#
# Weekly, and only over a tree that moved (#1710). Nightly, it was red seven
# nights of seven over the same survivors and cost 23% of a week's Linux
# minutes, so nobody read it: the signal -- which tests a mutant got past --
# changes when the code does, not when the clock does. Sunday 09:00 keeps it
# off the nightly's 07:00 and the benches' 06:00.
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  # The `changed` job reads the previous run's head SHA.
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 4

jobs:
  # Skips a scheduled run when `main` has not moved since the last one.
  # Without `--rerun-failed`: nothing reads this workflow's conclusion, so a
  # red run over an unchanged tree would only list the same survivors again.
  changed:
    name: Anything to test
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Compare against the last run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-anything-new.sh mutants.yml >> "$GITHUB_OUTPUT"

  mutants:
    name: Mutation testing (${{ matrix.crate }})
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-26.04
    # One job per crate (#1458).
    #
    # This ran as a single job over all four crates eleven times and finished
    # none of them. Every run died with "The runner has received a shutdown
    # signal" between 96 and 141 minutes -- well inside the 360 below, so not
    # this timeout -- after `--jobs 2` and then `--jobs 1` had each been tried
    # against the same symptom. `scripts/mutants.sh`'s own header had already
    # named this as the next thing to try if `--jobs 1` did not hold, and it
    # did not.
    #
    # Four shorter jobs is the difference between a run that fits and one that
    # does not: the 2026-09-10 attempt spent 416s on the unmutated baseline
    # and then 86 minutes testing, and got through three of the four crates.
    # It is also the difference between losing one crate's progress to a lost
    # runner and losing all four's.
    #
    # `fail-fast: false` because the crates are independent questions: a
    # survivor in postio-sync says nothing about postio-model, and stopping
    # the others to report it would throw away the run this workflow exists
    # to produce.
    strategy:
      fail-fast: false
      matrix:
        crate: [postio-model, postio-search, postio-config, postio-sync]
    # Generous, not infinite: a hung mutant should not run out the clock on
    # every job queued behind it, and cargo-mutants has its own per-mutant
    # timeout for the ordinary "this one loops" case.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-mutants gives each parallel job its own scratch copy of the
      # source tree and builds a fresh target/ inside it -- with no --jobs
      # cap it defaults to one per core, and the standard runner's ~14GB of
      # free disk does not hold that many. The first real dispatch (#510)
      # died with "Disk quota exceeded" testing the very first mutant, right
      # after an unmutated baseline build alone had already used most of it.
      # Preinstalled SDKs this job never touches are the easy 20-30GB back.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      # None of the four crates need GTK; see the `coverage` job in ci.yml
      # for the same reasoning about this dependency list.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libsecret-1-dev \
            libglib2.0-dev

      # The pin decides; see the note in ci.yml's `fmt` job.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # `.cargo/config.toml` names `postio-linker` and `postio-cc`; this puts
      # them on PATH (#1101). Before the first cargo invocation, after rustup
      # has made `$CARGO_HOME/bin` exist.
      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      - name: Identify the compiler
        id: rust
        run: echo "version=$(rustc --version | tr ' ()/' '----')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and cargo-mutants
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-${{ steps.rust.outputs.version }}-

      # Pinned the same way cargo-fuzz is in fuzz.yml: a version, not a
      # floating latest.
      - name: Install cargo-mutants
        run: |
          if cargo mutants --version 2>/dev/null | grep -qw "27.1.0"; then
            echo "cargo-mutants 27.1.0 restored from the cache"
          else
            cargo install cargo-mutants --locked --version 27.1.0 --force
          fi

      # `mutants.sh` already took crates as arguments, so the shard is the
      # whole of the workflow-side change. The baseline is still one file for
      # every crate; what changed there is that an update rewrites only the
      # crates the run covered, so four jobs' updates compose instead of the
      # last one to finish winning (#1458).
      - name: Mutation-test ${{ matrix.crate }}
        run: |
          df -h /
          scripts/mutants.sh ${{ matrix.crate }}
