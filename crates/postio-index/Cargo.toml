[package]
name = "postio-index"
description = "FTS5 search index and query executor over postio-search's parser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["std"] }
# The HTML-to-text extraction the `body` column requires. Owned here rather
# than left to every caller: "raw markup must never reach this column" is a
# rule about the column, and a rule enforced by the crate that holds it
# cannot be forgotten by the next caller the way a doc comment can (#327).
postio-body = { workspace = true }
postio-model = { workspace = true }
postio-search = { workspace = true }
postio-storage = { workspace = true }
# The engine, for its Row and Value types. postio-index is the one crate
# besides postio-storage that speaks SQL -- it maintains the search index
# over the same tables (ADR 0016).
turso = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
postio-storage = { workspace = true, features = ["test-support"] }
# Tests only: the engine is async, so its tests need a runtime.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
