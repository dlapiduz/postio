[package]
name = "postio-core"
description = "UI-agnostic runtime: command bus, event stream, app state, undo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-channel = { workspace = true }
postio-config.workspace = true
postio-model.workspace = true
serde = { workspace = true }
# `net` is what compiles tokio's IO driver in, and without it
# `Builder::enable_io` does not even exist. Relying on another crate in
# the graph to unify it in would make whether this runtime can open a
# socket depend on who else is being built.
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
postio-test-support = { workspace = true, features = ["logs"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
