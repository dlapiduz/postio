# A one-message thread shows one Reply, and `e` opens one composer (#1173,
# #822).
#
# The defect: a single message drew a per-message Reply row and the
# conversation's own bar, both bound to `e`, so the key was ambiguous and
# the reader showed the same buttons twice.
#
# Re-expressed for Focus (T265): the fourth row of the demo inbox is a
# single message; `Return` opens it over the list, and its verbs are one row
# of buttons.
apps   = ["focus"]
source = { kind = "issue", ref = "#1173" }
proof  = "pinned"

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
id      = "single"
command = "open_message"
check   = { view = "reader", reading.id = { changed = true } }
expect  = "A single message is open. Its verbs are one row, with one Reply; nothing is drawn twice."

[[step]]
command = "reply"
check   = { composer.open = true, keyboard.field = "body" }
expect  = "Exactly one composer opens, as a reply to that message."
