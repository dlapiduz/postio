[package]
name = "postio-jmap"
description = "JMAP MailBackend adapter over Pimalaya's io-jmap (ADR 0018)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The RFC 8620/8621 protocol crate — coroutines plus the std blocking
# client. No TLS features: connections are opened on this workspace's own
# cancellable pimalaya-stream, exactly like postio-imap's OAuth exchange.
io-jmap = { version = "0.3", default-features = false, features = ["client"] }
pimalaya-stream = { version = "0.3", features = ["rustls-ring"] }

# The MailBackend seam and nothing else: default-features = false leaves
# io-imap and the IMAP TLS stack out of this crate's tree entirely.
postio-imap = { version = "0.2.0", path = "../postio-imap", default-features = false }
postio-model = { version = "0.2.0", path = "../postio-model" }

secrecy = { version = "0.10", default-features = false }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
