# `jobs = 2` is only the fallback: the machine-wide jobserver (`scripts/jobserver.sh`, via
# MAKEFLAGS) is the real limit and makes cargo ignore it (#1104).
[build]
jobs = 2
# The wrapper execs plain rustc when sccache is absent; an explicit RUSTC_WRAPPER wins.
rustc-wrapper = "scripts/rustc-wrapper.sh"

# Linking is the memory peak, so the linker's threads are capped; several sessions link at once.
# A bare program name, not a path: a per-worktree path changes every sccache key and cargo
# fingerprint (#1101).
# `scripts/install-shims.sh` puts `postio-linker` on PATH. One triple only: `--threads` support
# depends on the binutils.
[target.x86_64-unknown-linux-gnu]
linker = "postio-linker"
rustflags = [
    # `gcc`, not the default `gnu-lld-cc`: rustc appends its own `-fuse-ld=lld` after the script's
    # flags, which silently ignores mold. `scripts/linker.sh` restores lld when mold is absent.
    "-C", "linker-flavor=gcc",
    "-C", "link-arg=-Wl,--threads=4",
]

# The Mac uses the same shim to strip test binaries' symbols after the link. Changing it rebuilds
# every unit.
[target.aarch64-apple-darwin]
linker = "postio-linker"

# Every Linux test binary runs on a private headless compositor. A `cfg`, not a triple: a triple
# skipped aarch64 and every GTK test took its "no display" branch (#551). The runner fails open;
# POSTIO_HEADLESS=0 bypasses it. `aes` and `polyval` use ARMv8 AES/PMULL only with these cfgs (37.6
# us vs 3.6 us per page in software). A cfg table, so ARM Linux gets it too; it sets no other
# rustflags.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]

[target.'cfg(target_os = "linux")']
runner = "scripts/headless-runner.sh"

# TMPDIR on a tmpfs overflows when linking the GTK stack ("Disk quota exceeded").
# This covers the no-sccache path only; the sccache daemon fixes its own TMPDIR, so
# `scripts/rustc-wrapper.sh` overrides it (#359).
[env]
TMPDIR = { value = "target/tmp", relative = true }
# The C half of the cache fronts ccache, since sccache cannot normalize openssl-src's paths across
# worktrees (#736).
# A bare name: the `cc` crate emits rerun-if-env-changed=CC, so a per-worktree path reruns every C
# build script (#1101).
CC = "postio-cc"
