[package]
name = "postio-runtime"
description = "The half of the runtime that owns a database and a connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
postio-core.workspace = true
postio-imap.workspace = true
postio-model.workspace = true
postio-smtp.workspace = true
postio-storage.workspace = true
postio-sync.workspace = true
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
criterion = "0.7.0"
postio-storage = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "store_reads"
harness = false
