# The inbox with a backfill in flight: the top bar's sync label says how far
# it has got (#411).
#
# Focus's design references are never committed
# (specs/007-postio-focus/screens.md records each one).
apps   = ["focus"]
source = { kind = "design", ref = "none" }
seed   = "backfilling"

[[step]]
wait   = { ms = 300 }
check  = { app.focus.sync = "Syncing 12,400 of 81,744" }
expect = "The top bar's sync label says how far the backfill has got, not when mail last arrived."
