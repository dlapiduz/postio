# Several Claude sessions build this workspace at the same time, on one
# machine, sharing one target directory.
#
# Cargo defaults to one job per core. Four concurrent sessions on eight cores
# therefore ask for ~32 parallel compile jobs, and linking postio-app pulls in
# the whole GTK and WebKit stack — seven `rust-lld` processes at ~210 MB each
# were once resident together, with 150 MB of 15 GB free. Nothing was slow;
# everything was starved, and the machine spent its time in btrfs and dm-crypt
# kworkers servicing the swap that followed.
#
# Two jobs per session leaves the box responsive with four sessions running.
# Raise it when you are the only one building — `cargo build -j8`, or set
# CARGO_BUILD_JOBS, both of which override this.
[build]
jobs = 2
# One compile cache for the whole machine, in every worktree, without every
# session remembering `export RUSTC_WRAPPER=sccache`. The wrapper execs plain
# rustc when sccache is not installed, so nothing breaks on a fresh box; an
# explicit RUSTC_WRAPPER in the environment still wins over this.
rustc-wrapper = "scripts/rustc-wrapper.sh"

# Linking is the memory peak, not compiling. One fat binary that pulls in GTK,
# WebKit and SQLite is where the resident set spikes, so keep the linker's own
# parallelism modest too.
#
# Scoped to one triple deliberately, and it is *not* an oversight the way the
# runner below was (#551). `-Wl,--threads=2` is a linker flag whose support
# depends on the binutils on the box, not on the target: GNU ld only learned
# `--threads` recently, and widening this to a triple nobody here can build for
# would trade a memory-pressure tuning for a link that fails outright. It is a
# comfort setting for the machine this is developed on; the runner is a
# correctness one.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--threads=2"]

# Every test binary on **every Linux target** runs on a compositor of its own,
# so `cargo test` is headless by default and nobody has to remember a wrapper.
# postio-gtk has ~20 test binaries that present real windows; without this they
# land on whoever is at the keyboard, steal focus mid-keystroke, and — until it
# was fixed — left a save dialog behind that outlived the run.
#
# `cfg(target_os = "linux")` rather than a triple, because a triple is what
# #551 was: this sat under `[target.x86_64-unknown-linux-gnu]`, so on aarch64
# it never applied, no compositor started, and all ~117 GTK test files took
# their "no display, skip" branch and reported success having asserted nothing.
# A runner's absence is invisible by construction — that is the whole hazard —
# so it is scoped to the property that actually decides it: this is a Linux box
# with a compositor to talk to. macOS keeps getting no runner, which is right;
# `headless-runner.sh` reads /proc and needs XDG_RUNTIME_DIR.
#
# `runner` is resolved from the matching `[target.<cfg>]` table when no
# `[target.<triple>]` table names one — verified against this cargo, not
# assumed. Note this is *not* how `rustflags` composes: a triple table's
# rustflags suppress the cfg tables' entirely, which is why the two settings
# live apart above rather than being merged into one block.
#
# The runner fails open: no mutter, no XDG_RUNTIME_DIR, or a compositor that
# will not start, and it execs the binary unchanged. POSTIO_HEADLESS=0
# bypasses it. Only cargo's hash-suffixed test and bench binaries are sent to
# the compositor; `cargo run -p postio-app` and examples pass through to the
# real display (#315).
#
# `gtk_display_required.rs` is what notices when this stops applying.
[target.'cfg(target_os = "linux")']
runner = "scripts/headless-runner.sh"

# rustc and the linker write intermediate files to TMPDIR, which on this
# machine is a tmpfs — memory, with a 6 GB quota. Linking the GTK stack put
# gigabytes of scratch into RAM and then failed with "Disk quota exceeded",
# which reads like a compile error and is not one.
#
# `relative = true` resolves against the workspace root, so this stays correct
# for anyone who clones the repo rather than naming one machine's paths.
#
# This governs the *no-sccache* path only, and that is not a shortcoming —
# with sccache the compiler runs inside the shared daemon, which fixes its own
# TMPDIR when it is spawned and ignores every later client's. Setting this
# per-worktree is what pinned that daemon to a directory `issue-release.sh`
# would later delete, so `scripts/rustc-wrapper.sh` overrides it on that path;
# see the note there and #359. Leave the two in step: this is the fallback for
# a box with no sccache, where cargo runs rustc directly.
[env]
TMPDIR = { value = "target/tmp", relative = true }
# The C half of the compile cache. `rustc-wrapper` above covers only rustc;
# the C compiler inside the openssl-src, libsqlite3-sys and zstd-sys build
# scripts is invoked by make/cc directly and never saw a cache — 77% of a
# fresh worktree's postio-storage build was uncached C (#736), which ADR 0014
# had priced as "absorbed by sccache". The wrapper fronts **ccache**, not
# sccache: openssl-src builds inside each target dir and sccache cannot
# normalize the paths out of the hash, so it never hits across worktrees —
# measured, see the wrapper. Same fail-open shape as the rustc wrapper: no
# ccache on the box and the script is exactly `cc`. Cargo's [env] never
# overrides an environment variable that is already set, so an exported CC
# still wins, the way an exported RUSTC_WRAPPER does above.
CC = { value = "scripts/cc-wrapper.sh", relative = true }
