[package]
name = "postio-render"
description = "The reading renderer: message bodies drawn in-process, with no network and no C on the content path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Hooks for the render-thread tests; never enabled by a product build.
test-hooks = []

[dependencies]
# `net` and `system-fonts` are off (research R3): no network crate, and no fontconfig (C reading a
# message's codepoints) on the content path.
# `scripts/checks/check-renderer-is-memory-safe.py` holds the graph to that; blitz builds from
# `vendor/`.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["floats", "svg"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "=0.14.0"
anyrender_vello_cpu = "=0.18.0"
parley = { version = "0.12", default-features = false, features = ["std"] }
fontdb = "0.24"
skrifa = "0.44"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
kurbo = "0.13"
base64 = { workspace = true }
tracing = { workspace = true }
usvg = "=0.48"
postio-body = { workspace = true }
url = { workspace = true }
style = { package = "stylo", version = "0.22" }
unicode-normalization = "0.1"
static_assertions = "1.1"
postio-workspace-hack.workspace = true

[dev-dependencies]
postio-render = { path = ".", features = ["test-hooks"] }
# Arm B of the engine evaluation is a harness in `examples/` that stamps every element of a composed
# document with an index.
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"
postio-model = { version = "0.6.2", path = "../postio-model", features = ["test-corpus"] }
postio-ui = { version = "0.6.2", path = "../postio-ui" }
postio-test-support = { workspace = true, features = ["fidelity"] }
tempfile = { workspace = true }

[lints.rust]
# One site, `fonts.rs`'s `map_installed`: font files are memory-mapped because reading every one
# cost 198 MiB resident (research R3), and fontdb's mapping call is `unsafe fn`.
# `tests/render_rss_plateau.rs` installs a counting `GlobalAlloc`.
unsafe_code = "deny"
missing_docs = "allow"
unused_must_use = "deny"
[lints.clippy]
let_underscore_future = "deny"

[lints.cargo]
unused_dependencies = "allow"
