# The composer takes over the reading pane, and Escape gives it back (#1195).
#
# The defect: the composer was drawn in a quarter of the window, a corner
# of the pane, instead of taking the whole reading pane's place. The
# occupant is not observed; the frame shows it: it is the pane's occupant,
# filling it, and leaving brings the message back in the same place.
#
# Re-expressed for Focus (T265) in Focus's own reading pane (T232): `F8`
# opens messages beside the list, `Return` opens the cursor's row there, and
# the composer then takes that pane (screen 36). The classic app it was
# written against is removed by T256.
apps   = ["focus"]
source = { kind = "issue", ref = "#1195" }
proof  = "pinned"

[[step]]
command = "toggle_reading_pane"
check   = { composer.open = false }

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
id      = "open"
command = "open_message"
check   = { view = "reader", reading.id = { changed = true } }
expect  = "The message opens in the pane beside the list."

[[step]]
command = "compose"
check   = { composer.open = true, keyboard.region = "composer" }
expect  = "The composer fills the whole reading pane, edge to edge, with the list still beside it. It is not a small box in a corner."

[[step]]
command = "back"
check   = { composer.open = false, reading.id = { same_as = "open" } }
expect  = "The message is back in the pane, the same one that was there."
