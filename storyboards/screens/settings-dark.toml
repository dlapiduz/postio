# Settings in dark, on Accounts. Focus has no Appearance section
# (classic-parity rows 18 and 19).
#
# Focus's design references are never committed
# (specs/007-postio-focus/screens.md records each one).
apps   = ["focus"]
source = { kind = "design", ref = "none" }
preset = "settings"
vary   = { scheme = ["dark"] }
