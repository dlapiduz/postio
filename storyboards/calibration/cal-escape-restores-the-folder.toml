# must_pass: the twin of cal-escape-keeps-the-hits.
source      = { kind = "issue", ref = "#1474" }
calibration = "must_pass"
[[step]]
command = "search"
[[step]]
type    = "harbour"
settle  = { until = { rows.count = { changed = true } } }
[[step]]
key     = "Return"
[[step]]
command = "back"
expect  = "After Escape the list is the Inbox again, with every row back and the search field empty."
