[package]
name = "postio-session"
description = "The composition root without a toolkit: store, runtime, engines and the verb vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["std"] }
postio-config.workspace = true
postio-core.workspace = true
# `maildir` on: the composition root chooses a stored account's backend, so it must build every kind
# an account row can name.
postio-account = { workspace = true, features = ["maildir"] }
postio-calendar.workspace = true
postio-body.workspace = true
postio-extract.workspace = true
postio-jmap.workspace = true
postio-gmail.workspace = true
postio-index.workspace = true
postio-model.workspace = true
# This crate is where SQLite is allowed; the view layer and postio-core are guarded against it.
postio-runtime.workspace = true
postio-search.workspace = true
postio-smtp.workspace = true
# `WatchPolicy` (#932): naming it here lets a config value reach it.
postio-sync.workspace = true
postio-storage.workspace = true
postio-ui.workspace = true
# Same version as the crates that already carry one: a second `SecretString` type would defeat the
# zeroing.
secrecy = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-journald = "0.3"
tracing-log = "0.2"
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter"] }
postio-workspace-hack.workspace = true

[dev-dependencies]
# The application's allocator, so `body_index_memory` measures the heap the application would hold
# (#1606).
mimalloc = "0.1"
postio-test-support = { workspace = true, features = ["logs"] }
postio-storage = { workspace = true, features = ["test-support"] }
# The unkeyed digest a blob written before ADR 0014 was named by, so the fixture has a real
# pre-release shape.
blake3 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
postio-demo = { workspace = true }
postio-extract = { workspace = true }
postio-model = { workspace = true, features = ["test-corpus"] }

# Platform sections at the foot (`check-target-sections-last.py`).
# The extraction helper's socket cannot raise SIGPIPE (`SO_NOSIGPIPE` on Apple, `MSG_NOSIGNAL`
# elsewhere) through rustix's safe calls;
# the Mac app's `main` is Swift's, which does not ignore the signal as Rust's does.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "net"] }

[lints]
workspace = true
