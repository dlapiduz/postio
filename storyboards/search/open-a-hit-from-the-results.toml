# Opening a hit from the search results reads that message (#961, #767,
# #1526).
#
# The defects: search ignored the account scope, opening a hit reached an
# unwired dispatcher (nothing opened), and a hit was listed once per folder
# it was filed in. On the two-accounts seed, the hits are listed once each,
# across both accounts, and Return on the first puts exactly that message in
# the reader.
#
# Re-expressed for Focus (T265), and again for spec 010's search (#1825):
# Return in the field opens the results in the inbox's place, listed
# once each across both accounts; Return on the first opens exactly that
# message over them, its header naming the account it is in; `j` steps
# the results, not the list behind; Escape comes back to the results.
apps   = ["focus"]
source = { kind = "issue", ref = "#961" }
proof  = "pinned"
seed   = "two-accounts"

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search" }

[[step]]
type    = "harbour"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
expect  = "Top hits from both accounts, each saying which account it is in."

[[step]]
key     = "Return"
check   = { keyboard.region = "results", overlay.kind = "none" }
expect  = "The results for harbour, from both accounts, each conversation once in its month, and each row naming the account it is in."

[[step]]
id      = "first"
key     = "Return"
check   = { view = "reader", keyboard.region = "reader", reading.id = "57" }
expect  = "The reader shows the first result, the Tide gate interlock proposal, over the results, and its header names the account it is in: with two accounts enabled, two copies of one conversation must not read alike."

[[step]]
command = "next_message"
check   = { view = "reader", reading.id = { changed = true }, keyboard.region = "reader" }
expect  = "`j` steps to the next result in the results' order, not to the list's next row behind them."

[[step]]
command = "prev_message"
check   = { view = "reader", reading.id = "57" }
expect  = "`k` steps back to the first."

[[step]]
command = "back"
check   = { keyboard.region = "results", overlay.kind = "none" }
expect  = "Escape closes the message and the results are as they were, the ring on the result that was open."
