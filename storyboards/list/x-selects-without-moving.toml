# `x` takes the cursor's row into the selection and leaves the cursor where
# it is (specs/009-focus-macos T047; contract invariant 1).
#
# The cursor and the selection are separate (PRODUCT.md §9). Moving with `j`
# selects nothing, and `x` selects without moving: a person builds a
# selection row by row, with the cursor ring always on the row they are
# reading. The rule is the shared controller's (postio-focus), so the Mac
# and Linux apps cannot disagree on it.
apps   = ["focus"]
source = { kind = "flow", ref = "x selects without moving" }

[[step]]
wait    = { until = { cursor.index = 0 } }
check   = { keyboard.region = "list", selection.count = 0 }

[[step]]
id      = "first"
command = "toggle_selection"
check   = { cursor.index = 0, selection.count = 1 }
expect  = "The first row is selected and the cursor ring stays on it; the bulk bar counts one."

[[step]]
command = "next_message"
check   = { cursor.index = 1, selection.count = 1 }
expect  = "j moves the ring to the second row and selects nothing: the first row is still the only one selected."

[[step]]
command = "toggle_selection"
check   = { cursor.index = 1, selection.count = 2 }
expect  = "x adds the second row. The cursor has not moved; the bar counts two."

[[step]]
command = "toggle_selection"
check   = { cursor.index = 1, selection.count = 1 }
expect  = "x again takes the second row back out. The ring stays on it, drawn as the cursor and not as a selected row."
