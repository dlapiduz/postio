# The sidebar keyboard walk passes Snoozed and reaches Outbox (d2be7412).
#
# The defect: the sidebar's view rows (Flagged, Snoozed, Outbox) shared one
# row id, so `j` stuck on Snoozed and never reached Outbox. Fixed, so
# pinned. Classic does not observe which sidebar row has the ring, but
# walking opens each folder, so the list's row count names where the walk
# is: Flagged 9, Snoozed 0, Drafts 5, Outbox 1, Sent 7 in the outbox seed.
source = { kind = "commit", ref = "d2be7412" }
proof  = "pinned"
seed   = "outbox"

[[step]]
command = "focus_sidebar"
check   = { keyboard.region = "sidebar" }

[[step]]
command = "next_folder"
settle  = { until = { rows.count = 9 } }
check   = { keyboard.region = "sidebar", rows.count = 9 }

[[step]]
command = "next_folder"
settle  = { until = { rows.count = 0 } }
check   = { keyboard.region = "sidebar", rows.count = 0 }
expect  = "The walk lands on Snoozed (an empty list) and the next j moves on instead of sticking."

[[step]]
command = "next_folder"
settle  = { until = { rows.count = 5 } }
check   = { keyboard.region = "sidebar", rows.count = 5 }

[[step]]
command = "next_folder"
settle  = { until = { rows.count = 1 } }
check   = { keyboard.region = "sidebar", rows.count = 1 }
expect  = "The Outbox opens: the one queued send. j reached it from Drafts."

[[step]]
command = "next_folder"
settle  = { until = { rows.count = 7 } }
check   = { keyboard.region = "sidebar", rows.count = 7 }
