# Providers Postio ships settings for, as data -- not Rust literals.
#
# Every provider is one `[provider.<id>]` table. No named constant, no
# special-cased branch, no identifier that mentions a vendor anywhere else
# in the source (`docs/PRODUCT.md` §3). Adding the next provider is adding a
# table here and nothing else: no rebuild-by-hand, no Rust syntax.
#
# `crates/postio-imap/src/discovery/providers_toml.rs` is the schema this
# parses against, and `build.rs` fails the build if this file does not
# parse and validate against it -- see that module's doc comment. A user's
# own `$XDG_CONFIG_HOME/postio/providers.toml` is layered over this table at
# startup, in the same shape, with the user's own rows winning.
#
# `auth` is the preference order among the ways a provider can be signed
# into -- "app-password" or "oauth2" today. A row listing "oauth2" must
# carry an `[provider.<id>.oauth]` table naming `issuer`, or both
# `authorize` and `token`: RFC 8414 discovery metadata is one source for
# those two endpoints and the row is the other, and a row that names
# neither is a validation error caught here rather than at sign-in
# (ADR 0006 Q4, as amended by #152).
#
# None of today's rows uses OAuth: v1 speaks no OAuth flow yet (#192), and a
# provider that has turned password authentication off for good does not
# belong here until it does -- a prefilled form that cannot possibly
# authenticate is worse than an empty one, because the user blames the
# password they typed.

[provider.icloud]
display_name = "iCloud"
domains = ["icloud.com", "me.com", "mac.com"]
imap_host = "imap.mail.me.com"
imap_port = 993
imap_security = "tls"
smtp_host = "smtp.mail.me.com"
smtp_port = 465
smtp_security = "tls"
requires_app_password = true
password_help_url = "https://appleid.apple.com/account/manage"
auth = ["app-password"]

[provider.gmail]
display_name = "Gmail"
domains = ["gmail.com", "googlemail.com"]
imap_host = "imap.gmail.com"
imap_port = 993
imap_security = "tls"
smtp_host = "smtp.gmail.com"
smtp_port = 465
smtp_security = "tls"
requires_app_password = true
password_help_url = "https://myaccount.google.com/apppasswords"
auth = ["app-password"]

[provider.fastmail]
display_name = "Fastmail"
domains = ["fastmail.com", "fastmail.fm"]
imap_host = "imap.fastmail.com"
imap_port = 993
imap_security = "tls"
smtp_host = "smtp.fastmail.com"
smtp_port = 465
smtp_security = "tls"
requires_app_password = true
password_help_url = "https://app.fastmail.com/settings/security/devicekeys"
auth = ["app-password"]
