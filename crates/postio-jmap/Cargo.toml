[package]
name = "postio-jmap"
description = "JMAP MailBackend adapter over Pimalaya's io-jmap (ADR 0018)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }

# No TLS features: connections open on the workspace's own cancellable pimalaya-stream.
io-jmap = { version = "0.11.1", default-features = false, features = ["std"] }
pimalaya-stream = { workspace = true }

# The MailBackend seam only: `default-features = false` leaves io-imap and its TLS stack out of the
# tree.
postio-account = { version = "0.6.2", path = "../postio-account", default-features = false }
postio-model = { version = "0.6.2", path = "../postio-model" }

secrecy = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
url = { workspace = true }
postio-workspace-hack.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
