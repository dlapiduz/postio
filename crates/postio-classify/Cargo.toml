[package]
name = "postio-classify"
description = "Classification for Postio Focus: filter, hold and mark, decided in layers, with no path that sends mail."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["std"] }
postio-model = { workspace = true }
postio-search = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
postio-workspace-hack.workspace = true

[build-dependencies]
# build.rs parses data/senders.toml with the classifier's own parser, so a table that does not load
# does not build.
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# The own-text extraction the body stage uses, so the gate measures the detector production runs.
postio-body = { workspace = true }
postio-model = { workspace = true, features = ["test-corpus"] }

[lints]
workspace = true
