# The list's sort chip is reachable and operable from the keyboard (#1475, #499).
#
# The defect: the folder header showed a sort chip whose chevron did nothing.
# The row says the menu must open from the keyboard: Tab to the chip, Return,
# and a menu with the date options appears.
#
# Found while writing this: from the list, Tab goes to the reader (and a
# second Tab stays there), so the chip is never on the keyboard chain, and
# `toggle_result_order` is unbound in a folder's list. Left `open` until the
# chip is reachable.
source = { kind = "issue", ref = "#1475" }
proof  = "open"
design = "01-inbox-reading"

[[step]]
key     = "Tab"
check   = { keyboard.region = "list", keyboard.reachable = true }
expect  = "The keyboard is on the sort chip in the list header, and it shows a focus ring."

[[step]]
key     = "Return"
check   = { overlay.kind = "menu" }
expect  = "A menu of sort options opens over the chip."
