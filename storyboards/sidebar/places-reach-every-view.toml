# Every view is reached and lists its own mail, the Outbox among them
# (d2be7412).
#
# The defect: the view places (Flagged, Snoozed, Outbox) shared one row id,
# so the walk stuck on Snoozed and never reached the Outbox.
#
# Re-expressed for Focus (T265): Focus has no sidebar to walk
# (classic-parity row 1). Flagged and Snoozed are views with keys of their
# own (`g *`, `g z`), and the Outbox is a place in the `g o` popover while
# anything waits in it (T239). Each is reached and lists its own mail:
# Flagged eight, Snoozed none, and the Outbox the one queued send in the
# outbox seed. The classic app's sidebar it was written against is removed
# by T256.
apps   = ["focus"]
source = { kind = "commit", ref = "d2be7412" }
proof  = "pinned"
seed   = "outbox"

[[step]]
command = "go_to_flagged"
settle  = { until = { rows.count = 8 } }
check   = { scope = "Flagged", rows.count = 8 }

[[step]]
command = "go_to_snoozed"
settle  = { until = { rows.count = 0 } }
check   = { scope = "Snoozed", rows.count = 0 }
expect  = "Snoozed is reached, and empty; the next view is not stuck behind it."

[[step]]
command = "go_to_folders"
check   = { overlay.kind = "picker", keyboard.region = "picker" }

[[step]]
type    = "Outbox"

[[step]]
key     = "Return"
settle  = { until = { rows.count = 1 } }
check   = { scope = "Outbox", rows.count = 1, overlay.kind = "none" }
expect  = "The Outbox opens: the one queued send."
