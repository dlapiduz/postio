[package]
name = "postio-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `staticlib` is what the macOS app links; `cdylib` is what `uniffi-bindgen` reads metadata from;
# `lib` keeps it an ordinary dependency for tests.
[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
# A feature, not always-on: an in-RAM store is not a mode to reach by accident.
testing = ["dep:tempfile", "postio-storage/test-support"]
# Demo stores for screenshots and the design comparison; never in a shipped build, since it brings
# the in-memory store.
demo = ["testing", "dep:postio-demo"]

[dependencies]
async-channel = { workspace = true }
postio-body.workspace = true
postio-config.workspace = true
postio-core.workspace = true
postio-demo = { workspace = true, optional = true }
postio-focus.workspace = true
postio-account = { workspace = true, features = ["maildir"] }
# The store's one owner runs in this process: nothing else can share the store on macOS (ADR 0041).
postio-client.workspace = true
postio-host.workspace = true
postio-mcp.workspace = true
postio-runtime.workspace = true
postio-ui.workspace = true
postio-vault.workspace = true
postio-model.workspace = true
postio-contact-sync.workspace = true
# One clock for relative date operators, so both frontends resolve `after:yesterday` the same way.
chrono = { workspace = true, features = ["std"] }
# Parsed and highlighted in one place: two parsers accept different queries (#660).
postio-search.workspace = true
postio-session.workspace = true
postio-smtp.workspace = true
postio-storage.workspace = true
# Every blocking call runs the engine on a stack this crate owns: Swift's cooperative-pool threads
# give 512 KiB (`src/stack.rs`).
stacker = "0.1.25"
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = { workspace = true }
uniffi = { version = "0.32", features = ["cli"] }

[dev-dependencies]
# The crate's own testing feature; making it a default would ship it.
postio-ffi = { path = ".", features = ["testing", "demo"] }
# A `SecretStore` double that refuses, so the locked-keyring path never touches the developer's
# login keyring.
async-trait = { workspace = true }
chrono = { workspace = true, features = ["std"] }
postio-index.workspace = true
postio-demo.workspace = true
postio-storage = { workspace = true, features = ["test-support"] }
postio-test-support.workspace = true
tempfile = { workspace = true }

[lints]
workspace = true
