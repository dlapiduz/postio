[package]
name = "postio-runtime"
description = "The half of the runtime that owns a database and a connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-channel = { workspace = true }
chrono = { workspace = true, features = ["std"] }
# `FuturesUnordered` only, for the concurrent sync wave in `engine.rs`.
# `default-features = false` keeps the futures executor, its io traits and its
# `Sink` machinery out of the graph -- tokio is this crate's runtime, and the
# only thing missing from it is a way to poll a variable number of futures at
# once. Already in the lock file via `zbus`, so it costs no extra compile.
futures-util = { workspace = true }
postio-core.workspace = true
postio-account.workspace = true
postio-index.workspace = true
postio-model.workspace = true
postio-search.workspace = true
postio-smtp.workspace = true
postio-storage.workspace = true
postio-sync.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# The application's allocator, for `first_sync_memory`, which measures the
# heap the application would hold (#1606). A test binary may set its own.
mimalloc = "0.1"
postio-model = { workspace = true, features = ["test-corpus"] }
postio-storage = { workspace = true, features = ["test-support"] }
# The shared deadline dial: every wall-clock wait in a test answers to
# `POSTIO_TEST_PATIENCE` (#842, #957).
postio-test-support.workspace = true
# `smtp_wait_cpu.rs` implements `SmtpConnector`, which is `#[async_trait]`.
# Already in the lock via postio-smtp, so it costs no extra compile.
async-trait = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
