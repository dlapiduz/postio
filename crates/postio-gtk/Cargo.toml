[package]
name = "postio-gtk"
description = "GTK4/libadwaita frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
async-channel = { workspace = true }
chrono = { workspace = true, features = ["std"] }
gio = "0.22.9"
glib = { version = "0.22.9", features = ["v2_72"] }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_20"] }
pango = { version = "0.22.9", features = ["v1_56"] }
postio-body.workspace = true
postio-config.workspace = true
postio-core.workspace = true
postio-model.workspace = true
postio-ui.workspace = true
postio-search.workspace = true
thiserror = { workspace = true }
tracing = { workspace = true }
webkit6 = { version = "0.6", features = ["v2_50", "gtk_v4_18"] }

[dev-dependencies]
postio-test-support = { workspace = true, features = ["logs"] }
tracing-subscriber = { workspace = true }
gtk4-sys = "0.11.4"
postio-config.workspace = true
postio-model = { workspace = true, features = ["test-corpus"] }
tempfile = { workspace = true }

[build-dependencies]
glib-build-tools = "0.22.8"
postio-ui.workspace = true

# The consolidated GTK suite: a custom harness, because GTK initializes on
# exactly one thread and libtest runs tests on a pool — see
# tests/gtk_suite.rs for the whole story. #329.
[[test]]
name = "gtk_reader"
path = "tests/gtk_reader.rs"
harness = false

[[test]]
name = "gtk_suite"
path = "tests/gtk_suite/main.rs"
harness = false

[lints.rust]
# Not the workspace floor: see EXCEPTIONS in scripts/checks/check-lint-floor.py.
unsafe_code = "deny"

# A crate that keeps its own `[lints.rust]` inherits none of the workspace
# lints, so the clippy floor's most load-bearing rule is restated here:
# `let _ = some_async_call()` drops the future unpolled, which is how a sent
# draft went on existing. See the workspace `[lints.clippy]`.
[lints.clippy]
let_underscore_future = "deny"
