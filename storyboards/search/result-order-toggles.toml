# Search results can be switched between relevance and date order (#499).
#
# The defect: the results header showed a "Relevance" chip whose chevron did
# nothing, and there was no key. `toggle_result_order` is the keyboard path.
#
# Re-expressed for Focus (T265): the bar lists its order as a row ("Sorted
# by relevance"), and `O` switches it once the arrows have chosen a result
# (before that `O` is a letter, T241). The order row is what is read back.
apps   = ["focus"]
source = { kind = "issue", ref = "#499" }
proof  = "pinned"

[[step]]
command = "search"

[[step]]
type    = "harbour"

[[step]]
key     = "Return"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
check   = { keyboard.region = "search", app.focus.bar.highlighted = "order" }

[[step]]
id      = "relevance"
key     = "Down"
check   = { app.focus.bar.highlighted = "message" }

[[step]]
command = "toggle_result_order"
check   = { keyboard.region = "search", app.focus.bar.highlighted = "order", app.focus.bar.messages = { same_as = "relevance" } }
expect  = "The same hits, now newest first, and the order row says so."

[[step]]
key     = "Down"

[[step]]
command = "toggle_result_order"
check   = { app.focus.bar.highlighted = "order", app.focus.bar.messages = { same_as = "relevance" } }
expect  = "Back to relevance order."
