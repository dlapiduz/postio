# Archive acts on the selected messages and no others (#468, #1701, #811, #1300).
#
# The defect family: with several accounts, the selection's actions resolved
# the wrong messages (the cursor row, or another account's row with the same
# position). Three rows are selected with `x` on the two-accounts seed, then
# archived; exactly those three leave, the selection clears, and the list
# does not lose any other row.
#
# Re-expressed for Focus (T265): Focus starts with no cursor row, so `j`
# comes before the first `x`, and its one inbox across accounts lists both
# accounts' mail (78 rows). The classic app it was written against is
# removed by T256.
apps   = ["focus"]
source = { kind = "issue", ref = "#468" }
proof  = "pinned"
seed   = "two-accounts"

[[step]]
command = "next_message"
check   = { keyboard.region = "list", cursor.index = 0, rows.count = 78 }

[[step]]
id      = "first"
command = "toggle_selection"
check   = { selection.count = 1 }
expect  = "The first row is marked as selected, distinct from the cursor ring, and the bulk bar appears."

[[step]]
command = "next_message"
check   = { cursor.index = 1, selection.count = 1 }

[[step]]
command = "next_message"
check   = { cursor.index = 2, selection.count = 1 }

[[step]]
id      = "third"
command = "toggle_selection"
check   = { selection.count = 2 }

[[step]]
command = "next_message"

[[step]]
command = "toggle_selection"
check   = { selection.count = 3, rows.count = 78 }
expect  = "Three rows are selected: the first, the third and the fourth. The bulk bar says three."

[[step]]
command = "archive"
check   = { keyboard.region = "list", selection.count = 0, rows.count = 75, notice.undo = true }
expect  = "The three selected rows are gone, the other 75 are all still there, the bulk bar is gone, and undo is offered."
