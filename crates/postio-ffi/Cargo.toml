[package]
name = "postio-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `staticlib` is what the macOS app links; `cdylib` is what `uniffi-bindgen`
# reads metadata from when generating the Swift. `lib` stays so the crate is
# an ordinary dependency for tests.
[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
# An in-memory session, for tests on either side of the boundary. A feature
# rather than always-on: a store that lives only in RAM is not a mode a mail
# client should be able to reach by accident.
testing = ["dep:tempfile", "postio-storage/test-support"]

[dependencies]
async-channel = "2.5.0"
postio-body.workspace = true
postio-config.workspace = true
postio-core.workspace = true
postio-account.workspace = true
postio-runtime.workspace = true
postio-ui.workspace = true
postio-model.workspace = true
postio-session.workspace = true
postio-smtp.workspace = true
postio-storage.workspace = true
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
tracing = "0.1"
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
# The crate's own testing feature, the way postio-storage does it: a test
# needs the in-memory constructor, and making it a default would ship it.
postio-ffi = { path = ".", features = ["testing"] }
# A `SecretStore` double that refuses, so the locked-keyring path is tested
# without going near the developer's own login keyring.
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
postio-storage = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"

[lints]
workspace = true
