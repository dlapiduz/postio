[workspace]
resolver = "3"
members = [
    "crates/postio-model",
    "crates/postio-storage",
    "crates/postio-search",
    "crates/postio-body",
    "crates/postio-index",
    "crates/postio-config",
    "crates/postio-account",
    "crates/postio-jmap",
    "crates/postio-gmail",
    "crates/postio-ui",
    "crates/postio-smtp",
    "crates/postio-sync",
    "crates/postio-core",
    "crates/postio-runtime",
    "crates/postio-session",
    "crates/postio-gtk",
    "crates/postio-app",
    "crates/postio-ffi",
    "crates/postio-bench",
    "crates/postio-test-support",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# The compiler this workspace is actually built with, everywhere.
#
# This said 1.90 while rust-toolchain.toml pinned 1.98, so nothing had ever
# built on 1.90 and the claim rested on nothing. An MSRV is a promise made to
# someone downstream; the only consumer today is this repository, so the honest
# promise is the pin. `scripts/checks/check-toolchain-pinned.py` keeps the two equal.
#
# When Postio is published, this stops being free: supporting an older compiler
# then means a CI job that proves it, not a lower number here.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/dlapiduz/postio"
# Postio is an application, and these crates are its internals. None of them is
# published, and `cargo publish` on one would fail anyway -- they depend on each
# other by path, which crates.io refuses.
#
# Saying so has two effects beyond preventing an accident. It is the truth, and
# it is what lets `deny.toml`'s `allow-wildcard-paths` apply: cargo-deny treats
# a publishable crate's path dependency as a wildcard, because a published crate
# could not have one.
publish = false

# The lint floor every crate answers to.
#
# This used to be a `#![forbid(unsafe_code)]` / `#![warn(missing_docs)]` pair
# repeated in each `lib.rs`, and it drifted: `unsafe_code` reached seven crates
# of twelve and `missing_docs` nine, with three crates that contain no `unsafe`
# at all still not forbidding it. One table cannot drift.
# `scripts/checks/check-lint-floor.py` keeps it the only table.
#
# `forbid` rather than `deny` on purpose: `deny` can be switched off again by an
# `#[allow]` anywhere inside the crate, and a mail client that holds credentials
# and parses hostile input is the wrong place for `unsafe` to arrive quietly.
# The two crates that genuinely need it are exceptions with a reason, not a
# weaker default for everybody.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
postio-model   = { path = "crates/postio-model" }
postio-storage = { path = "crates/postio-storage" }
postio-search  = { path = "crates/postio-search" }
postio-body    = { path = "crates/postio-body" }
postio-index   = { path = "crates/postio-index" }
postio-config  = { path = "crates/postio-config" }
postio-session = { path = "crates/postio-session" }
postio-account = { path = "crates/postio-account" }
postio-jmap    = { path = "crates/postio-jmap" }
postio-gmail   = { path = "crates/postio-gmail" }
postio-ui      = { path = "crates/postio-ui" }
postio-smtp    = { path = "crates/postio-smtp" }
postio-sync    = { path = "crates/postio-sync" }
postio-core    = { path = "crates/postio-core" }
postio-runtime = { path = "crates/postio-runtime" }
postio-gtk     = { path = "crates/postio-gtk" }
postio-test-support = { path = "crates/postio-test-support" }

[profile.release]
lto = "thin"
codegen-units = 1

# Debug info is the heaviest part of compiling and linking the GTK/WebKit
# stack, and diagnosis here happens through tests and POSTIO_LOG, not a
# debugger. This was tuned once to `line-tables-only` without measuring what
# that left behind, and what it left behind was most of it. Measured on the
# `app_suite` test binary, cold builds of `cargo test --no-run -p postio-app
# --test app_suite` at `-j6` with sccache off, on an idle box:
#
#     debug                 cold build   binary   .debug sections
#     "line-tables-only"      301/307s   239 MB       153.6 MB
#     0                           282s    70 MB              0
#
# Faster *and* smaller: line tables are not free to emit across ~470 crates,
# and `target/debug/deps` holds ~330 executables that each carried them.
#
# What this costs was checked rather than assumed, and it is narrower than it
# sounds. `file:line` survives in **panic and assertion messages** -- what a
# failing test actually prints -- because those come from `#[track_caller]`
# and are compiled in as data, not read from DWARF. What is lost is
# `file:line` on the frames of a `RUST_BACKTRACE` dump (function names
# remain) and variable inspection in gdb. Nothing in this workspace asserts
# on a backtrace.
#
# **`strip = "debuginfo"` was tried here and does nothing.** The theory was
# that `debug = 0` cannot reach the precompiled std rlibs and only a link-time
# strip would. Measured, that is false: `debug = 0` alone leaves *zero* bytes
# of `.debug_*` in the binary. Adding `strip` produced a byte-identical 70 MB
# and cost 44 seconds (326s against 282s), because cargo passes `-C strip` to
# all ~470 units while only a handful are ever linked. Do not add it back.
#
# To get debug info for one run, with no edit here:
#
#     CARGO_PROFILE_DEV_DEBUG=line-tables-only cargo test -p <crate>
#
# Budget a full rebuild when you do: a profile change invalidates cargo's
# fingerprint for every unit in the graph, and sccache hashes the literal
# command line so it cannot serve the difference either (docs/engineering-
# notes.md, "mold looked like a memory win").
[profile.dev]
debug = 0

# Dev builds must stay fast to iterate on, but the perf budget is measured in
# release; see CLAUDE.md.
#
# `opt-level = 2` here meant every one of the ~470 third-party crates was
# optimized in dev, which is the largest single codegen cost in a cold
# worktree -- and cold worktrees are the normal case, because each one keeps
# its own `target/` (#76) and a claim starts from an empty one unless
# `--reuse` applies (#1012).
#
# Lowering this was tried, and measured, and put back. `opt-level = 1` looked
# free -- no gate can observe it, because the perf budgets are asserted as
# **counts** off SQLite's trace hook rather than as timings (CLAUDE.md,
# "Gated as counts, not as timings") and `cargo bench` measures release. But
# what it moves is the wall clock of the suites people wait on, and it moves
# it a long way: `cargo test -p postio-app --test app_suite` runs in **200s**
# with this at `2` and **382s** with it at `1`. Nearly double, for ~20s of
# cold-build time saved.
#
# So this line is not a leftover to tidy away: it is the reason the
# integration suites are bearable, and the thing it protects does not show up
# in any gate's pass or fail.
[profile.dev.package."*"]
opt-level = 2
