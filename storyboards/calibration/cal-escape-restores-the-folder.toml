# must_pass: the twin of cal-escape-keeps-the-hits.
apps        = ["focus"]
source      = { kind = "issue", ref = "#1474" }
calibration = "must_pass"

[[step]]
command = "search"

[[step]]
type    = "harbour"

[[step]]
key     = "Return"
settle  = { until = { app.focus.bar.messages = { changed = true } } }

[[step]]
command = "back"
expect  = "After Escape the command bar is gone and the Inbox is as it was, every row there."
