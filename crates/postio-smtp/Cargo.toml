[package]
name = "postio-smtp"
description = "SMTP sending built on Pimalaya io-smtp."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
io-sasl = { version = "=0.1.0", default-features = false }
io-smtp = { version = "=0.3.0", default-features = false, features = ["client"] }
# IDNA, for RFC 6531's easy half: a non-ASCII *domain* is punycoded and needs
# no extension at all. Already in the tree through `url`, so this adds a name
# rather than a crate. `io-smtp` has modules for RFC 1870, 3207, 3461, 4954,
# 7628 and 7677 and none for 6531, so the conversion is ours to do (#922).
idna = "1.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
postio-model.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-platform-verifier = "0.7"
secrecy = "0.10.3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
