# cargo-nextest configuration. Each test gets its own process, which changes what the machine looks
# like to a test.

# The measurement tier is not on the merge path (#1450). `#[ignore]` means only "this machine may
# lack what the test needs"; when a test runs is
# scheduling, answered by this filter and the `POSTIO-MEASUREMENT:` markers. `profile.nightly` lifts
# the filter with `all()`.
# `scripts/checks/check-measurement-tier.py` is what stops it drifting from
# the `POSTIO-MEASUREMENT:` markers in the tests themselves, and what enforces
# that nothing it selects reaches a live service.
# A `default-filter` is ANDed with the command line, so a measurement cannot run from this profile
# even by name:
#
#     cargo nextest run --profile nightly -E 'test(/^measurement::cache_pressure::/)'
# Wrapper and setup scripts are experimental (0.9.98+). Only the per-test-coverage profile wraps,
# off the merge path; every profile runs the test-home setup script.
experimental = ["setup-scripts", "wrapper-scripts"]

[profile.default]
# A hung test fails instead of stalling the run; the GTK suites carry their own deadlines
# (`POSTIO_TEST_PATIENCE` scales them).
slow-timeout = { period = "60s", terminate-after = 4 }

# No test on the merge path waits on the clock (CLAUDE.md, Tests). A case that sleeps for real is
# named here as `(package(p) & test(=module::case))`, with the marker on that case alone.
# The slow sweeps and large-fixture budgets are here too: 14 tests over a minute were 39% of the CPU
# time.
default-filter = 'not ((package(postio-storage) & test(/^measurement::/)) + (package(postio-runtime) & test(/^measurement::/)) + binary(smtp_wait_cpu) + binary(first_sync_memory) + binary(render_rss_plateau) + binary(body_index_memory) + (package(postio-index) & test(/^total_hits_cap::/)) + (package(postio-ffi) & test(/^focus_scroll::/)) + (package(postio-gtk) & test(/^every_command::/)) + (package(postio-gtk) & test(/^storyboard_catalogue::/)) + (package(postio-host) & test(/^measurement::/)) + (package(postio-render) & test(/^measurement::/)) + (package(postio-gtk) & test(/^gmail_keys::/)) + (package(postio-gtk) & test(/^visible_window::/)) + (package(postio-gtk) & test(/^startup_reads::/)) + (package(postio-gtk) & test(/^registry_parity::/)) + (package(postio-gtk) & test(/^a11y_sweep::/)) + (package(postio-gtk) & test(/^storyboards::/)) + (package(postio-index) & test(/^search_statement_budget::/)) + (package(postio-index) & test(/^ranking_weights::/)) + (package(postio-storage) & test(/^reclaim_pages::/)) + (package(postio-storage) & test(/^paging_scale::/)) + binary(logging_privacy) + (package(postio-storage) & test(=concurrent_open::many_databases_open_at_once_without_a_key_failure)) + (package(postio-storage) & test(=threads::thread_paging_stays_flat_over_a_large_folder)) + (package(postio-storage) & test(=list_statement_count::a_large_mailbox_never_materialises_more_rows_than_the_page_shows)) + (package(postio-index) & test(=header_index_size::the_header_index_stays_inside_its_per_message_ceiling)) + (package(postio-sync) & test(=resync_interactive_write::a_resync_batch_does_not_lock_out_an_interactive_write)) + (package(postio-host) & test(=tests::a_body_lost_to_a_dropped_link_is_asked_for_again_when_the_message_is_read)) + (package(postio-host) & test(=tests::a_pane_read_while_the_link_is_down_says_so_and_reads_again_when_it_returns)) + (package(postio-widgets) & test(=body_view_fallback::a_finished_render_is_shown_when_the_main_loop_was_late)) + (package(postio-widgets) & test(=body_view::a_very_tall_message_scrolls_to_its_end_within_budget)) + (package(postio-widgets) & test(=composer_focus::the_keyboard_walks_the_composer_in_a_defined_order)) + (package(postio-runtime) & test(=engine::the_top_up_does_not_outrank_the_policy_it_runs_under)) + (package(postio-runtime) & test(=engine::an_idle_engine_does_not_poll_the_queue)) + (package(postio-session) & test(=attachment_index_pass::an_attachment_that_was_never_downloaded_is_never_fetched)) + (package(postio-widgets) & test(=editor_format::every_formatting_command_lands_as_canonical_structure)) + (package(postio-tui) & test(=view::every_surface::every_control_takes_a_click_that_does_what_its_key_does)))'

# Retries are OFF: a retry turns a real failure into a slow pass, and this project's bugs work on
# the second look (#70). The exception is below.
retries = 0

# Cases that use the headless compositor's seat clipboard or keyboard focus: two at once take them
# from each other and the loser times out.
[test-groups]
compositor-seat = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(widgets_suite) & (test(/^editor_/) | test(/^editable_dialect::/) | test(/^composer_toolbar::/) | test(/^composer_inline_image::/) | test(/^body_view_select::/))'
test-group = 'compositor-seat'

# The sync-wave cases take ~31 s alone but 183-190 s in a full run, past their deadline; four cores
# each lets them finish.
[[profile.default.overrides]]
filter = 'binary(runtime_suite) & test(/^sync_wave::/)'
threads-required = 4

[profile.ci]
fail-fast = false

# The outer watchdog must outlast the inner one: CI's `POSTIO_TEST_PATIENCE: "3"` triples the GTK
# suites' `scaled(120s)` to 360s, so 60s x 8 = 480s. If the patience is raised in `ci.yml`, raise
# this with it.
slow-timeout = { period = "60s", terminate-after = 8 }

# A report of every case and its time, read by `scripts/ci-test-budget.py` after the run (written
# under target/nextest/ci/).
[profile.ci.junit]
path = "junit.xml"

# Everything, measurements included. `nightly.yml`'s full-suite job runs this; `all()` is a filter
# an `-E` narrows.
# The quarantine: cases that flake under the shared compositor on PRs that never touch them, each
# with its issue and date.
# A retry here is a loan, not a fix; the entry leaves when the case is repaired, and the steward
# asks after old ones.
#
#   marked_rows::a_selected_marked_row_shows_its_check_not_its_dot   4x  #1800, 2026-10-23
#   unsubscribe::the_setting_makes_the_one_action_delete              3x  #1800, 2026-10-23
#   unsubscribe::leaving_a_list_offers_one_action_on_a_toast_and_ignoring_it_keeps_the_mail
#                                                                      2x  #1800, 2026-10-23
#   row_menu::a_right_click_on_a_row_offers_its_verbs_with_their_keys 1x  #1800, 2026-10-23
[[profile.ci.overrides]]
filter = 'binary(focus_suite) & (test(=marked_rows::a_selected_marked_row_shows_its_check_not_its_dot) | test(=unsubscribe::the_setting_makes_the_one_action_delete) | test(=unsubscribe::leaving_a_list_offers_one_action_on_a_toast_and_ignoring_it_keeps_the_mail) | test(=row_menu::a_right_click_on_a_row_offers_its_verbs_with_their_keys))'
retries = 1

[profile.nightly]
# A bench's clock, not the merge path's: `cache_pressure` seeds 400,000 messages and takes ~393s on
# an idle workstation.
slow-timeout = { period = "120s", terminate-after = 6 }
default-filter = 'all()'
fail-fast = false

# A timeout sized from a local run needs a CI measurement before it is trusted, not a multiplier.
# No shared runner runs `cache_pressure` any more (see `ci-full` below), because it asserts a larger
# cache is measurably faster.
[[profile.nightly.overrides]]
filter = 'test(/^every_command::/)'
slow-timeout = { period = "120s", terminate-after = 10 }

[[profile.nightly.overrides]]
filter = 'package(postio-storage) & test(/^measurement::cache_pressure::/)'
slow-timeout = { period = "120s", terminate-after = 10 }

# Focus's first classification pass seeds 100,000 messages before it measures, so it gets
# cache_pressure's workstation clock.
[[profile.nightly.overrides]]
filter = 'package(postio-host) & test(/^measurement::first_classification::/)'
slow-timeout = { period = "120s", terminate-after = 10 }

# What a shared runner runs: `nightly`'s reach minus the measurement that asserts on a stopwatch.
# A named profile is one definition for both callers (`nightly.yml` and `release.yml`'s release
# gate); an `-E` in each drifted.
# `profile.nightly` keeps `all()` on purpose. The two storyboard passes are held out for
# `profile.ci-storyboards`.
[profile.ci-full]
slow-timeout = { period = "120s", terminate-after = 6 }
default-filter = 'not ((package(postio-storage) & test(/^measurement::cache_pressure::/)) + (binary(focus_suite) & (test(/^every_command::/) | test(/^storyboard_catalogue::/))))'
# One red crate must not hide the rest of an unwatched report or a release gate.
fail-fast = false

# The accessibility sweep stalls on shared runners while opening the composer's editor WebView
# (#1677). A stall is killed at two minutes and retried; `test-with-flake-retry.sh` only retries
# failures nextest reports per test.
[[profile.ci-full.overrides]]
filter = 'binary(focus_suite) & test(/^a11y_sweep::/)'
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 2

[[profile.ci-full.overrides]]
filter = 'package(postio-host) & test(/^measurement::first_classification::/)'
slow-timeout = { period = "120s", terminate-after = 10 }

# The determinism case compares two child processes' pixels byte for byte; beside other
# `focus_suite` cases the second child's archive frame differed, so it runs alone (spec 008).
[[profile.default.overrides]]
filter = 'binary(focus_suite) & test(/^storyboard_determinism::/)'
threads-required = "num-test-threads"

# Same for the two nightly storyboard cases: another case's window on the shared compositor changes
# what is drawn.
[[profile.default.overrides]]
filter = 'binary(focus_suite) & (test(/^every_command::/) | test(/^storyboard_catalogue::/))'
threads-required = "num-test-threads"

# Those two storyboard passes as a run of their own: `every_command` (~411 s) and
# `storyboard_catalogue` (~275 s) each take every test thread.
# The selection is written twice (here, negated in `profile.ci-full`);
# `scripts/checks/check-measurement-tier.py` fails if they differ.
[profile.ci-storyboards]
slow-timeout = { period = "120s", terminate-after = 6 }
default-filter = 'binary(focus_suite) & (test(/^every_command::/) | test(/^storyboard_catalogue::/))'
fail-fast = false

# The attachment text helper rides in the archive beside the test binary's profile directory, where
# `Extractor::locate` looks (#2178).
[profile.ci-storyboards.archive]
include = [
    { path = "debug/postio-extract-helper", relative-to = "target", depth = 0, on-missing = "error" },
]

# The generated pass opens a fresh window for every command in every context (~270 windows, 709 s on
# a workstation) (#1825).
[[profile.ci-storyboards.overrides]]
filter = 'test(/^every_command::/)'
slow-timeout = { period = "120s", terminate-after = 10 }

[[profile.ci-storyboards.overrides]]
filter = 'test(/^storyboard_catalogue::/)'
slow-timeout = { period = "120s", terminate-after = 10 }

# One coverage profile per case, for scripts/test-coverage-sets.py. The wrapper sets
# LLVM_PROFILE_FILE from the case's name, then runs the target runner.
[scripts.wrapper.per-test-profile]
command = { command-line = "scripts/per-test-profile.sh", relative-to = "workspace-root" }
target-runner = "within-wrapper"

[profile.per-test-coverage]
fail-fast = false

[[profile.per-test-coverage.scripts]]
filter = "all()"
run-wrapper = "per-test-profile"

# Each run gets its own XDG home under target/, so no test reads or writes the person's config,
# store or downloads. `paths::tests::a_test_never_sees_the_real_config` fails without it.
[scripts.setup.test-home]
command = { command-line = "scripts/test-home.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = "all()"
setup = "test-home"
