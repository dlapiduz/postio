# Return from the search field reaches the hits (#693, #1252).
#
# #693 asked for the keyboard to move from the query to the hits; #1252 was
# the same handoff flaking. Chain delivery passes the key through every
# controller on the real focus chain, which is what that flake was about.
#
# Re-expressed for Focus (T265): the bar lists the hits under the field as
# the word is typed; Return takes the highlight to the first, the field
# keeping the keyboard, and the arrows walk the hits from there.
apps   = ["focus"]
source = { kind = "issue", ref = "#693" }
proof  = "pinned"

[[step]]
command = "search"

[[step]]
type    = "harbour"
settle  = { until = { app.focus.bar.messages = { changed = true } } }

[[step]]
key     = "Return"
check   = { keyboard.region = "search", keyboard.typing = true, keyboard.reachable = true, overlay.kind = "finder", app.focus.bar.highlighted = "message" }
expect  = "Return reaches the first hit, highlighted; the field keeps the keyboard and the query."

[[step]]
key     = "Down"
check   = { keyboard.region = "search", keyboard.reachable = true, app.focus.bar.highlighted = "message" }
expect  = "Down walks on to the next hit, with the query still in the field."
