[package]
name = "postio-calendar"
description = "Calendar invitations carried in mail: parsing them, and writing the replies that answer them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Pinned exactly: 0.4 is expected to move from chrono to jiff, which should be a decision. `jmap`
# off keeps JSCalendar and JSContact out.
calcard = { version = "=0.3.14", default-features = false }
chrono = { workspace = true, features = ["std"] }
# Pinned exactly, as calcard was: new, and behind this crate's adapter (plan R2).
ical-rs = { version = "=0.7.3", default-features = false, features = ["parser", "tzdb"] }
postio-model = { workspace = true }
thiserror = { workspace = true }
postio-workspace-hack.workspace = true

[dev-dependencies]
postio-model = { workspace = true, features = ["test-corpus"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Imported as `ical`, its library name, which cargo-machete does not map back to the package.
ignored = ["ical-rs"]
