# The PR title against CLAUDE.md's commit rules. PRs merge squashed, so the title is the subject on
# main, and a title edited on GitHub bypasses the commit-msg hook. Its own workflow so `edited` does
# not re-run all of ci.yml.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Check the title as the squash subject
        # Through the environment, never interpolated into the script: a title is
        # attacker-controlled text.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/commit-msg.py --title "$TITLE"
