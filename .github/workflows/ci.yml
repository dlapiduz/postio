name: CI

# Gates that run only when someone remembers are gates that do not exist.
#
# Runner images: the jobs that only need cargo metadata or rustfmt run on
# ubuntu-latest. The jobs that actually compile the GTK frontend run on
# ubuntu-26.04, because postio-gtk pins gtk4 `v4_20`, libadwaita `v1_7` and
# pango `v1_56`, and those feature gates check the *system* library version at
# build time. ubuntu-24.04 ships GTK 4.14 / libadwaita 1.5 and would fail before
# compiling a line. Ubuntu 26.04 (resolute) ships GTK 4.22.2, libadwaita 1.9.1,
# WebKitGTK 2.52.3 and pango 1.57 -- effectively the versions CLAUDE.md records
# as verified on the development box.
#
# ubuntu-26.04 is still a preview runner label. If it is ever withdrawn, the
# equivalent fallback is a `container: fedora:44` running the exact dnf line
# from CLAUDE.md, rather than downgrading the feature floor.

# Prose does not need a compiler. A docs-only change used to spend ~4 minutes
# of runner time proving that Rust it did not touch still builds.
#
# Listed explicitly rather than ignoring `docs/**`, and that is deliberate:
# `docs/keybindings.md` is GENERATED from the command registry and
# `postio-core/tests/keybindings_doc.rs` fails when the two drift. Ignoring the
# whole directory would let a hand-edit of it through unverified, which is
# exactly the drift that test exists to catch.
#
# Naming each prose file beats a `docs/**` glob with a `!` exception, because
# it fails in the safe direction: a doc nobody has listed here runs CI, which
# costs four minutes. A generated file nobody remembered to exclude would skip
# it, which costs a silent regression.
# PAUSED 2026-08-25: this repo is private, and a push-plus-pull_request
# trigger means every merge bought two full runs -- one on the PR, one again
# on the push to main that landed it -- against a private repo's small free
# minutes allotment. That ran the account out. Public repos get free minutes
# on GitHub-hosted runners, so the real fix is going OSS; until then this
# workflow is workflow_dispatch-only, and the steward loop runs
# `cargo test --workspace --no-fail-fast` by hand against main periodically
# instead (see CLAUDE.md's "CI is paused" note). Restore by uncommenting
# `push`/`pull_request` below -- the paths-ignore list does not need to
# change.
on:
  # push:
  #   branches: [main]
  #   paths-ignore: &prose
  #     - '*.md'
  #     - '.claude/**'
  #     - 'Design/**'
  #     - 'docs/decisions/**'
  #     - 'docs/images/**'
  #     - 'docs/PRODUCT.md'
  #     - 'docs/ARCHITECTURE.md'
  #     - 'docs/engineering-notes.md'
  #     - 'docs/session-prompts.md'
  #     - 'docs/architecture-review-2026-08.md'
  # pull_request:
  #   paths-ignore: *prose
  workflow_dispatch:

# Least-privilege default: no job here pushes a commit, opens a PR, or
# touches an issue. Without this block every step -- including the
# third-party actions below -- gets whatever GITHUB_TOKEN scope the
# repository default grants, which may be read/write. #145.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

  # A cold debug build of this graph -- GTK, WebKit, ICU, and ~25 test
  # binaries that each statically link the lot -- ran a runner out of disk and
  # killed lld with SIGBUS mid-link. DWARF is the bulk of it, and none of it
  # earns its keep here: line tables still give backtraces function names and
  # line numbers, which is everything CI reads.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

  # .cargo/config.toml pins `jobs = 2` because four Claude sessions share one
  # eight-core workstation. That reasoning does not travel: a runner is one
  # job on its own machine, and inheriting the limit throttled CI to a quarter
  # of the box for no benefit. CARGO_BUILD_JOBS overrides the config file.
  CARGO_BUILD_JOBS: 4

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No toolchain selected here: rust-toolchain.toml names the exact
      # version and its components, and `rustup show` installs what it names.
      # A `rustup default stable` in this file would silently win over the
      # pin, which is the bug issue #38 is about — reintroduced in one line.
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          cargo fmt --version

      - name: cargo fmt --check
        run: cargo fmt --all --check

  boundaries:
    name: Crate boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Only `cargo metadata` is needed here: it resolves the dependency graph
      # without compiling anything, so this job needs no GTK system libraries
      # and finishes in seconds.
      # The pin decides; see the note in the `fmt` job.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Enforce architectural invariants
        run: python3 scripts/check-crate-boundaries.py

      - name: Enforce no personal data in the repository
        # Output is redacted by default -- these logs are public. Run the
        # script locally with --reveal to see the offending values.
        # POSTIO_DENY_NAMES is optional: without it the reserved-domain rule
        # still runs. A runner's git config is the bot's, so the git fallback
        # cannot see a maintainer's name; set the secret to enable that rule.
        env:
          POSTIO_DENY_NAMES: ${{ secrets.POSTIO_DENY_NAMES }}
        run: python3 scripts/check-no-personal-data.py

      - name: Refuse email's tracking mechanisms without recorded consent
        # Read receipts and List-Unsubscribe One-Click both tell a sender that
        # a real person read the message. Neither exists in Postio; this is
        # what notices the day one arrives inside a patch about something
        # else. See scripts/check-no-silent-tracking.py and postio-qhz.2.
        run: python3 scripts/check-no-silent-tracking.py

      - name: Enforce the lint floor
        # `[workspace.lints]` is the only place the floor is set. This is what
        # notices a new crate that forgets to inherit it -- a missing lint
        # produces no output at all, so nothing else would. See #95.
        run: python3 scripts/check-lint-floor.py

      - name: Refuse a floating rustc
        # CI and every session must agree on one compiler. This is what
        # notices a `rustup default stable` coming back into a workflow,
        # where it would silently win over rust-toolchain.toml. Issue #38.
        run: python3 scripts/check-toolchain-pinned.py

      - name: Refuse GTK initialization from a unit test
        # `cargo test` runs a crate's unit tests on a thread pool in one
        # process, and GTK may be initialized from one thread per process.
        # A second one aborts the whole binary on a signal, taking every
        # other test in the crate with it -- which is how this job first
        # reported zero of postio-gtk's 305 passing tests. See #41.
        run: python3 scripts/check-no-gtk-init-in-unit-tests.py

      - name: Refuse a tokio await on the GTK main context
        # `spawn_future_local` runs on the glib main loop, which has no tokio
        # reactor. 0.1.0 awaited the keyring there and panicked with "there is
        # no reactor running" the instant a login succeeded, with every gate
        # green. See scripts/check-runtime-crossings.py and #66.
        run: python3 scripts/check-runtime-crossings.py

      - name: Prove the boundary check actually fails when violated
        run: python3 scripts/test-check-crate-boundaries.py

      - name: Prove the toolchain check actually fails when violated
        run: python3 scripts/test-check-toolchain-pinned.py

      - name: Prove RUSTUP_TOOLCHAIN cannot reach a gate
        # The pin only guarantees anything if a session's own environment
        # cannot override it; this exercises issue-land.sh and
        # test-headless.sh with an uninstalled toolchain named in
        # RUSTUP_TOOLCHAIN and checks that neither one lets it through. #112.
        run: python3 scripts/test-rustup-toolchain-cleared.py

      - name: Prove issue-land.sh's commit guard only fires when needed
        # A clean tree with commits already on the branch -- the state
        # "commit as you go" leaves a session in -- must land with no -m;
        # a dirty tree with no -m must still refuse, but say so. #120.
        run: python3 scripts/test-issue-land-commit-guard.py

      - name: Prove issue-land.sh's merge step survives main's worktree
        # `gh pr merge --rebase --delete-branch` fails here every time,
        # because deleting the local branch makes `gh` switch this worktree
        # off it first, and `main` is permanently checked out elsewhere.
        # The stubbed `gh` fails loudly, with the real error text, if it is
        # ever asked for --delete-branch again. #167.
        run: python3 scripts/test-issue-land-merge.py

      - name: Prove issue-claim.sh's blockedBy check reads the real field
        # `gh issue list --json blockedBy` never emits `closed` -- it emits
        # `state: "OPEN"|"CLOSED"`. Reading the wrong key made `not False`
        # always true, so every issue with any blockedBy entry was reported
        # blocked forever, even once its blocker closed. #247.
        run: python3 scripts/test-issue-claim-blocked-by.py

      - name: Prove issue-land.sh's gates do not share a target directory
        # #178 gave every worktree its own target/ because sharing one
        # compiles a worktree's crate against a sibling's; issue-land.sh kept
        # defaulting to the main checkout's, so the one run a merge is staked
        # on was the one still sharing. This builds a real crate through
        # --gates-only and looks at where the artifacts landed. #253.
        run: python3 scripts/test-issue-land-target-dir.py

      - name: Prove issue-land.sh hands over to the machinery it rebases in
        # It rebases the tree it lives in, so a fix to the landing machinery
        # was invisible to the first run that pulled it in -- which is how a
        # three-crate change merged without waiting for CI. #160.
        run: python3 scripts/test-issue-land-rebase-handover.py

      - name: Prove the GTK-init check actually fails when violated
        # The tree is clean, so this check passes whether it works or not.
        # Its own failure modes -- including the brace scanner that decides
        # where a test module ends -- are exercised instead.
        run: python3 scripts/test-check-no-gtk-init-in-unit-tests.py

      - name: Prove the lint-floor check actually fails when violated
        run: python3 scripts/test-check-lint-floor.py

      - name: Prove the personal-data check reads the right files
        # It read every tracked file as UTF-8 with errors="ignore", binaries
        # included -- and "ignore" *deletes* undecodable bytes, splicing
        # what sat either side into an address that exists nowhere in the
        # file. A screenshot's compressed pixels did exactly that and blocked
        # every landing in the repository. #144.
        run: python3 scripts/test-check-no-personal-data.py

      - name: Prove the tracking check actually fails when violated
        # It guards something that does not exist yet, so on a clean tree it
        # passes whether it works or not. That is the shape of check that
        # rots silently, so its own failure modes are exercised too.
        run: python3 scripts/test-check-no-silent-tracking.py

      - name: Prove the CI-expectation predicate answers both ways
        # It decides whether issue-land.sh may merge without seeing a check.
        # Wrong one way it costs a re-run; wrong the other it merges code CI
        # never looked at, which is what happened on #135. See #139.
        run: python3 scripts/test-ci-expected-workflows.py

      - name: Prove the check-wait refuses to merge when a check never appears
        # Drives scripts/wait-for-checks.sh against a stubbed `gh`, including
        # the registration race in both directions.
        run: python3 scripts/test-wait-for-checks.py

      - name: Prove the runtime-crossing check catches the bug it exists for
        # Its first case is the 0.1.0 defect verbatim in shape. A guard that
        # would not have caught the fault it was written for is worth nothing.
        run: python3 scripts/test-check-runtime-crossings.py

      - name: Assert CI never runs the network-touching tests
        run: |
          # Live-server tests are #[ignore]d and must stay out of CI. The
          # pattern is split so this guard does not match itself.
          flag="--ign""ored"
          if grep -rnF -- "$flag" .github/workflows; then
            echo "::error::CI must not run the ignored tests; they talk to a live mail server."
            exit 1
          fi
          echo "ok: no workflow opts into the live-server tests."

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `Cargo.lock` holds ~405 packages and nothing checked any of them until
      # #97. This is the "what is in the graph at all" question; the crate
      # boundary check above asks which of *our* crates may reach which, and
      # neither substitutes for the other.
      #
      # Its own job on ubuntu-latest rather than a step in `build`: it needs
      # cargo metadata and no GTK, so it runs in seconds beside the other cheap
      # checks instead of waiting on the workspace to compile.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  build:
    name: Clippy and tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Ubuntu equivalents of the Fedora packages in CLAUDE.md:
      #   gtk4-devel        -> libgtk-4-dev
      #   libadwaita-devel  -> libadwaita-1-dev
      #   webkitgtk6.0-devel-> libwebkitgtk-6.0-dev
      #   sqlite-devel      -> libsqlite3-dev
      #   libsecret-devel   -> libsecret-1-dev
      #   glib2-devel       -> libglib2.0-dev
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libsqlite3-dev \
            libsecret-1-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            mutter \
            xvfb

      # The pin decides; see the note in the `fmt` job.
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version && cargo clippy --version

      # The cache key has to name the compiler. It no longer moves on its own
      # -- rust-toolchain.toml pins it (#38) -- but the bump still happens, as
      # a commit, and the cache must not survive it: a key of Cargo.lock alone
      # still matches afterwards, so the runner spends ~50s restoring 2 GB of
      # artifacts built by the old compiler that cargo then throws away. A miss
      # is cheaper than a restore that buys nothing.
      - name: Identify the compiler
        id: rust
        run: echo "version=$(rustc --version | tr ' ()/' '----')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and target dir
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-build-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-${{ steps.rust.outputs.version }}-

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Sixty test files in this workspace open with "no display? skip and
      # return", which is right on a contributor's headless shell and wrong
      # here: a runner with no display returned early from every one of them
      # and reported success. The accessibility audit that docs/PRODUCT.md §20
      # depends on is one of the sixty, so that guarantee went unenforced on
      # every push until #114. A green tick meaning "nothing ran" is worse
      # than a red one.
      #
      # This gives `.cargo/config.toml`'s runner what it needs rather than
      # working around it. `scripts/headless-runner.sh` already brings up
      # `mutter --headless` and is what every local run uses; all it wants is
      # `mutter` on PATH and an `XDG_RUNTIME_DIR`, neither of which a runner
      # has by default. Supplying them means CI tests the same Wayland
      # configuration developers do — against the compositor the application
      # actually targets — instead of a second, differently-behaved one.
      #
      # Xvfb is the backstop, not the plan. A runner has no logind seat and no
      # session bus, so `mutter --headless` may well refuse to start; the
      # runner then fails open and execs the test binary unchanged, which
      # inherits the DISPLAY set here. Belt and braces, because the failure
      # this is guarding against is silent.
      #
      # `gtk_display_required.rs` fails the build if both paths ever stop
      # working, so the skips cannot come back unnoticed.
      - name: Give the GTK suites a display
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          # The socket, not `xdpyinfo`, which lives in x11-utils and would be
          # a second package to install for one readiness check.
          for _ in $(seq 1 40); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.25
          done
          [ -S /tmp/.X11-unix/X99 ] \
            || { echo "::error::Xvfb never came up; the GTK suites would all skip"; exit 1; }

          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"

          {
            echo "DISPLAY=:99"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"

      # The default test suite never touches the network: live iCloud tests are
      # #[ignore]d, and nothing here opts back into them.
      - name: cargo test
        run: cargo test --workspace

      # `#![warn(missing_docs)]` has been on most crates from the start and
      # failed nothing, because no job ever built the docs. Denying warnings
      # here is what makes that attribute mean something -- and it catches
      # broken intra-doc links, which are invisible until somebody browses
      # the docs. There were 41 of them the first time this ran. See #96.
      #
      # A step in this job rather than a job of its own: rustdoc needs the GTK
      # system libraries and a warm target dir, and both are already here.
      #
      # `private_intra_doc_links` is allowed on purpose. These docs are written
      # for contributors and cross-reference internals deliberately; the build
      # passes --document-private-items, so those links do resolve. The lint
      # exists for published crate docs, which this is not.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps --document-private-items

      # Keep the ~400 third-party crates; drop our own, which every commit
      # invalidates anyway. Measured at ~39 MB against a ~2 GB cache, so this
      # is housekeeping rather than a speed-up -- the win is that a restored
      # cache never carries a stale artifact of ours for cargo to reason
      # about. Deliberately conservative: it names only files this workspace
      # produces, because deleting a third-party rlib by accident would make
      # every later build slower, not faster.
      #
      # Runs as a normal step, which is what makes it take effect: post steps
      # run after all normal ones, so actions/cache saves what is left here.
      - name: Drop workspace artifacts before caching
        if: always()
        run: |
          before=$(du -sm target 2>/dev/null | cut -f1 || echo 0)
          rm -rf target/*/incremental
          rm -f  target/*/deps/libpostio_*.rlib \
                 target/*/deps/libpostio_*.rmeta \
                 target/*/deps/postio_*.d \
                 target/*/deps/libpostio_*.d
          rm -rf target/*/.fingerprint/postio-*
          echo "cached target: ${before}MB -> $(du -sm target 2>/dev/null | cut -f1 || echo 0)MB"
