# Toggle sidebar works from the palette and from Ctrl+B (#756).
#
# The defect: the command did nothing from the palette or the key. Fixed,
# so pinned. Classic reports the sidebar's visibility as app.classic.*; the
# frames are what a reviewer judges, the checks pin the keyboard.
source = { kind = "issue", ref = "#756" }
proof  = "pinned"
apps   = ["classic"]

[[step]]
command = "command_palette"
check   = { overlay.kind = "palette" }

[[step]]
type    = "toggle sidebar"

[[step]]
key     = "Return"
check   = { overlay.kind = "none" }
expect  = "The palette closes and the sidebar is gone; the list has its width."

[[step]]
key     = "ctrl+b"
expect  = "Ctrl+B brings the sidebar back."
