[package]
name = "postio-gmail"
description = "Gmail REST MailBackend adapter over Pimalaya's io-gmail (ADR 0018)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }

# The Gmail REST v1 protocol crate — coroutines plus the std blocking
# client. No TLS features: connections open on this workspace's own
# cancellable pimalaya-stream, like the JMAP adapter beside it.
io-gmail = { version = "0.3", default-features = false, features = ["client"] }
pimalaya-stream = { workspace = true }

# The MailBackend seam and nothing else.
postio-account = { version = "0.3.0", path = "../postio-account", default-features = false }
postio-model = { version = "0.3.0", path = "../postio-model" }

tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
