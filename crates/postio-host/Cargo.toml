[package]
name = "postio-host"
description = "What owns Postio's store in the app that opened it, and serves that app's frontend (ADR 0041)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-channel = { workspace = true }
chrono = { workspace = true, features = ["std"] }
# Focus mode's body stage asks the classifier what a body says (spec 007):
# the classifier sends nothing and reaches nothing, by its boundary rule.
postio-classify.workspace = true
# An invitation's calendar part, read into the marker Focus draws (spec 007
# T110). A pure leaf: no store, no network.
postio-calendar.workspace = true
# The newest message's own words, which is all the needs-action detector
# reads and all a marker may quote (spec 007 FR-104).
postio-body.workspace = true
# The person's own model, when `[focus.model]` names one (spec 007
# milestone 2): the needs-action question asked of it in the built-in
# detector's place. It cannot send mail, by its boundary rule.
postio-ai.workspace = true
postio-client.workspace = true
postio-core.workspace = true
postio-config.workspace = true
postio-account.workspace = true
postio-index.workspace = true
postio-model.workspace = true
postio-runtime.workspace = true
postio-search.workspace = true
postio-session.workspace = true
postio-storage.workspace = true
postio-sync.workspace = true
postio-ui.workspace = true
# The Obsidian vault Focus captures into (spec 007 US15): read and appended
# to on this computer, answering the client's capture requests.
postio-vault.workspace = true
# A digest's summary, kept with its delivery as JSON (spec 007 T154).
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# Its fake runtime: no host test opens a connection, loopback included.
postio-ai = { workspace = true, features = ["test-support"] }
async-trait = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
postio-smtp.workspace = true
postio-account = { workspace = true, features = ["imap", "test-server"] }
postio-storage = { workspace = true, features = ["test-support"] }
serde-xml-rs = { workspace = true }
postio-test-support.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
