[package]
name = "postio-gtk"
description = "GTK4/libadwaita frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_7"] }
ammonia = "4"
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
gio = "0.21.5"
glib = { version = "0.21.5", features = ["v2_72"] }
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_20"] }
pango = { version = "0.21.5", features = ["v1_56"] }
pangocairo = "0.21.5"
postio-config.workspace = true
postio-core.workspace = true
postio-model.workspace = true
postio-search.workspace = true
thiserror = "2.0.20"
tracing = "0.1.44"
webkit6 = { version = "0.5", features = ["v2_50", "gtk_v4_18"] }

[dev-dependencies]
criterion = "0.7.0"
gtk4-sys = "0.10.3"
postio-config.workspace = true
postio-model = { workspace = true, features = ["test-corpus"] }
tempfile = "3.27.0"

[build-dependencies]
glib-build-tools = "0.21.0"

[[bench]]
name = "list_scroll"
harness = false

[[bench]]
name = "thread_drill"
harness = false
