# The review queue and the merge sheet (specs/011-focus-contacts S10, handoff
# screen 07): g w opens Contacts and the sheet on the strongest group of
# records that look like one person. The arrows choose whose name and photo
# are kept; n says they are two people and moves on; Escape is Later; Return
# merges, and the next group follows. Every line under "Why we think so" is
# one the scorer (`postio-classify` duplicates::score) said. The counter says
# how many groups are left, as the strip's Worth a look does (#2243).
apps   = ["focus", "macos"]
source = { kind = "spec", ref = "specs/011-focus-contacts S10" }
seed   = "small"
design = "07-merge-duplicates"

[[step]]
wait    = { until = { cursor.index = 0 } }

[[step]]
id      = "sheet"
command = "contacts_suggestions"
expect  = "A sheet 780 wide hangs from the strip over a dimmed Contacts view: “These N look like the same person”, what merging keeps, a card per record (avatar, name, saved or not saved, address, messages and last, and “Keep this name and photo” on the one with the accent ring, “Address kept” on the rest), “Why we think so” with a tick on each line, what the merge would make (name, role, starred address first, Result with the messages added up and what is folded in), and along the foot “Undo with ⌘Z. Merged records can be split again from the card.”, Not the same n, Later Esc and Merge ↩ filled."

[[step]]
id      = "choose"
command = "next_message"
expect  = "The ring moves to the next card and the result preview takes that record's name and photo."

[[step]]
id      = "later"
command = "back"
expect  = "Later: the sheet is gone and Contacts is as it was; nothing was merged."

[[step]]
command = "contacts_suggestions"

[[step]]
id      = "not-the-same"
command = "suggestion_dismiss"
expect  = "Not the same: this group is gone and the next, if any, is drawn; the Worth a look count is one lower."

[[step]]
id      = "merge"
command = "contact_show_mail"
check   = { notice.undo = true }
expect  = "Return merges into the kept record and the last group follows; the counter says one is left, as the strip's Worth a look says one set. The list under the sheet shows its rows in every frame, one person where there were several: it never blanks while it is read again."

[[step]]
id      = "undo"
command = "undo"
check   = { notice.tone = "success" }
expect  = "z, as the sheet's foot teaches, takes the merge back with the sheet still up: the toast says it was undone, the records are apart again in the list behind, and the group is back in the queue: the counter says two sets are left, as the strip does."

[[step]]
id      = "again"
command = "contact_show_mail"
expect  = "Return merges the group on screen once more, and the one the undo brought back follows: one set left, in the counter and the strip."

[[step]]
id      = "last"
command = "contact_show_mail"
expect  = "Merging the last group leaves nothing to review: the sheet closes onto Contacts, the list shows one person where there were several, and Worth a look is one set lower."

# The sheet's counter, which only Postio publishes: how many groups are left,
# the one on screen among them (#2243).
[app.focus.step.sheet]
check = { app.focus.contacts.merge = "3 sets left" }

[app.focus.step.not-the-same]
check = { app.focus.contacts.merge = "2 sets left" }

[app.focus.step.merge]
check = { notice.undo = true, app.focus.contacts.merge = "1 set left" }

[app.focus.step.undo]
check = { notice.tone = "success", app.focus.contacts.merge = "2 sets left" }

[app.focus.step.again]
check = { app.focus.contacts.merge = "1 set left" }

[app.focus.step.last]
check = { app.focus.contacts.merge = { absent = true } }
