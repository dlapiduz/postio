[package]
name = "postio-gmail"
description = "Gmail REST MailBackend adapter over Pimalaya's io-gmail (ADR 0018)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }

# No TLS features: connections open on the workspace's own cancellable pimalaya-stream, like the
# JMAP adapter.
io-gmail = { version = "0.10", default-features = false, features = ["std"] }
pimalaya-stream = { workspace = true }

postio-account = { version = "0.6.2", path = "../postio-account", default-features = false }
postio-model = { version = "0.6.2", path = "../postio-model" }

tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
postio-workspace-hack.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
