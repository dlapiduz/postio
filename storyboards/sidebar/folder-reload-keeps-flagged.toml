# A folder reload keeps the list on Flagged (#813).
#
# The defect: a mailbox-list reload (resync, rename) threw the list out of
# Flagged back to the inbox. The list must stay Flagged and the cursor stay
# put.
#
# Re-expressed for Focus (T265): `g *` lists flagged mail (eight rows in the
# small seed, T257), and the reload is the engine saying the mailboxes
# changed. The classic app's sidebar walk it was written against is removed
# by T256.
apps   = ["focus"]
source = { kind = "issue", ref = "#813" }
proof  = "pinned"

[[step]]
command = "go_to_flagged"
settle  = { until = { rows.count = 8 } }
check   = { scope = "Flagged", rows.count = 8 }

[[step]]
id      = "down"
command = "next_message"
check   = { cursor.index = 0, keyboard.region = "list" }

[[step]]
event   = "mailboxes_changed"
settle  = { watch_ms = 500 }
check   = { scope = "Flagged", rows.count = 8, cursor.index = { same_as = "down" }, cursor.id = { same_as = "down" } }
expect  = "The list is still Flagged, with the cursor where it was. Nothing jumps back to the inbox."
