# Escape leaves a search, and the list is the folder again (#1474, #1011).
#
# The defect: once a search had run, Escape did nothing, and the window
# stayed stuck on the hits. The folder's own rows must be what is left.
#
# Re-expressed for Focus (T265): Focus's command bar does not narrow the
# inbox behind it. Typing lists the matches in the bar under the search row,
# which stays above them; Return takes the highlight to the first hit, the
# bar keeping the keyboard, and Escape closes the bar over an inbox that
# never changed.
apps   = ["focus"]
source = { kind = "issue", ref = "#1474" }
proof  = "pinned"

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search", keyboard.typing = true }

[[step]]
type    = "harbour"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
check   = { keyboard.region = "search", rows.count = { same_as = 0 }, app.focus.bar.highlighted = "search", app.focus.bar.messages = { changed = true } }
expect  = "The matches are listed as the word is typed, headed by their count, with the search row still above them; the inbox behind it is not narrowed."

[[step]]
key     = "Return"
check   = { keyboard.region = "search", keyboard.typing = true, overlay.kind = "finder", app.focus.bar.highlighted = "message" }
expect  = "Return takes the highlight to the first match; the keyboard stays in the bar."

[[step]]
command = "back"
check   = { keyboard.region = "list", overlay.kind = "none", view = "list", rows.count = { same_as = 0 } }
expect  = "The bar is gone and the list is the Inbox, every row there; nothing of the search is left."
