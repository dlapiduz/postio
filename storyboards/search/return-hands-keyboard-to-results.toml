# Return from the search field reaches the hits (#693, #1252).
#
# #693 asked for the keyboard to move from the query to the hits; #1252 was
# the same handoff flaking. Chain delivery passes the key through every
# controller on the real focus chain, which is what that flake was about.
#
# Re-expressed for Focus (T265): Return in the bar runs the search and
# lists the hits under the field, which keeps the keyboard; the arrows walk
# the hits from there, Down to the first. The classic app it was written
# against is removed by T256.
apps   = ["focus"]
source = { kind = "issue", ref = "#693" }
proof  = "pinned"

[[step]]
command = "search"

[[step]]
type    = "harbour"

[[step]]
key     = "Return"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
check   = { keyboard.region = "search", keyboard.typing = true, keyboard.reachable = true, overlay.kind = "finder" }
expect  = "Return runs the search; the hits are listed in the bar and the field keeps the keyboard and the query."

[[step]]
key     = "Down"
check   = { keyboard.region = "search", keyboard.reachable = true, app.focus.bar.highlighted = "message" }
expect  = "Down reaches the first hit, highlighted, with the query still in the field."
