# Archive under the cursor, and the row below takes its place (#1687, #1746).
#
# The defect: archiving or deleting under the cursor moved the cursor
# somewhere else, so the next `a` archived a message the person never looked
# at. The classic app's #1687 was fixed and pinned here; Focus has its own
# form of it, #1746: the archived row's cursor was not handed to the row
# that takes its place, so the cursor was gone and the next `a` archived
# nothing. Focus starts with no cursor row, so the two `j` leave it on index
# 0 and then 1.
apps   = ["focus"]
source = { kind = "issue", ref = "#1746" }
proof  = "pinned"

[[step]]
id      = "down"
command = "next_message"
check   = { keyboard.region = "list", cursor.index = 0 }

[[step]]
id      = "second"
command = "next_message"
check   = { cursor.index = 1 }

[[step]]
command = "archive"
check   = { keyboard.region = "list", cursor.index = { same_as = "second" }, notice.undo = true }
expect  = "The archived row is gone and the one below takes its place under the cursor ring. The list does not scroll and nothing jumps."

[[step]]
command = "archive"
check   = { keyboard.region = "list", cursor.index = { same_as = "second" } }
expect  = "A second archive works on the row that took the first one's place."

[[step]]
command = "undo"
check   = { keyboard.region = "list" }
expect  = "The last archived row comes back, in its place."
