name: Pages

# Deploys the docs site to GitHub Pages: site/ (the hand-written landing
# page, #24) at `/`, and the mdBook reference (docs/book/, #25) at `/docs/`.
#
# Deliberately its own workflow rather than a job in ci.yml, for the same
# reason release.yml is separate (docs/decisions/0011-docs-site.md Q6): it
# says nothing about whether the Rust workspace builds, and it should not
# sit in the critical path of a PR that never touched either surface.
#
# One deployment, two surfaces, per ADR 0011 Q1/Q6. mdBook compiles nothing
# of the Rust workspace -- it renders checked-in Markdown, including the
# generated references (docs/keybindings.md, docs/config.md) unchanged --
# and this job does not regenerate them: if either had drifted from its
# source of truth, `ci.yml`'s own mdbook-build job already failed on the PR
# that made it stale (Q6). This deploy job trusts the tree it was pushed.
#
# Still cheap relative to ci.yml/bench.yml (see CLAUDE.md's "CI is paused"):
# no GTK, no WebKit, no workspace compile -- one small `cargo install` of
# mdbook itself (cached), an mdbook build, and a Pages upload/deploy. Pushing
# to main with a docs change is common enough, and this job light enough,
# that it stays on `push` rather than joining the paused workflows as
# workflow_dispatch-only.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/book/**"
      - "docs/keybindings.md"
      - "docs/config.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push should win over an in-flight
# older one rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The pin decides; see ci.yml's `fmt` job for why nothing here calls
      # `rustup default`.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Cache the mdbook binary
        id: mdbook-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook-0.5.4

      # Pinned the same way cargo-fuzz is in fuzz.yml: a version, not a
      # floating latest, so a new mdbook release cannot change the deployed
      # site's rendering out from under a commit that touched nothing.
      #
      # Skipped outright on a cache hit: `cargo install` refuses to overwrite
      # an existing binary ("binary `mdbook` already exists in destination")
      # and exits 101, so restoring the cache and then installing over it
      # fails the job. The key pins the version, so a hit is by construction
      # the binary this step would have built (#760).
      - name: Install mdbook
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook --locked --version 0.5.4

      - name: Build the book
        run: mdbook build docs/book

      # upload-pages-artifact takes one directory tree, so the two surfaces
      # are assembled into one staging directory first: the landing page at
      # its root, the book underneath docs/ -- exactly the shape ADR 0011 Q1
      # describes for the served site.
      - name: Assemble the Pages artifact
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/docs
          cp -r docs/book/book/. _site/docs/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
