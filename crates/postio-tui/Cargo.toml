[package]
name = "postio-tui"
description = "Postio in the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "postio-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-channel = { workspace = true }
chrono = { workspace = true, features = ["std"] }
# The terminal: crossterm for input, mouse, bracketed paste and the keyboard
# protocol (research R3, R4).
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "event-stream", "events"] }
futures-util = { workspace = true }
postio-client.workspace = true
postio-config.workspace = true
postio-core.workspace = true
postio-body.workspace = true
postio-model.workspace = true
postio-search.workspace = true
postio-ui.workspace = true
# The link destinations in a message, from the parser tui-markdown already
# brings.
pulldown-cmark = { version = "0.13", default-features = false }
# Drawing (research R3). No calendar widget, no macros.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
# An image off the clipboard, on the paste key only (research R7).
# `image-data` brings `image` with its PNG codec and nothing else; the
# clipboard's pixels are encoded with that same crate.
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# The composer's body: a modeless multi-line editor (research R8, FR-022a).
ratatui-textarea = { version = "0.9.2", default-features = false, features = ["crossterm"] }
# The composer's one-line fields: To, Cc, Bcc, Subject.
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"] }
# Markdown to styled lines, for the reader (research R5). Without code
# highlighting: syntect is megabytes, and size is a requirement (SC-004).
tui-markdown = { version = "0.3.9", default-features = false }
tracing = { workspace = true }
# Display width, for fitting subjects and names to columns: a CJK
# character is two columns. Already in the graph through ratatui.
unicode-width = "0.2"

[dev-dependencies]
postio-model = { workspace = true, features = ["test-corpus"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net"] }
