name: Supply-chain audit

# ci.yml's `supply-chain` job only runs on non-prose pushes, so an advisory against something
# already in
# Cargo.lock can go unnoticed. This checks only what turns red with nobody touching the repository
# (#146).
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Scoped to this job (#145): only it files or updates an issue.
  issues: write

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # Installed directly, not through the Docker-based action, whose stdout a later step cannot
      # read back.
      # The version matches the action's bundle and the published checksum is verified before
      # execution.
      - name: Install cargo-deny
        env:
          DENY_VERSION: "0.20.2"
          DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          # The member is named in full: GNU tar treats `*/` as a wildcard only with `--wildcards`,
          # and the runner's tar failed on it.
          dir="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          archive="${dir}.tar.gz"
          curl -sSL -o "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${archive}"
          echo "${DENY_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" --strip-components=1 -C /usr/local/bin "${dir}/cargo-deny"
          cargo-deny --version

      # Advisories only; licences, bans and sources stay with the push-time job. `--all-features`
      # matches its graph.
      - name: cargo deny check advisories
        id: audit
        run: |
          if cargo deny --all-features check advisories 2>&1 | tee audit-output.txt; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: File or update an issue naming the advisory
        if: steps.audit.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/report-advisory-failure.sh audit-output.txt \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail the job so a red run is visible
        if: steps.audit.outputs.failed == 'true'
        run: exit 1
