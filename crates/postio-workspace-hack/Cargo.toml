[package]
name = "postio-workspace-hack"
description = "One feature set for the third-party crates every Postio crate shares, so building one crate does not rebuild what the workspace build already built (ADR 0047)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

