# Settings, Filtering (spec 007 US9; the maintainer's call of 2026-10-07):
# the switch over `[focus] filtering`, what filtering does in a sentence,
# today's count with Open Filtered and its `g f`, that nothing is deleted,
# the keys Filtered answers, the guards and the senders never filtered, and
# the marker kinds turned off. The demo's config filters, pins nobody and
# turns no marker off, so both lists say they are empty in their own words.
#
# Focus's design references are never committed
# (specs/007-postio-focus/screens.md records each one).
apps   = ["focus"]
source = { kind = "design", ref = "none" }
preset = "settings/filtering"
vary   = { scheme = ["light", "dark"], width = ["normal", "narrow"] }
