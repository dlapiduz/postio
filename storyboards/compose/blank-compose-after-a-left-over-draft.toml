# `c` opens a blank composer even with a draft left over (#491, #1196,
# #1240, #426).
#
# The defect: `c` reopened the last unsent draft instead of starting a new
# one, a Reply showed the stale draft's text, and two unsaved drafts were
# treated as the same one. The seed holds a draft, "Notes for Thursday".
# `c` must open an empty one, and Escape must leave it.
#
# Re-expressed for Focus (T265): the composer is a dialog over the list,
# and Reply answers the row under the cursor, which `j` puts there first.
# The classic app it was written against is removed by T256.
apps   = ["focus"]
source = { kind = "issue", ref = "#491" }
proof  = "pinned"
seed   = "draft-left-over"

[[step]]
command = "next_message"
check   = { composer.open = false, cursor.index = 0 }

[[step]]
id      = "blank"
command = "compose"
check   = { composer.open = true, keyboard.region = "composer", keyboard.field = "to" }
expect  = "A new, empty message: To, Subject and body are blank. Nothing of Notes for Thursday is in it."

[[step]]
command = "back"
check   = { composer.open = false, keyboard.region = "list" }
expect  = "Escape leaves the empty composer without asking, and the list is back as it was."

[[step]]
command = "reply"
check   = { composer.open = true, keyboard.field = "body" }
expect  = "The reply is seeded from the row under the cursor, quoting that message. Nothing of the left-over draft is in it."
