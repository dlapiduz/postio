[package]
name = "postio-core"
description = "UI-agnostic runtime: command bus, event stream, app state, undo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-channel = "2.5.0"
postio-config.workspace = true
postio-model.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
# `net` is what compiles tokio's IO driver in, and without it
# `Builder::enable_io` does not even exist. Relying on another crate in
# the graph to unify it in would make whether this runtime can open a
# socket depend on who else is being built.
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time", "net"] }
tracing = "0.1"

[dev-dependencies]
criterion = "0.7.0"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[[bench]]
name = "perf_budgets"
harness = false

[lints]
workspace = true
