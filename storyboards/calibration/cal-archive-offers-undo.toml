# must_pass: the twin of cal-archive-says-nothing.
source      = { kind = "flow", ref = "ux-architect §2" }
calibration = "must_pass"
# One move first: an archive pressed as the very first key can be lost
# (#1745), and calibration needs ground truth that does not race.
[[step]]
command = "next_message"
[[step]]
command = "archive"
expect  = "A notice at the bottom says the message was archived and offers Undo."
