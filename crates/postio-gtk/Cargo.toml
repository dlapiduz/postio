[package]
name = "postio-gtk"
description = "Postio, the desktop app: Focus, a dense, keyboard-first inbox on the Postio engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# A library with a thin binary: a composition root only the binary could reach cannot be checked.
# `tests/focus_suite` drives the same startup.
[lib]
path = "src/lib.rs"

# The binary is `postio` (ADR 0043), what lands on PATH and what the desktop entry's `Exec` names.
[[bin]]
name = "postio"
path = "src/main.rs"

[features]
# Off by default: the seeds and the in-memory store are test-support code and must not reach a
# normal build.
demo = [
    "dep:postio-demo",
    "dep:postio-index",
    "dep:postio-storage",
    "postio-storage/test-support",
    "dep:postio-storyboard",
    "dep:tempfile",
]

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
async-channel = { workspace = true }
chrono = { workspace = true, features = ["std"] }
gio = "0.22.11"
glib = { version = "0.22.11", features = ["v2_72"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
# The engine's page cache and fts index churn small allocations; the memory measurements (#1606)
# measure the heap under it.
mimalloc = "0.1"
pango = { version = "0.22.9", features = ["v1_56"] }
postio-account.workspace = true
postio-body.workspace = true
postio-client.workspace = true
postio-config.workspace = true
postio-core.workspace = true
postio-focus.workspace = true
postio-host.workspace = true
postio-mcp.workspace = true
postio-model.workspace = true
postio-render.workspace = true
postio-runtime.workspace = true
postio-search.workspace = true
postio-session.workspace = true
postio-ui.workspace = true
postio-widgets.workspace = true
postio-vault.workspace = true
postio-index = { workspace = true, optional = true }
postio-storyboard = { workspace = true, optional = true }
postio-demo = { workspace = true, optional = true }
postio-storage = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tracing = { workspace = true }
url = { workspace = true }
serde_json.workspace = true
postio-workspace-hack.workspace = true

[dev-dependencies]
async-trait.workspace = true
postio-account = { workspace = true, features = ["test-server"] }
postio-index.workspace = true
postio-model = { workspace = true, features = ["test-corpus"] }
postio-storage = { workspace = true, features = ["test-support"] }
postio-test-support.workspace = true
# Screen 31 holds a render past its deadline to draw the plain-text fallback.
postio-widgets = { workspace = true, features = ["test-hooks"] }
postio-smtp.workspace = true
postio-sync.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
postio-gtk = { path = ".", features = ["demo"] }
postio-storyboard.workspace = true

# Focus's GTK suite is a custom harness: GTK initializes on exactly one thread per process (#41) and
# libtest uses a pool.
# It needs the seeded store and demo module behind `demo`.
[[example]]
name = "shot"
required-features = ["demo"]

[[example]]
name = "storyboard"
required-features = ["demo"]

[[test]]
name = "focus_suite"
path = "tests/focus_suite/main.rs"
harness = false

[lints]
workspace = true
