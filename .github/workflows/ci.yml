name: CI

# The compile jobs run on ubuntu-26.04: the GTK crates pin gtk4 `v4_20`, libadwaita `v1_7` and pango
# `v1_56`, which check the system library version at build time. Fallback if the label is withdrawn:
# a `container: fedora:44` with the dnf line from CLAUDE.md.

# The `changes` job decides what to build, not a workflow-level `paths-ignore`: a workflow that does
# not run reports no check, so a required check would never merge (#1107). A skipped job counts as
# passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default: no job pushes a commit, opens a PR or touches an issue (#145).
permissions:
  contents: read
  actions: read

# A PR's superseded run is cancelled; `main`'s is not, because only `main` writes build caches and a
# cancelled job writes none (#1710).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

  # No `CARGO_PROFILE_DEV_DEBUG`: the workspace is `debug = 0` and the override turned debug info
  # back on (test binary 239 MB instead of 70) (#1710).

  # `.cargo/config.toml` pins `jobs = 2` for a shared workstation; a runner is alone, so this
  # overrides it.
  # A floor: the compile jobs raise it to the runner's core count (.github/actions/rust-workspace).
  CARGO_BUILD_JOBS: 4

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      docs: ${{ steps.classify.outputs.docs }}
      # Declared, or the output is empty and the macOS job silently skips itself, which the ruleset
      # counts as passed.
      macos: ${{ steps.classify.outputs.macos }}
      # Whether the tooling self-tests need to run, so `macos-tooling` is gated without starting a
      # macOS runner.
      # `boundaries` decides for itself; both callers run `ci-tooling-needed.sh` (#1151).
      tooling: ${{ steps.tooling.outputs.run }}
      flatpak: ${{ steps.flatpak.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # The diff comes from the API, not a deep clone. A range GitHub cannot answer leaves the list
      # empty, and an empty list builds everything: `scripts/ci-changes.sh` fails that way on
      # purpose.
      - name: Classify the diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push)         range="${{ github.event.before }}...${{ github.sha }}" ;;
            *)            range="" ;;
          esac
          files=""
          if [ -n "$range" ]; then
            files=$(gh api --paginate "repos/${{ github.repository }}/compare/$range" \
                      --jq '.files[].filename' 2>/dev/null || true)
          fi
          printf '%s\n' "$files" | scripts/ci-changes.sh "${{ github.event_name }}" | tee -a "$GITHUB_OUTPUT"
          printf '%s\n' "$files" | sed 's/^/  changed: /'
          printf '%s\n' "$files" > "$RUNNER_TEMP/changed-files"

      # Asked here too so a macOS runner (billed at ten times Linux) starts only when the answer is
      # yes.
      - name: Decide whether the tooling self-tests need to run
        id: tooling
        run: |
          answer=$(scripts/ci-tooling-needed.sh "${{ github.event_name }}" \
                     < "$RUNNER_TEMP/changed-files")
          echo "run=$answer" >> "$GITHUB_OUTPUT"
          echo "tooling self-tests on macOS: $answer"

      # The manifests are built only by the release workflow; `scripts/flatpak-refs-check.py` is the
      # cheap PR-time check.
      # It fails safe: an empty file list runs it.
      - name: Decide whether the Flatpak manifests need checking
        id: flatpak
        run: |
          if [ ! -s "$RUNNER_TEMP/changed-files" ] \
             || grep -q '^flatpak/' "$RUNNER_TEMP/changed-files"; then
            answer=yes
          else
            answer=no
          fi
          echo "run=$answer" >> "$GITHUB_OUTPUT"
          echo "flatpak manifest check: $answer"

  # Asks Flathub, without installing anything, whether every runtime, SDK and extension ref the
  # manifests name exists.
  # A full `flatpak-builder` run is left to the release: it is far past what a PR check should cost.
  flatpak:
    name: Flatpak refs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.flatpak == 'yes'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Install flatpak and add Flathub
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Check the manifests' refs exist on Flathub
        run: scripts/flatpak-refs-check.py flatpak/dev.postio.Postio.json flatpak/dev.postio.PostioTui.json

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain selected here: rust-toolchain.toml pins it, and a `rustup default stable` would
      # win over the pin (#38).
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          cargo fmt --version

      - name: cargo fmt --check
        run: cargo fmt --all --check

  boundaries:
    name: Crate boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # Only `cargo metadata` is needed, so no GTK system libraries.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # `.cargo/config.toml` names `postio-linker` and `postio-cc` (#1101); anything here that
      # compiles needs them on PATH.
      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      # The registry only; the self-tests build throwaway sandboxes.
      - name: Restore the build cache
        uses: ./.github/actions/build-cache
        with:
          name: tooling
          target: "false"

      # One step runs every invariant `scripts/check.sh` knows (#1169), so a hand-opened PR meets
      # the same gate as `issue-land.sh`.
      # None needs a build. POSTIO_DENY_NAMES is optional: without it the reserved-domain rule still
      # runs.
      # Output is redacted because these logs are public; run the script locally with --reveal.
      # `check-unused-deps.py` skips without cargo-machete, so this job installs it, cached on the
      # install script's hash.
      - name: Cache cargo-machete
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-machete
          key: ${{ runner.os }}-cargo-machete-${{ hashFiles('scripts/install-machete.sh') }}

      - name: Install cargo-machete
        run: scripts/install-machete.sh

      # `test-check-dependency-policy.py` needs cargo-deny; under CI a missing prerequisite fails
      # the self-test rather than skipping it (`scripts/lib/prereq.py`) (#1290).
      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('scripts/install-cargo-deny.sh') }}

      - name: Install cargo-deny
        run: scripts/install-cargo-deny.sh

      # `check-workspace-hack.py` needs `cargo hakari` (ADR 0047); a missing tool fails under CI.
      # Cached on the install script's hash.
      - name: Cache cargo-hakari
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-hakari
          key: ${{ runner.os }}-cargo-hakari-${{ hashFiles('scripts/install-hakari.sh') }}

      - name: Install cargo-hakari
        run: scripts/install-hakari.sh

      - name: Run every repository invariant
        env:
          POSTIO_DENY_NAMES: ${{ secrets.POSTIO_DENY_NAMES }}
        run: scripts/check.sh

      # Self-tests under scripts/tests are discovered, not listed: a hand-kept list drifted and nine
      # never ran.
      # Each runs several at a time. Each module's docstring says what it is for.
      # Gated by `scripts/ci-tooling-needed.sh`, a script because inline steps cannot be tested
      # (`scripts/tests/test-ci-tooling-needed.py`); a PR that cannot affect `scripts/` should not
      # pay for them (#996).
      - name: Decide whether the tooling self-tests need to run
        id: tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --jq '.files[].filename' 2>/dev/null) || files=""
          answer=$(printf '%s\n' "$files" \
            | scripts/ci-tooling-needed.sh "${{ github.event_name }}")
          echo "run=$answer" >> "$GITHUB_OUTPUT"
          echo "tooling self-tests: $answer"
          printf '%s\n' "$files" | sed 's/^/  changed: /'

      - name: Prove the tooling still holds itself up
        if: steps.tooling.outputs.run == 'yes'
        run: |
          # A script, because an inline step cannot be tested; the old inline one skipped the log of
          # any self-test that passed one case (#1257).
          # `--skip test-ffi-bindgen.py`: it builds `postio-ffi` (900 of this step's 919 s); the
          # `macos` job runs it.
          scripts/run-self-tests.sh --logs /tmp/self-test-logs --skip test-ffi-bindgen.py

      - name: Assert CI never runs the network-touching tests
        run: |
          # Live-server tests stay out of CI. The pattern is split so this guard does not match
          # itself, and it covers both the cargo test and the nextest spelling of the flag.
          flag="--ign""ored"
          if grep -rnE -- "$flag|--run-ign""ored" .github/workflows; then
            echo "::error::CI must not run the ignored tests; they talk to a live mail server."
            exit 1
          fi
          echo "ok: no workflow opts into the live-server tests."

      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # The lock: nothing merges while the latest full run on `main` is red. `Last nightly` reads the
  # latest `nightly.yml` conclusion on `main`; `Nightly is green` (required) fails every PR while it
  # is red, except one labelled `fixes-nightly`. Its merge runs the suite again, and a green run
  # unlocks the rest (`unlock.yml` re-asks the check). The label is a social rule: a PR wearing it
  # that does not fix `main` leaves it red.
  nightly-status:
    name: Last nightly
    runs-on: ubuntu-latest
    outputs:
      green: ${{ steps.ask.outputs.green }}
      url: ${{ steps.ask.outputs.url }}
    steps:
      - name: Ask what the latest full run on main concluded
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?status=completed&branch=main&per_page=1" \
            --jq '.workflow_runs[0] | "\(.conclusion)\t\(.html_url)\t\(.created_at)\t\(.event)"' 2>/dev/null || true)
          if [ -z "$last" ] || [ "$last" = "null" ]; then
            echo "No completed run to judge."
            echo "green=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion=$(printf '%s' "$last" | cut -f1)
          url=$(printf '%s' "$last" | cut -f2)
          when=$(printf '%s' "$last" | cut -f3)
          event=$(printf '%s' "$last" | cut -f4)
          echo "Latest full run on main: $conclusion ($when, on $event)"
          echo "  $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          case "$conclusion" in
            success|cancelled|skipped)
              echo "green=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "green=false" >> "$GITHUB_OUTPUT"
              echo "::warning::The latest full run on main failed ($url). Nothing merges until a pull request labelled fixes-nightly turns it green."
              ;;
          esac

  nightly:
    name: Nightly is green
    needs: nightly-status
    # `always()`: a skipped required check proves nothing while looking like it did.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        env:
          GREEN: ${{ needs.nightly-status.outputs.green }}
          URL: ${{ needs.nightly-status.outputs.url }}
          EVENT: ${{ github.event_name }}
          FIXES: ${{ contains(github.event.pull_request.labels.*.name, 'fixes-nightly') }}
        run: |
          set -euo pipefail
          echo "latest full run on main green: ${GREEN}"
          if [ "${GREEN}" = "true" ]; then
            echo "main's full suite is green."
            exit 0
          fi
          if [ "${EVENT}" != "pull_request" ]; then
            echo "main is red, and this is main's own run: the lock is for pull requests."
            exit 0
          fi
          if [ "${FIXES}" = "true" ]; then
            echo "main is red and this pull request says it fixes it (fixes-nightly)."
            echo "It may merge; its merge runs the suite on main, and green unlocks the rest."
            exit 0
          fi
          echo "::error::main's full suite is red, so nothing merges until it is fixed."
          echo
          echo "The run:"
          echo "  ${URL}"
          echo
          echo "A pull request runs the merge-path tier, budgeted to finish in minutes;"
          echo "the integration suites, storyboards and coverage floors run on main after"
          echo "every merge and every night. While that run is red nothing is checking"
          echo "them, so nothing merges. The way through is the one pull request that"
          echo "fixes it, labelled fixes-nightly:  gh pr edit <n> --add-label fixes-nightly"
          echo "If this change is that fix, label it. If not, wait for the one that is,"
          echo "or be it."
          exit 1

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      - name: Cache the mdbook binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook-0.5.4

      # Keep this version pin in step with pages.yml's: they must build the same book.
      # Install only when the binary is absent: `cargo install` refuses if a cached copy exists, and
      # `cache-hit` is false on a restore-keys hit, so the binary is asked, not the cache.
      - name: Install mdbook
        run: |
          if mdbook --version 2>/dev/null | grep -qw "v0.5.4"; then
            echo "mdbook 0.5.4 restored from the cache"
          else
            cargo install mdbook --locked --version 0.5.4 --force
          fi

      # mdbook fails on a broken link or a missing SUMMARY.md entry (ADR 0011 Q6); no GTK or compile
      # needed.
      - name: mdbook build
        run: mdbook build docs/book

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What is in the dependency graph at all; the crate boundary check asks a different question.
      # Its own job: it needs cargo metadata and no GTK.
      # The action's musl container ships its own toolchain, so rustup fails on rust-toolchain.toml
      # unless told the channel.
      # The channel is read from rust-toolchain.toml, so the pin has one source (as `issue-land.sh`
      # does).
      - name: Read the pinned toolchain
        id: pin
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "cargo-deny will run on $channel"

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          rust-version: ${{ steps.pin.outputs.channel }}

  # Three jobs (#818), not one: clippy, test and doc ran in sequence for 16.9 minutes on average.
  # They share one cache (`test` writes it, the other two restore it) and the setup in
  # .github/actions/rust-workspace.
  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # Its own cache: clippy emits check units and `cargo test` build units, which cargo
      # fingerprints separately.
      - uses: ./.github/actions/rust-workspace
        with:
          cache-name: "clippy"

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Drop workspace artifacts before caching
        if: always()
        run: scripts/ci-drop-workspace-artifacts.sh

      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # Per changed crate with `--no-deps`: the workspace doc build is the 23-minute job #833 removed.
  # The flags are `nightly.yml`'s `doc` job's; change one,
  # change both.
  # It runs on pushes to `main` only so the build cache gets written (#1710).
  rustdoc:
    name: Rustdoc links
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Which crates changed
        id: crates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push)         range="${{ github.event.before }}...${{ github.sha }}" ;;
            *)            range="" ;;
          esac
          files=""
          if [ -n "$range" ]; then
            files=$(gh api --paginate "repos/${{ github.repository }}/compare/$range" \
                      --jq '.files[].filename' 2>/dev/null || true)
          fi
          crates=$(printf '%s\n' "$files" \
            | sed -n 's|^crates/\([^/]*\)/.*|\1|p' | sort -u \
            | while read -r c; do [ -d "crates/$c" ] && echo "$c"; done)
          echo "crates: $(echo $crates)"
          {
            echo "list<<EOF"
            printf '%s\n' "$crates"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/rust-workspace
        if: steps.crates.outputs.list != ''
        with:
          cache-name: "doc"

      - name: cargo doc, per changed crate
        if: steps.crates.outputs.list != ''
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
          CRATES: ${{ steps.crates.outputs.list }}
        run: |
          for c in $CRATES; do
            echo "--- rustdoc: $c ---"
            cargo doc --no-deps --document-private-items -p "$c"
          done

      - name: Drop workspace artifacts before caching
        if: always() && steps.crates.outputs.list != ''
        run: scripts/ci-drop-workspace-artifacts.sh

      - name: Save the build cache
        if: ${{ !cancelled() && steps.crates.outputs.list != '' }}
        uses: ./.github/actions/build-cache-save

  test:
    name: Tests
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - uses: ./.github/actions/rust-workspace
        with:
          cache-name: "build"

      # A fresh checkout gives every file the same mtime, so cargo saw a cached `target/` as stale
      # (#1126).
      # Restoring each file's commit date makes it rebuild only what the PR touched. Runs after
      # checkout and cache restore.
      - name: Restore mtimes from commit history
        run: scripts/restore-mtimes.py

      # Test files that skip when there is no display would pass having run nothing (#114);
      # `.cargo/config.toml`'s runner needs `mutter` on PATH and an `XDG_RUNTIME_DIR`. There is no
      # Xvfb fallback: X11 is unsupported, and a silent fallback made a green run unreadable. If the
      # compositor fails, `gtk_display_required.rs` fails the run.
      - name: Give the GTK suites a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      # The version, checksum and reasoning live in `scripts/install-nextest.sh` (#1092). The cache
      # is keyed on the script; a wrong-version restore is harmless because the script checks `cargo
      # nextest --version`.
      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      # The default suite never touches the network. `dbus-run-session` is required: mutter dies on
      # a runner without a session bus (`set_gnome_env: assertion failed: (session_bus)`). A shared
      # runner is slower than the workstation, so `POSTIO_TEST_PATIENCE` is raised here, costing
      # nothing when tests pass (#842). `--no-fail-fast`: plain cargo abandons the remaining targets
      # at the first failure. `--profile ci` also sets the retry override (#957). One process per
      # test and binaries in parallel: 3,462 tests in 118s against ~500s for `cargo test
      # --workspace`. Everything but the two GTK crates, which run with the full suite on `main`
      # after each merge, so a landing never waits on a compositor. The sanity tier: unit tests
      # plus the integration suites whose tests enumerate a vocabulary (golden binding tables,
      # `[keys]`, `docs/keybindings.md`, `docs/config.md`), which neither `--lib` nor clippy can
      # fail (#1047). The rest run on `main` and as the release gate; the `nightly` job below
      # refuses to go green while the last run failed.
      - name: cargo nextest run (sanity tier)
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: >-
          dbus-run-session -- cargo nextest run --workspace --profile ci --lib
          -E 'not (package(postio-widgets) + package(postio-gtk))'

      # No test on the merge path waits on the clock (CLAUDE.md, Tests). Each nextest run leaves a
      # report and this refuses any case over the tier's budget: 10 s here, 20 s for a case that
      # opens a GTK window (`nightly.yml`).
      - name: Every test under its budget
        if: ${{ !cancelled() }}
        run: scripts/ci-test-budget.py target/nextest/ci/junit.xml 10

      - name: cargo nextest run (the suites a vocabulary change breaks)
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: >-
          dbus-run-session -- cargo nextest run --profile ci
          -p postio-core -p postio-config

      - name: Every test under its budget
        if: ${{ !cancelled() }}
        run: scripts/ci-test-budget.py target/nextest/ci/junit.xml 10

      # **nextest does not run doctests**, and does not say so: delete this step and ~20 doctests
      # silently stop.
      - name: cargo test --doc
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- cargo test --workspace --doc

      # Drop the workspace's own artifacts before the save, keeping the ~400 third-party crates:
      # `actions/cache` cannot overwrite a key, so kept artifacts went stale within hours and cost
      # 1.7 GB of the 10 GB quota (#2004). `scripts/lib/drop-workspace-artifacts.sh` is the one copy
      # of what "ours" means.
      - name: Drop workspace artifacts before caching
        if: always()
        run: scripts/ci-drop-workspace-artifacts.sh

      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # The macOS half (ADR 0019 Q7): `postio-ffi` proves the seam on Linux; macOS adds the Swift, the
  # bindings output and the link.
  # Gated on `macos`, not `rust`: a Swift-only change skips the workspace suite, and a `postio-ffi`
  # change runs both (`scripts/ci-changes.sh`).
  # `WindowServerRequiredTests` checks the Aqua session, so a window-server test cannot skip and
  # report success.
  # A required check under this exact name: skipped by its `if:`, a job reports as passed, so every
  # PR carries it.
  macos:
    name: macOS build and Swift tests
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.macos == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # The pin decides; rustup honours `rust-toolchain.toml` on every platform, and
      # `check-toolchain-pinned.py` refuses a toolchain step.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # `scripts/macos-build.sh` installs the shims too; doing it here attaches a failure to a step
      # that names it.
      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      # The registry and `target/`: caching only the registry left a cold 14-minute `postio-ffi`
      # build on every run (#1710).
      - name: Restore the build cache
        uses: ./.github/actions/build-cache
        with:
          name: macos-ffi

      # Xcode's own toolchain: a `swift` that is not the one `xcode-select` points at links against
      # a different SDK.
      - name: Report the Swift toolchain
        run: |
          xcode-select --print-path
          swift --version

      # The whole chain (cargo, bindings generator, tokens, `swift build`); the joins fail in
      # order-dependent ways, hence the script.
      - name: Build the macOS application
        # `--with-tests` builds the test bundle in the same pass. `swift test` does not relink a
        # bundle when only a `-Xlinker` library changed, so the demo stores must be linked here too
        # (PR #2124).
        env:
          POSTIO_FFI_FEATURES: demo
        run: scripts/macos-build.sh --with-tests

      - name: Swift tests
        env:
          CI: "true"
        run: scripts/macos-test.sh

      - name: Assemble Postio.app
        run: scripts/macos-bundle.sh

      # The bindings generator's self-test runs here: it builds `postio-ffi`, which this job just
      # did (15 minutes among the tooling self-tests).
      - name: The bindings generator's self-test
        env:
          CI: "true"
          POSTIO_TEST_PATIENCE: "2"
        run: python3 scripts/tests/test-ffi-bindgen.py

      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # The tooling self-tests on macOS (#1151): `scripts/` is mostly shell, where portability breaks
  # live (BSD rejects `sleep infinity`). Its own job, not a step in `macos`: `ci-changes.sh` answers
  # `no` for `scripts/tests/`, `scripts/checks/` and `scripts/issue-*.sh`, exactly the changes these
  # exist for. The Linux job keeps its own copy of the decision.
  macos-tooling:
    name: Tooling self-tests (macOS)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.tooling == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # Several self-tests build a cargo sandbox, so this job needs the pinned toolchain.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      - name: Restore the build cache
        uses: ./.github/actions/build-cache
        with:
          name: tooling
          target: "false"

      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('scripts/install-cargo-deny.sh') }}

      - name: Install cargo-deny
        run: scripts/install-cargo-deny.sh

      - name: Cache cargo-hakari
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-hakari
          key: ${{ runner.os }}-cargo-hakari-${{ hashFiles('scripts/install-hakari.sh') }}

      - name: Install cargo-hakari
        run: scripts/install-hakari.sh

      # `--skip test-ffi-bindgen.py`: it builds `postio-ffi` and runs in the `macos` job.
      # `CI` is set explicitly: `scripts/lib/prereq.py` reads it to treat a missing prerequisite as
      # a broken runner, not a laptop.
      - name: Prove the tooling still holds itself up on macOS
        env:
          CI: "true"
          POSTIO_TEST_PATIENCE: "2"
        run: scripts/run-self-tests.sh --logs "$RUNNER_TEMP/self-test-logs" --skip test-ffi-bindgen.py

      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save
