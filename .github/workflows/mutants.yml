name: Mutants

# Mutation-tests the pure/logic crates weekly and never gates a PR: a full rebuild and test per
# mutant (~1900 mutants) is hours (#99).
# The first dispatch is expected to fail until `docs/mutants-baseline.txt` is seeded with
# `MUTANTS_UPDATE_BASELINE=1 scripts/mutants.sh`, run on this runner.
# Weekly, and only over a tree that moved (#1710): nightly it was red seven nights of seven over the
# same survivors.
# Sunday 09:00 keeps it off the nightly's 07:00 and the benches' 06:00.
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 4

jobs:
  # Skips a scheduled run when `main` has not moved. No `--rerun-failed`: nothing reads this
  # conclusion.
  changed:
    name: Anything to test
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            mise.toml
            .github/actions/python
      - uses: ./.github/actions/python

      - name: Compare against the last run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-anything-new.sh mutants.yml >> "$GITHUB_OUTPUT"

  mutants:
    name: Mutation testing (${{ matrix.crate }})
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-26.04
    # One job per crate (#1458): a single job died to runner shutdown at 96-141 minutes, and one
    # crate's progress is lost, not four.
    # `fail-fast: false`: the crates are independent questions.
    strategy:
      fail-fast: false
      matrix:
        crate: [postio-model, postio-search, postio-config, postio-sync]
    # Generous, not infinite: a hung mutant must not run out the clock; cargo-mutants has its own
    # per-mutant timeout.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # Each parallel job gets its own copy of the tree and a fresh target/; with no `--jobs` cap
      # the runner's ~14GB of disk runs out (#510).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libsecret-1-dev \
            libglib2.0-dev

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      - name: Identify the compiler
        id: rust
        run: echo "version=$(rustc --version | tr ' ()/' '----')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and cargo-mutants
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-${{ steps.rust.outputs.version }}-

      - name: Install cargo-mutants
        run: |
          if cargo mutants --version 2>/dev/null | grep -qw "27.1.0"; then
            echo "cargo-mutants 27.1.0 restored from the cache"
          else
            cargo install cargo-mutants --locked --version 27.1.0 --force
          fi

      # The baseline is one file for every crate; an update rewrites only the crates the run
      # covered, so the four jobs compose (#1458).
      - name: Mutation-test ${{ matrix.crate }}
        run: |
          df -h /
          scripts/mutants.sh ${{ matrix.crate }}
