[package]
name = "turso-spike"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "schema"
path = "src/main.rs"

[[bin]]
name = "uncompressed"
path = "src/uncompressed.rs"

[dependencies]
turso = "=0.8.0-pre.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

postio-session = { path = "../../crates/postio-session" }
postio-storage = { path = "../../crates/postio-storage", features = ["test-support"] }
postio-index = { path = "../../crates/postio-index" }
postio-model = { path = "../../crates/postio-model", features = ["test-corpus"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = "3"
chrono = "0.4"

[workspace]
