# Opening a conversation reads the message shown, and does not tear the
# view down to do it (#797, #1400).
#
# The defect: opening marked the newest message read without the focus
# ever reaching it, and the mark itself rebuilt the conversation, so the
# view flashed a moment after it opened. The long-thread has its last two
# messages unread; opening shows message 7, and after the dwell the open
# message must be exactly as it was. The run fails on a blank frame, and
# `reading.id` must be the same before and after.
#
# Re-expressed for Focus (T265): its open message shows one message, and its
# read clock marks it after the dwell (T237).
apps   = ["focus"]
source = { kind = "issue", ref = "#797" }
proof  = "pinned"
seed   = "long-thread"

[[step]]
command = "next_message"

[[step]]
id      = "open"
command = "open_message"
check   = { view = "reader", reading.id = "7" }
expect  = "The conversation opens on message 7; nothing has been marked yet."

[[step]]
wait    = { ms = 1500 }
check   = { reading.id = { same_as = "open" }, view = "reader", reading.scroll = { same_as = "open" } }
expect  = "After the dwell the message is exactly as it was: no redraw, no scroll, still message 7, now read."
