# Escape from search puts the keyboard back on the row it left (6eadd8e2,
# #1744).
#
# 6eadd8e2 fixed the keyboard half: Escape closed the search and left focus
# in the field. The cursor half was #1744 in the classic app, where the
# search replaced the list's rows and Escape brought the folder back with the
# cursor on row 0.
#
# Re-expressed for Focus (T265), where it holds: its bar never replaces the
# list's rows, so the cursor is where the person left it. Three `j` put it
# on index 2. The classic app it was written against is removed by T256.
apps   = ["focus"]
source = { kind = "issue", ref = "#1744" }
proof  = "pinned"

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
id      = "third"
command = "next_message"
check   = { cursor.index = 2 }

[[step]]
command = "search"
check   = { keyboard.region = "search" }

[[step]]
type    = "tide"
check   = { rows.count = { unchanged = true } }

[[step]]
command = "back"
check   = { keyboard.region = "list", overlay.kind = "none", cursor.index = { same_as = "third" }, cursor.id = { same_as = "third" } }
expect  = "The keyboard is back on the row it left, with that row still under the cursor ring."
