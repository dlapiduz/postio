# Escape leaves a search, and the list is the folder again (#1474, #1011).
#
# The defect: once the finder had closed over its results, Escape did
# nothing, and the list stayed stuck on the hits. Pinned: the row count
# must come back to the folder's own.
#
# Search is live, so the list narrows while the query is typed; Return then
# hands the keyboard to the hits.
source = { kind = "issue", ref = "#1474" }
proof  = "pinned"
design = "05-search"

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search", keyboard.typing = true }

[[step]]
type    = "harbour"
settle  = { until = { rows.count = { changed = true } } }
check   = { keyboard.region = "search", rows.count = { changed = true } }
expect  = "The list narrows to what matches as the query is typed."

[[step]]
key     = "Return"
check   = { keyboard.region = "list", keyboard.typing = false }
expect  = "The keyboard moves to the hits; the query stays in the field."

[[step]]
command = "back"
check   = { keyboard.region = "list", overlay.kind = "none", rows.count = { same_as = 0 } }
expect  = "The list is the Inbox again, every row back; the search is gone."
