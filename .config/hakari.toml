# `cargo hakari` settings for `crates/postio-workspace-hack` (ADR 0047).
# After a manifest's dependencies change: `cargo hakari generate && cargo hakari manage-deps --yes`.

hakari-package = "postio-workspace-hack"
dep-format-version = "4"
resolver = "3"
workspace-hack-line-style = "workspace-dotted"

# The platforms Postio builds on; one left out still builds but pays the rebuilds the crate saves.
platforms = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[traversal-excludes]
# `postio-ffi`'s `uniffi` takes the `cli` feature (`uniffi_bindgen`, `clap`, `cargo_metadata`);
# unified, every crate would build them (#1306).
workspace-members = ["postio-ffi"]

[final-excludes]
third-party = [
    # GLib's C bindings reach the workspace only through GTK and a `postio-storage` dev-dependency;
    # unified, every Linux crate would link system libraries the Flatpak runtime omits.
    { name = "glib-sys" },
    { name = "gobject-sys" },
    { name = "gio-sys" },
    # The renderer decodes hostile images with exactly four decoders (ADR 0042); unified, `image`
    # would carry every decoder any crate asks for. `check-renderer-is-memory-safe.py` refuses it on
    # Linux only.
    { name = "image" },
]
