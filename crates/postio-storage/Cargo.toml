[package]
name = "postio-storage"
description = "SQLite metadata store, migrations, repositories, and the content-addressed blob store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Test-only: exposes the `test_support` helpers; downstream crates enable it from dev-dependencies
# so nothing ships.
# `counting` counts at this crate's own seam, since Turso exposes no trace hook (research.md Q5).
test-support = ["dep:tempfile", "postio-model/test-corpus"]

[dependencies]
blake3 = { workspace = true }
# The master key comes from the kernel's entropy pool and nowhere else (ADR 0014 Q3).
getrandom = "0.4.3"
# Key material overwrites itself when it drops.
zeroize = { workspace = true }
# Blob contents are XChaCha20-Poly1305 (ADR 0014 Q2): pure Rust, and the 24-byte nonce makes a
# random per-blob nonce safe.
chacha20poly1305 = "0.11.0"
# `sync` only, no runtime. `WriteGate` parks waiters on `tokio::sync::Notify`, not a `Condvar`,
# because every thread here is a runtime worker (`store::GateInner`).
tokio = { workspace = true, features = ["sync"] }
chrono = { workspace = true, features = ["std"] }
postio-model = { version = "0.6.2", path = "../postio-model" }
# Turso (docs/archive/specs/004-turso-store): encryption is the engine's own AES-256-GCM, which
# takes `openssl-src` out of the graph.
# Encryption and full-text search are experimental upstream and unaudited, so "no plaintext in the
# file" and "another key is refused" are acceptance criteria.
# `default-features = false`: the default `mimalloc` makes a library install a
# `#[global_allocator]`; that choice belongs to the binary. `fts` stays.
turso = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
# Blob compression (ADR 0017); the store must compress as well as decompress. One zstd version means
# one wrapper over the single zstd-sys the engine's fts (tantivy) shares.
zstd = "0.14"
thiserror = { workspace = true }
tracing = { workspace = true }
postio-workspace-hack.workspace = true

[dev-dependencies]
postio-test-support.workspace = true
postio-model = { path = "../postio-model", features = ["test-corpus"] }
postio-storage = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["std"] }
turso = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

# The workspace floor in full: inheriting it puts `let_underscore_future` on the crate whose
# `DraftRepository::delete` is the dropped-future bug it exists for.
[lints]
workspace = true

# `glib_main_context` proves a store read is pollable on the GLib main loop with no tokio reactor.
# Linux only: Macs that build this crate for the FFI have no GLib.
[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = { version = "0.22.11", features = ["v2_72"] }
