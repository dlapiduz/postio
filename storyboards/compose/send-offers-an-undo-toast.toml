# Sending offers an Undo toast for as long as the send can be taken back
# (#1481, #1752).
#
# The decision on #1481 gave a send its own window, live
# while the queue still holds the operation, calling the cancel path that
# reopening already uses. Focus's send closes the composer and a toast says
# the message is queued, with an Undo that puts the draft back.
#
# Re-expressed for Focus (T265): the cursor is on the first row, the
# one Reply answers.
apps   = ["focus"]
source = { kind = "issue", ref = "#1752" }
proof  = "pinned"

[[step]]
wait    = { until = { cursor.index = 0 } }
[[step]]
command = "reply"
check   = { composer.open = true }

[[step]]
command = "send"
check   = { composer.open = false, notice.undo = true }
expect  = "A toast says the message was sent and offers Undo."
