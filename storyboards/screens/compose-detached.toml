# The composer detached into a window of its own.
#
# Focus's design references are never committed
# (specs/007-postio-focus/screens.md records each one).
apps   = ["focus"]
source = { kind = "design", ref = "none" }

[[step]]
command = "compose"
check   = { composer.open = true, composer.detached = false }

[[step]]
command = "detach_composer"
check   = { composer.open = true, composer.detached = true, view = "list", keyboard.region = "composer", keyboard.field = "to", keyboard.typing = true, app.focus.composer.holds_keyboard = true }
expect  = "The composition is in a window of its own and still open, and the keyboard went with it: what is typed next lands in the message, not in the list behind."
