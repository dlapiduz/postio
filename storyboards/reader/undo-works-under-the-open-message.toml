# Undo, offered by the toast, works from the open message.
#
# Found while writing delete-acts-in-the-open-message (88c1f0f7). With a
# message open, Delete (or Archive) removes it and the dialog goes on to the
# next one, and the toast behind it offers Undo -- and the toast
# offers Undo from above the dialog; `ctrl+z` reaches the same undo.
#
# `reading_key` hands Undo to the window, with the dialog up.
source = { kind = "commit", ref = "88c1f0f7" }
proof  = "pinned"
apps   = ["focus"]
seed   = "long-newsletter"

[[step]]
command = "next_message"
[[step]]
command = "next_message"
[[step]]
command = "next_message"
[[step]]
command = "next_message"
[[step]]
command = "next_message"
[[step]]
command = "open_message"
settle  = { until = { view = "reader" } }
[[step]]
command = "delete"
check   = { view = "reader", rows.count = 59, notice.undo = true }

[[step]]
command = "undo"
check   = { rows.count = 60 }
expect  = "Undo restores the conversation, as it does from the list."
