[package]
name = "postio-widgets"
description = "The GTK widgets and presenters both desktop apps share: the message view, the composer, and the small widgets of the visual language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
test-hooks = ["postio-render/test-hooks"]

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
async-channel = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["std"] }
gio = "0.22.11"
glib = { version = "0.22.11", features = ["v2_72"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
pango = { version = "0.22.9", features = ["v1_56"] }
postio-body.workspace = true
postio-client.workspace = true
postio-config.workspace = true
postio-core.workspace = true
postio-model.workspace = true
postio-render.workspace = true
postio-ui.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
# The composer's editing surface until ADR 0039's native editor is built; nothing else here draws
# with WebKit.
webkit6 = { version = "0.6", features = ["v2_50", "gtk_v4_18"] }
postio-workspace-hack.workspace = true

[build-dependencies]
glib-build-tools = "0.22.8"
postio-ui.workspace = true

[dev-dependencies]
postio-widgets = { path = ".", features = ["test-hooks"] }
postio-model = { workspace = true, features = ["test-corpus"] }
postio-test-support = { workspace = true, features = ["logs"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { workspace = true }

# The shared crate's GTK suite is a custom harness: GTK initializes on one thread per process (#41)
# and libtest uses a pool.
[[test]]
name = "widgets_suite"
path = "tests/widgets_suite/main.rs"
harness = false

[lints]
workspace = true
