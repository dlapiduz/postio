[package]
name = "postio-storage"
description = "SQLite metadata store, migrations, repositories, and the content-addressed blob store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Test-only: exposes the `test_support` throwaway-database helpers. Off by
# default; downstream crates enable it from their dev-dependencies so nothing
# ships in a normal build.
# `counting` used to ride on `rusqlite/trace`, which read statement and row
# counts off SQLite's trace hook (#100). Turso exposes no such hook, so the
# instrument counts at this crate's own seam instead -- see research.md Q5 for
# what that can and cannot see.
test-support = ["dep:tempfile", "postio-model/test-corpus"]

[dependencies]
blake3 = "1.8.7"
# The store's master key comes from the kernel's entropy pool and nowhere
# else (ADR 0014 Q3). `getrandom` is the OS RNG with no generator in front of
# it to be reproduced.
getrandom = "0.4.3"
# Key material overwrites itself when it drops, the same discipline
# `postio-account`'s `Password` already keeps.
zeroize = "1.9.0"
# Blob contents are XChaCha20-Poly1305 (ADR 0014 Q2). Pure Rust, no new
# native dependency, and the 24-byte nonce is what makes a random per-blob
# nonce safe without a counter to keep.
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
postio-model = { version = "0.2.0", path = "../postio-model" }
# Turso, the Rust rewrite of SQLite (specs/004-turso-store). Encryption is
# the engine's own AES-256-GCM rather than SQLCipher's AES-CBC + HMAC, which
# takes `openssl-src` out of the graph entirely -- with it goes the 28 s
# uncacheable build step per cold tree and the `atexit` workaround #794 and
# #699 needed. Both the encryption and the full-text search are marked
# experimental upstream and neither has been audited; spec.md makes "no
# plaintext in the file" and "another key is refused" acceptance criteria
# rather than assumptions for that reason.
turso = "=0.8.0-pre.11"
# Unicode normalisation for the diacritic fold the engine does not do.
# `postio-index` applies it on both the write and the query path; it lives
# here because the folded column is written where the body is.
unicode-normalization = "0.1"
serde_json = "1.0.151"
tempfile = { version = "3.27.0", optional = true }
# Blob compression (ADR 0017). `zstd` rather than a pure-Rust decoder because
# the store must compress as well as decompress; the C library is BSD-3-Clause,
# which `deny.toml` already allows.
zstd = "0.14.0"
thiserror = "2.0.20"
tracing = "0.1"

[dev-dependencies]
# Self dev-dependency so `cargo test -p postio-storage` gets the harness without
# making `test-support` a default feature.
postio-model = { path = "../postio-model", features = ["test-corpus"] }
postio-storage = { path = ".", features = ["test-support"] }
tempfile = "3.27.0"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
turso = "=0.8.0-pre.11"

[lints.rust]
# Not the workspace floor: see EXCEPTIONS in scripts/checks/check-lint-floor.py.
# One FFI call in `db.rs` stops libcrypto registering an `atexit` handler.
unsafe_code = "deny"
missing_docs = "warn"
