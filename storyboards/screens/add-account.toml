# The add-account dialog, a provider found for the address typed: the form
# `add_account` opens, its lookup answered by hand (no server to ask).
#
# Focus's design references are never committed
# (specs/007-postio-focus/screens.md records each one).
apps   = ["focus"]
source = { kind = "design", ref = "none" }
preset = "add-account/route"

[[step]]
wait   = { ms = 300 }
check  = { keyboard.region = "dialog", keyboard.typing = true }
expect = "The form opens with the keyboard in the field still to fill, not on the close button."
