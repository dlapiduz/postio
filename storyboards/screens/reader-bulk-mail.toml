# A long newsletter opened, in app colours (screen 30).
#
# Focus's design references are never committed
# (specs/007-postio-focus/screens.md records each one).
apps   = ["focus"]
source = { kind = "design", ref = "focus 30" }
seed   = "long-newsletter"
vary   = { width = ["wide"] }

[[step]]
wait    = { until = { cursor.index = 0 } }
[[step]]
command = "next_message"
[[step]]
command = "next_message"
[[step]]
command = "next_message"
[[step]]
command = "next_message"

[[step]]
command = "open_message"
check   = { view = "reader", reading.id = "90" }
