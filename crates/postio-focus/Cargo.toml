[package]
name = "postio-focus"
description = "Postio Focus: a dense, keyboard-first inbox on the Postio engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "postio-focus"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
gio = "0.22.9"
glib = { version = "0.22.9", features = ["v2_72"] }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_20"] }

[lints]
workspace = true
