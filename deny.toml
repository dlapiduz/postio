# Supply-chain rules for a mail client.
#
# `Cargo.lock` holds ~405 packages and, until this file existed, nothing
# checked any of them. That matters more here than in an average Rust project:
# Postio holds the user's credentials in the OS keyring and their whole mailbox
# on disk, so a compromised transitive dependency has the highest-value target
# the project owns within reach. ADR 0001 also pins `io-imap` deliberately, so
# an advisory against it will never arrive as a routine `cargo update`.
#
# This is the "what is in the graph at all" question.
# `scripts/checks/check-crate-boundaries.py` asks the other one -- which of *our*
# crates may reach which -- and neither substitutes for the other.
#
# Run it locally with:  cargo deny check

[graph]
# Every target Postio is actually built for. v1 is Linux only
# (docs/PRODUCT.md §2), so the Windows and macOS crates in the graph are
# unreachable and are not worth auditing as though they shipped.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
version = 2
# Vulnerabilities are always denied under version 2; these are the knobs left.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # zvariant is unmaintained (merged into zbus 6), not vulnerable. It
    # arrives only through oo7 0.6 (the Secret Service keyring client in
    # postio-account), whose newest release is a beta that still pins it.
    # No fix to take; revisit when oo7 0.7 is stable.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained notice for zvariant via oo7; no patched release, no vulnerability" },
    # chrono is unmaintained (chronotope/chrono#1768), not vulnerable, with
    # no release that fixes it. 29 of the workspace's crates use it
    # directly and more arrive through dependencies, so leaving it is a
    # migration (to jiff or time), not a version bump.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained notice for chrono; no patched release, no vulnerability; leaving it is a migration" },
]

[licenses]
version = 2
# Postio ships under MIT. Everything here is compatible with distributing a
# MIT-licensed binary; anything not listed fails the build, which is the point.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Public-domain dedications. `notify` (the config file watcher),
    # `blake3` and `constant_time_eq` are here.
    "CC0-1.0",
    # Zero-clause BSD: permission to use for any purpose, no conditions at all
    # -- MIT without even the notice. `quoted_printable`, which `vcard-rs`
    # uses to read the quoted-printable values older vCard exports carry
    # (specs/005-contacts R9).
    "0BSD",
    # File-level copyleft, and the only copyleft in the graph: `cssparser` and
    # `dtoa-short`, both pulled in by the HTML sanitizer's stack. MPL-2.0
    # obliges publishing changes *to those files*; Postio does not modify them,
    # and linking is explicitly permitted. Allowed deliberately rather than by
    # omission.
    #
    # 2026-09-09, #1326: `cssparser` became a *direct* dependency of
    # `postio-body`, which now parses a sender's `<style>` block rather than
    # deleting it. No new crate and no new licence -- ammonia already parses
    # `style` attributes with the same version, and taking that one rather
    # than a second CSS parser is the point. The reading above is unchanged;
    # what changed is that the graph would no longer lose it if ammonia did.
    #
    # 2026-08-27, ADR 0019: eight more arrived at once -- `uniffi` with its
    # `uniffi_bindgen`, `uniffi_core`, `uniffi_macros`, `uniffi_meta`,
    # `uniffi_udl`, `uniffi_pipeline` and `uniffi_internal_macros`
    # companions, which are the boundary the macOS frontend talks to. Same
    # reading as the sanitizer's stack: Postio does not modify those files,
    # and linking is explicitly permitted. Recorded here rather than
    # absorbed silently, which is what the sentence above asked for.
    "MPL-2.0",
    # The Mozilla CA certificate bundle (`webpki-root-certs`). A data licence,
    # not a code one.
    "CDLA-Permissive-2.0",
]
# A licence expression Postio cannot read confidently is one nobody has
# checked. Fail rather than guess.
confidence-threshold = 0.93

[bans]
# 20 crates currently appear at more than one version, and almost all of them
# are Windows target shims and `getrandom`/`rand`/`hashbrown` generations that
# a Linux build never compiles. Denying that today would mean twenty `skip`
# entries that rot into noise nobody reads.
#
# `warn` reports it without failing, which is the honest starting point: the
# number is visible, it can be driven down deliberately, and this becomes
# "deny" when it is low enough to mean something.
multiple-versions = "warn"
# ...except the reader stack, which must be one copy of each. Blitz, the
# sanitiser and the Markdown converter share these crates' types, so a second
# version is a second parser and a second set of interned atoms in one
# process, and `cargo update` alone makes one whenever a dependant lags
# (#1722). Each is not banned, only denied a second version.
deny = [
    { crate = "html5ever", deny-multiple-versions = true },
    { crate = "markup5ever", deny-multiple-versions = true },
    { crate = "markup5ever_rcdom", deny-multiple-versions = true },
    { crate = "cssparser", deny-multiple-versions = true },
    { crate = "selectors", deny-multiple-versions = true },
    { crate = "stylo", deny-multiple-versions = true },
]
wildcards = "deny"
# ...except between Postio's own crates. `postio-config.workspace = true`
# resolves to a path dependency carrying no version requirement, which is a
# wildcard by cargo-deny's reckoning -- 32 of them across the workspace. They
# are not a supply-chain question: that code is in this repository, and pinning
# sibling crates to versions nobody bumps would be churn that buys nothing.
# External wildcards are still denied, which is the case this rule is for.
#
# `io-imap` is pinned to an exact version on purpose (ADR 0001); a `=`
# requirement is not a wildcard, so it is unaffected either way.
allow-wildcard-paths = true

[sources]
# Everything comes from crates.io. A git or path dependency arriving in the
# graph is a change to where Postio's code comes from, and should be a decision
# somebody made rather than a line in a lockfile diff.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one decision of that kind so far (2026-09-24, the maintainer's): Turso
# comes from Postio's own fork, pinned to a Forklift Fork Release tag in the root
# Cargo.toml's `[patch]` -- an upstream release plus fuzzy and prefix expansion in the
# full-text index, which upstream has not merged (turso#8359); the comment
# above that `[patch]` names which release. ADR 0037 says why.
# The same decision for Blitz and mail-parser (2026-11-28, the maintainer's): their patches moved
# from `vendor/` and `patches/` into Forklift Forks of their own, pinned the same way.
allow-git = [
    "https://github.com/dlapiduz/turso",
    "https://github.com/dlapiduz/blitz",
    "https://github.com/dlapiduz/mail-parser",
]
