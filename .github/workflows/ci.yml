name: CI

# Gates that run only when someone remembers are gates that do not exist.
#
# Runner images: the jobs that only need cargo metadata or rustfmt run on
# ubuntu-latest. The jobs that actually compile the GTK frontend run on
# ubuntu-26.04, because the GTK crates pin gtk4 `v4_20`, libadwaita `v1_7` and
# pango `v1_56`, and those feature gates check the *system* library version at
# build time. ubuntu-24.04 ships GTK 4.14 / libadwaita 1.5 and would fail before
# compiling a line. Ubuntu 26.04 (resolute) ships GTK 4.22.2, libadwaita 1.9.1,
# WebKitGTK 2.52.3 and pango 1.57 -- effectively the versions CLAUDE.md records
# as verified on the development box.
#
# ubuntu-26.04 is still a preview runner label. If it is ever withdrawn, the
# equivalent fallback is a `container: fedora:44` running the exact dnf line
# from CLAUDE.md, rather than downgrading the feature floor.

# Every push and every pull request runs this workflow; what the diff
# obliges it to *build* is decided inside it, by the `changes` job, and the
# compile jobs are gated on that. It used to be a workflow-level
# `paths-ignore` for prose, and that cannot stay one: a workflow that does
# not run reports no check, and a required status check that never reports
# is a pull request that never merges (#1107). A gated job that is skipped
# still reports, as skipped, which the ruleset counts as passed -- so
# docs-only and tooling-only changes (39% of a fortnight's commits, #1127)
# pay for the classification and the cheap jobs, not for a workspace build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default: no job here pushes a commit, opens a PR, or
# touches an issue. Without this block every step -- including the
# third-party actions below -- gets whatever GITHUB_TOKEN scope the
# repository default grants, which may be read/write. #145.
permissions:
  contents: read
  # The `nightly` job below reads the last scheduled run's conclusion. Read
  # only, and the narrowest grant that can answer the question.
  actions: read

# A pull request's superseded run is cancelled; `main`'s is not (#1710).
# `main` is the only ref that writes build caches (see
# .github/actions/build-cache), and a cancelled job writes nothing: 31 of 66
# pushes in one week were cancelled by the next merge, which is part of how
# `main` came to hold no build cache at all. Not cancelling still queues
# rather than piles up -- GitHub keeps one pending run per group and replaces
# it with the newest.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

  # No `CARGO_PROFILE_DEV_DEBUG` here, deliberately (#1710). This workflow
  # used to set `line-tables-only`, back when the workspace default was full
  # DWARF and a cold build ran a runner out of disk. The workspace is
  # `debug = 0` now (Cargo.toml says why), and the override turned debug info
  # back *on*: a test binary 239 MB instead of 70, every cache bigger, every
  # link slower. A panic still names its file and line without it; only a
  # backtrace's frames lose theirs.

  # .cargo/config.toml pins `jobs = 2` because four Claude sessions share one
  # eight-core workstation. That reasoning does not travel: a runner is one
  # job on its own machine, and inheriting the limit throttled CI to a quarter
  # of the box for no benefit. CARGO_BUILD_JOBS overrides the config file.
  #
  # This is the floor, not the setting. The jobs that compile ask the runner
  # how many cores it has and raise it (see .github/actions/rust-workspace);
  # the cheap jobs that only read metadata never build enough to care.
  CARGO_BUILD_JOBS: 4

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      docs: ${{ steps.classify.outputs.docs }}
      # Declared, or `needs.changes.outputs.macos` is the empty string and the
      # macOS job silently skips itself on every run -- reported as skipped,
      # which the ruleset counts as passed. A gate that reports green having
      # done nothing is exactly what #666's other half is about.
      macos: ${{ steps.classify.outputs.macos }}
      # Whether the tooling self-tests need to run, so `macos-tooling` can be
      # gated without starting a macOS runner to find out. `boundaries` still
      # decides for itself, deliberately: #1151's third acceptance line is
      # that the Linux job is unchanged in what it runs and how long it
      # takes, and both callers run the same `ci-tooling-needed.sh`.
      tooling: ${{ steps.tooling.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The diff comes from the API rather than from a deep clone: a pull
      # request's base..head and a push's before..after are both one
      # compare call. A range GitHub cannot answer (a first push, a force
      # push whose `before` is gone) leaves the list empty, and an empty
      # list builds everything -- scripts/ci-changes.sh fails in that
      # direction on purpose, and its self-test holds it there.
      - name: Classify the diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push)         range="${{ github.event.before }}...${{ github.sha }}" ;;
            *)            range="" ;;
          esac
          files=""
          if [ -n "$range" ]; then
            files=$(gh api --paginate "repos/${{ github.repository }}/compare/$range" \
                      --jq '.files[].filename' 2>/dev/null || true)
          fi
          printf '%s\n' "$files" | scripts/ci-changes.sh "${{ github.event_name }}" | tee -a "$GITHUB_OUTPUT"
          printf '%s\n' "$files" | sed 's/^/  changed: /'
          printf '%s\n' "$files" > "$RUNNER_TEMP/changed-files"

      # The same question `boundaries` asks itself, asked once more here so a
      # macOS runner is only ever started when the answer is yes. macOS
      # minutes bill at ten times Linux ones, and a job that starts to
      # discover it has nothing to do is the expensive way to find out.
      - name: Decide whether the tooling self-tests need to run
        id: tooling
        run: |
          answer=$(scripts/ci-tooling-needed.sh "${{ github.event_name }}" \
                     < "$RUNNER_TEMP/changed-files")
          echo "run=$answer" >> "$GITHUB_OUTPUT"
          echo "tooling self-tests on macOS: $answer"

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain selected here: rust-toolchain.toml names the exact
      # version and its components, and `rustup show` installs what it names.
      # A `rustup default stable` in this file would silently win over the
      # pin, which is the bug issue #38 is about — reintroduced in one line.
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          cargo fmt --version

      - name: cargo fmt --check
        run: cargo fmt --all --check

  boundaries:
    name: Crate boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only `cargo metadata` is needed here: it resolves the dependency graph
      # without compiling anything, so this job needs no GTK system libraries
      # and finishes in seconds.
      # The pin decides; see the note in the `fmt` job.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # `.cargo/config.toml` names `postio-linker` and `postio-cc` (#1101), and
      # anything here that compiles -- the tooling self-tests build a dummy
      # crate under this config -- needs them on PATH.
      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      # The registry only. The self-tests build throwaway sandboxes, and the
      # one that built this checkout's `target/` -- `test-ffi-bindgen.py`,
      # `postio-ffi` and most of the workspace -- runs in the macOS job now,
      # which builds `postio-ffi` anyway (see `macos` below).
      - name: Restore the build cache
        uses: ./.github/actions/build-cache
        with:
          name: tooling
          target: "false"

      # One step running every invariant `scripts/check.sh` knows about,
      # rather than eight named here by hand (#1169). The eight used to be
      # the only gate a PR opened without `issue-land.sh` ever met -- the
      # documented route for a host that cannot build a crate the branch
      # touches (#555) -- so a hand-opened PR could be green here and still
      # be missing what the other eleven catch: an uncalled `pub fn` (#327,
      # #416), a test file no suite lists (silence, not an error), a
      # manifest section out of order, and so on. Every one of the
      # nineteen is a read of the checked-out tree or the git history in
      # it -- none needs a build -- so this job, which installs no GTK
      # library and compiles nothing, is exactly where the full set
      # belongs. Each check's own docstring under scripts/checks/ has its
      # own story; this is deliberately not eight retellings of it.
      #
      # POSTIO_DENY_NAMES is optional: without it check-no-personal-data.py's
      # reserved-domain rule still runs. A runner's git config is the bot's,
      # so the git fallback cannot see a maintainer's name; set the secret to
      # enable that rule. Output is redacted by default -- these logs are
      # public. Run the script locally with --reveal to see the offending
      # values.
      # `check-unused-deps.py` skips, saying so, without cargo-machete -- so
      # this job installs it, and the gate is real here whatever a
      # workstation has. Cached on the install script's hash, the way
      # nextest is: the key changes exactly when the pin does.
      - name: Cache cargo-machete
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-machete
          key: ${{ runner.os }}-cargo-machete-${{ hashFiles('scripts/install-machete.sh') }}

      - name: Install cargo-machete
        run: scripts/install-machete.sh

      # `test-check-dependency-policy.py`'s two real cases skipped here for
      # want of cargo-deny -- the supply-chain job has it, inside its own
      # action's container, and this job never did -- so the check script
      # nothing else exercises was green untested on every run (#1290).
      # Under CI a missing prerequisite now fails the self-test rather than
      # skipping it (`scripts/lib/prereq.py`), so the tool has to be here.
      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('scripts/install-cargo-deny.sh') }}

      - name: Install cargo-deny
        run: scripts/install-cargo-deny.sh

      # `check-workspace-hack.py` and its self-test ask `cargo hakari` whether
      # the workspace-hack is in step with the manifests (ADR 0047); under CI
      # a missing tool fails rather than skips (`scripts/lib/prereq.py`).
      # Cached on the install script's hash, like the two above.
      - name: Cache cargo-hakari
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-hakari
          key: ${{ runner.os }}-cargo-hakari-${{ hashFiles('scripts/install-hakari.sh') }}

      - name: Install cargo-hakari
        run: scripts/install-hakari.sh

      - name: Run every repository invariant
        env:
          POSTIO_DENY_NAMES: ${{ secrets.POSTIO_DENY_NAMES }}
        run: scripts/check.sh

      # Every self-test under scripts/tests, discovered rather than listed,
      # and run several at a time.
      #
      # Listed, this was 38 steps and took 8.4 minutes of a job that does
      # nothing else expensive -- 38 sequential python processes, most of
      # which build a cargo sandbox. They do not depend on each other, so
      # queueing them behind each other bought nothing.
      #
      # Discovered, because the list had already drifted: nine self-tests
      # existed that CI never ran, two of them added the same day this was
      # written. A hand-maintained enumeration of "the tests we remember"
      # fails in exactly the direction nobody notices -- the test is present,
      # green locally, and simply never runs here. Adding a file to
      # scripts/tests/ is now enough.
      #
      # Each test says what it is for in its own module docstring, which is
      # where that belonged: a step name in a workflow is not a place anybody
      # reads, and a comment there was a second copy free to disagree.
      # The step below is eight of this job's nine minutes, and what it tests
      # is `scripts/`, not the workspace: each self-test builds its own
      # sandbox repository and reads only the copy of the tooling it put
      # there. A pull request that cannot affect `scripts/` should not pay for
      # it. #996 lists this as the cheapest thing to fix here.
      #
      # The rule itself is `scripts/ci-tooling-needed.sh`, and it is a script
      # rather than fifteen lines of `bash` here because inline workflow steps
      # cannot be tested -- which was its own small joke, since what it gates
      # is the suite that keeps the tooling honest.
      # `scripts/tests/test-ci-tooling-needed.py` is what tests it, including
      # every direction it has to fail safe in.
      - name: Decide whether the tooling self-tests need to run
        id: tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --jq '.files[].filename' 2>/dev/null) || files=""
          answer=$(printf '%s\n' "$files" \
            | scripts/ci-tooling-needed.sh "${{ github.event_name }}")
          echo "run=$answer" >> "$GITHUB_OUTPUT"
          echo "tooling self-tests: $answer"
          printf '%s\n' "$files" | sed 's/^/  changed: /'

      # `test-issue-land-no-tests.py` asserts that the landing gate gives the
      # same answer under both test runners, so it needs the one that is not
      # already here. `prereq.py` turns a missing prerequisite into a failure
      # under CI rather than a skip, so this is what stops that self-test
      # standing down on a runner where it is supposed to run. Cached and
      # keyed on the script, as the Tests job does it.
      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      - name: Prove the tooling still holds itself up
        if: steps.tooling.outputs.run == 'yes'
        run: |
          # A script, not fifteen lines here, for the reason
          # `ci-tooling-needed.sh` is one: an inline step cannot be tested,
          # which is a poor property for the step that keeps the tooling
          # honest. This one used to decide which failing logs to print by
          # grepping their content for `ok`, and since every self-test prints
          # `ok` per passing case it skipped the log of anything that failed
          # after getting one case right -- announcing a failure and then
          # printing nothing (#1257).
          #
          # `--skip test-ffi-bindgen.py`: it builds `postio-ffi` -- most of
          # the workspace -- and was 900 of a 919 s run, the whole of this
          # step's cost. The `macos` job runs it after the build it already
          # does, and ci-changes.sh starts that job when the test changes.
          scripts/run-self-tests.sh --logs /tmp/self-test-logs --skip test-ffi-bindgen.py

      - name: Assert CI never runs the network-touching tests
        run: |
          # Live-server tests are #[ignore]d and must stay out of CI. The
          # pattern is split so this guard does not match itself.
          # Both spellings -- cargo test's flag, and the `--run-` prefixed
          # one nextest uses. Neither is written out here for the same reason
          # the pattern below is split: this file is what gets grepped, so a
          # comment naming the flag fails the job it is documenting.
          #
          # A guard that knows only the runner we used to use stops working
          # the day the runner changes, which is what this commit does.
          flag="--ign""ored"
          if grep -rnE -- "$flag|--run-ign""ored" .github/workflows; then
            echo "::error::CI must not run the ignored tests; they talk to a live mail server."
            exit 1
          fi
          echo "ok: no workflow opts into the live-server tests."

      # From `main` only; see .github/actions/build-cache.
      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # The lock: nothing merges while the latest full run on `main` is red.
  #
  # The full suite -- the integration suites, the storyboards, the coverage
  # floors, the docs -- runs on every push to `main` and every night
  # (`nightly.yml`), not on pull requests: a pull request runs the merge-path
  # tier, which is budgeted to finish in minutes. What keeps that honest is
  # this pair of jobs. `Last nightly` asks what the latest completed run of
  # `nightly.yml` on `main` concluded, and `Nightly is green`, a required
  # check, fails on every pull request while that run is red -- except one
  # labelled `fixes-nightly`, which is how the fix gets in. Its merge is a
  # push to `main`, which runs the suite again, and a green run unlocks
  # everyone: `nightly.yml`'s `unlock` job re-asks this check on every open
  # pull request that was waiting.
  #
  # Until 2026-10-23 a red nightly made every pull request re-run what was
  # red on it, and pass if that passed. That was 40 minutes on nearly half
  # of all runs, and a flake in the nightly was a flake on every pull
  # request. The label is a social rule, not a technical one: a pull request
  # that wears it and does not fix `main` leaves `main` red, with its name
  # on the run.
  nightly-status:
    name: Last nightly
    runs-on: ubuntu-latest
    outputs:
      green: ${{ steps.ask.outputs.green }}
      url: ${{ steps.ask.outputs.url }}
    steps:
      - name: Ask what the latest full run on main concluded
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?status=completed&branch=main&per_page=1" \
            --jq '.workflow_runs[0] | "\(.conclusion)\t\(.html_url)\t\(.created_at)\t\(.event)"' 2>/dev/null || true)
          if [ -z "$last" ] || [ "$last" = "null" ]; then
            echo "No completed run to judge."
            echo "green=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion=$(printf '%s' "$last" | cut -f1)
          url=$(printf '%s' "$last" | cut -f2)
          when=$(printf '%s' "$last" | cut -f3)
          event=$(printf '%s' "$last" | cut -f4)
          echo "Latest full run on main: $conclusion ($when, on $event)"
          echo "  $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          case "$conclusion" in
            success|cancelled|skipped)
              echo "green=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "green=false" >> "$GITHUB_OUTPUT"
              echo "::warning::The latest full run on main failed ($url). Nothing merges until a pull request labelled fixes-nightly turns it green."
              ;;
          esac

  nightly:
    name: Nightly is green
    needs: nightly-status
    # `always()`: a skipped required check is a check that proved nothing
    # while looking like it did.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        env:
          GREEN: ${{ needs.nightly-status.outputs.green }}
          URL: ${{ needs.nightly-status.outputs.url }}
          EVENT: ${{ github.event_name }}
          FIXES: ${{ contains(github.event.pull_request.labels.*.name, 'fixes-nightly') }}
        run: |
          set -euo pipefail
          echo "latest full run on main green: ${GREEN}"
          if [ "${GREEN}" = "true" ]; then
            echo "main's full suite is green."
            exit 0
          fi
          if [ "${EVENT}" != "pull_request" ]; then
            echo "main is red, and this is main's own run: the lock is for pull requests."
            exit 0
          fi
          if [ "${FIXES}" = "true" ]; then
            echo "main is red and this pull request says it fixes it (fixes-nightly)."
            echo "It may merge; its merge runs the suite on main, and green unlocks the rest."
            exit 0
          fi
          echo "::error::main's full suite is red, so nothing merges until it is fixed."
          echo
          echo "The run:"
          echo "  ${URL}"
          echo
          echo "A pull request runs the merge-path tier, budgeted to finish in minutes;"
          echo "the integration suites, storyboards and coverage floors run on main after"
          echo "every merge and every night. While that run is red nothing is checking"
          echo "them, so nothing merges. The way through is the one pull request that"
          echo "fixes it, labelled fixes-nightly:  gh pr edit <n> --add-label fixes-nightly"
          echo "If this change is that fix, label it. If not, wait for the one that is,"
          echo "or be it."
          exit 1

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pin decides; see the note in the `fmt` job.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # `.cargo/config.toml` names `postio-linker` and `postio-cc` (#1101), and
      # anything here that compiles -- the tooling self-tests build a dummy
      # crate under this config -- needs them on PATH.
      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      - name: Cache the mdbook binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook-0.5.4

      # Keep this version pin in step with pages.yml's -- they must build the
      # same book the same way, or a PR could pass here and still fail on
      # deploy.
      #
      # Installed only when the cache did not already bring it: `cargo
      # install` refuses outright with "binary `mdbook` already exists in
      # destination" when a cached copy is on disk, so an unguarded install
      # fails the job every time the cache works. It went unnoticed because
      # the first run after the cache is seeded is the first run that can hit
      # it, and CI was dispatch-only from then until #781.
      #
      # The binary is asked, not the cache: `cache-hit` is false on a
      # restore-keys prefix hit even though the files are there, so a
      # cache-hit guard is wrong wherever restore-keys are in play (they are,
      # in the coverage, mutants and fuzz caches). One idiom for all four.
      - name: Install mdbook
        run: |
          if mdbook --version 2>/dev/null | grep -qw "v0.5.4"; then
            echo "mdbook 0.5.4 restored from the cache"
          else
            cargo install mdbook --locked --version 0.5.4 --force
          fi

      # This is what ADR 0011 Q6 calls "catch a broken link or a missing
      # SUMMARY.md entry in review": mdbook fails the build on either, and
      # this job needs no GTK, no SQLite, no compile of the Rust workspace --
      # just the checked-in Markdown, including the generated references
      # (docs/keybindings.md, docs/config.md) that the `boundaries` job's
      # crate tests already keep honest. This job does not re-run those
      # tests; it only proves the book built from their *output* still
      # renders.
      - name: mdbook build
        run: mdbook build docs/book

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `Cargo.lock` holds ~405 packages and nothing checked any of them until
      # #97. This is the "what is in the graph at all" question; the crate
      # boundary check above asks which of *our* crates may reach which, and
      # neither substitutes for the other.
      #
      # Its own job on ubuntu-latest rather than a step in `build`: it needs
      # cargo metadata and no GTK, so it runs in seconds beside the other cheap
      # checks instead of waiting on the workspace to compile.
      # The action runs cargo-deny inside a musl container, and rustup there
      # honours this repository's rust-toolchain.toml like anywhere else --
      # then fails with "override toolchain '<channel>-x86_64-unknown-linux-musl'
      # is not installed", because the container ships its own toolchain and
      # not ours. Telling the action which channel to install resolves the
      # override instead of fighting it.
      #
      # Read out of rust-toolchain.toml rather than written here: the pin has
      # one source, and a second copy is one that can drift from it silently
      # (`issue-land.sh` reads it the same way, for the same reason).
      - name: Read the pinned toolchain
        id: pin
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "cargo-deny will run on $channel"

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          rust-version: ${{ steps.pin.outputs.channel }}

  # One job became three (#818). They ran in sequence inside a single job --
  # clippy, then test, then doc -- which is three full workspace compiles
  # queued behind each other for no reason but that they shared a checkout.
  # 16.9 minutes on average, 27.6 at worst, and the wall clock was the sum.
  #
  # Side by side it is the longest of the three instead, and they still share
  # one cache: `test` writes it, the other two restore it, so a 2 GB upload
  # happens once per run. The setup they have in common lives in
  # .github/actions/rust-workspace rather than in three copies free to drift.
  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Its own cache, not the test job's. Clippy emits *check* units through
      # `clippy-driver` and `cargo test` emits *build* units; cargo
      # fingerprints those separately, so this job restored 3.1 GB and then
      # rebuilt 380 crates from `unicode-ident` up anyway. See `cache-name` in
      # the action for the measurement.
      - uses: ./.github/actions/rust-workspace
        with:
          cache-name: "clippy"

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Drop workspace artifacts before caching
        if: always()
        run: scripts/ci-drop-workspace-artifacts.sh

      # From `main` only; see .github/actions/build-cache.
      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # Broken intra-doc links used to be found only by the nightly `doc` job,
  # hours after merge; one kept the nightly red for four days and forced
  # every pull request into a full re-run. `issue-land.sh` already builds
  # rustdoc for each changed crate (#1463); this is the same check on the
  # pull request, for work that did not come through the landing script.
  #
  # Per changed crate with `--no-deps`, not the workspace: the workspace doc
  # build is the 23-minute job #833 removed from this path. The flags are
  # `nightly.yml`'s `doc` job's and `issue-land.sh`'s `run_rustdoc`, exactly;
  # change one, change all three. A crate whose docs break because of a
  # change in a *different* crate is still the nightly's to find.
  #
  # It also runs on pushes to `main`, only so the build cache gets written:
  # a pull request never saves one (#1710), and without a saved `doc` cache
  # every run would build the dependency graph cold.
  rustdoc:
    name: Rustdoc links
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Which crates changed
        id: crates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push)         range="${{ github.event.before }}...${{ github.sha }}" ;;
            *)            range="" ;;
          esac
          files=""
          if [ -n "$range" ]; then
            files=$(gh api --paginate "repos/${{ github.repository }}/compare/$range" \
                      --jq '.files[].filename' 2>/dev/null || true)
          fi
          crates=$(printf '%s\n' "$files" \
            | sed -n 's|^crates/\([^/]*\)/.*|\1|p' | sort -u \
            | while read -r c; do [ -d "crates/$c" ] && echo "$c"; done)
          echo "crates: $(echo $crates)"
          {
            echo "list<<EOF"
            printf '%s\n' "$crates"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/rust-workspace
        if: steps.crates.outputs.list != ''
        with:
          cache-name: "doc"

      - name: cargo doc, per changed crate
        if: steps.crates.outputs.list != ''
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
          CRATES: ${{ steps.crates.outputs.list }}
        run: |
          for c in $CRATES; do
            echo "--- rustdoc: $c ---"
            cargo doc --no-deps --document-private-items -p "$c"
          done

      - name: Drop workspace artifacts before caching
        if: always() && steps.crates.outputs.list != ''
        run: scripts/ci-drop-workspace-artifacts.sh

      # From `main` only; see .github/actions/build-cache.
      - name: Save the build cache
        if: ${{ !cancelled() && steps.crates.outputs.list != '' }}
        uses: ./.github/actions/build-cache-save

  test:
    name: Tests
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job's own cache, keyed `build` -- the artifacts `cargo test`
      # produces. The clippy job keeps a separate one; they cannot share.
      - uses: ./.github/actions/rust-workspace
        with:
          cache-name: "build"

      # #1126: cargo's freshness check compares a source file's mtime
      # against the fingerprint it was last built against, and a fresh
      # checkout gives every file the same "now" mtime regardless of which
      # commit last touched it -- so a cached `target/` looked entirely
      # stale and this job rebuilt from nothing every run, even when a PR
      # changed one crate. Restoring each file's mtime to the date of the
      # commit that actually touched it makes the comparison mean something
      # again: an unchanged file gets back exactly the mtime the cached
      # build was fingerprinted against, and a changed one gets a date newer
      # than that build, so cargo rebuilds precisely what the PR touched
      # plus its dependants. Must run before the first cargo invocation
      # below, and after the checkout and cache restore above -- both of
      # which is what sets the mtimes this is undoing.
      - name: Restore mtimes from commit history
        run: scripts/restore-mtimes.py

      # Sixty test files in this workspace open with "no display? skip and
      # return", which is right on a contributor's headless shell and wrong
      # here: a runner with no display returned early from every one of them
      # and reported success. The accessibility audit that docs/PRODUCT.md §20
      # depends on is one of the sixty, so that guarantee went unenforced on
      # every push until #114. A green tick meaning "nothing ran" is worse
      # than a red one.
      #
      # This gives `.cargo/config.toml`'s runner what it needs rather than
      # working around it. `scripts/headless-runner.sh` already brings up
      # `mutter --headless` and is what every local run uses; all it wants is
      # `mutter` on PATH and an `XDG_RUNTIME_DIR`, neither of which a runner
      # has by default. Supplying them means CI tests the same Wayland
      # configuration developers do — against the compositor the application
      # actually targets — instead of a second, differently-behaved one.
      #
      # There is no Xvfb backstop any more, and that is the point. X11 is not
      # a supported configuration (maintainer, 2026-09-02: "there is no plan
      # to support x11"), so a suite that passed on it proved something we do
      # not ship — and because the runner fell back in silence, a green run
      # could not be read to say which of the two had happened. Grepping a
      # full job log for `postio runner:` returned zero lines whether mutter
      # had worked perfectly or never started at all.
      #
      # So the only display here is the one the application targets. If the
      # compositor does not come up, `gtk_display_required.rs` fails the run
      # loudly, which is the outcome #114 wanted: a red tick beats a green one
      # that means "nothing ran".
      - name: Give the GTK suites a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      # The version, the checksum and the reasoning all live in
      # `scripts/install-nextest.sh`, which a workstation runs too. They used
      # to live here, and only here, which is why the tool CI requires was
      # absent from the machine every landing runs on -- `issue-land.sh` falls
      # open to `cargo test` and says nothing (#1092).
      #
      # Keyed on the script rather than on a version repeated here: the key
      # then changes exactly when the pin does, and cannot go stale against
      # it. A wrong-version restore is harmless anyway -- the script checks
      # `cargo nextest --version`, not the cache, and reinstalls.
      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      # The default test suite never touches the network: live iCloud tests are
      # #[ignore]d, and nothing here opts back into them.
      #
      # `dbus-run-session` is what makes the nested compositor possible here.
      # mutter gets all the way up on a runner -- surfaceless renderer,
      # virtual monitor, Wayland socket bound -- and then dies on
      #
      #   libmutter:ERROR:.../meta-wayland.c:761:set_gnome_env:
      #   assertion failed: (session_bus)
      #
      # which is not about the GPU, as everyone including me assumed for a
      # day: it wants a session bus and a runner has none. That log had been
      # written to $XDG_RUNTIME_DIR/<display>.log all along and never read.
      #
      # So the tests run on the same nested compositor a developer's machine
      # uses: one arrangement to reason about rather than two, and no second
      # display for a green run to have quietly meant instead.
      #
      # This does NOT fix #794's teardown segfault, and an earlier version of
      # this comment claimed the crash lived on the X11 path. It does not:
      # `backend_choice` passed its one test and then died with SIGSEGV on
      # the nested Wayland compositor, with no Xvfb anywhere in the job.
      # A shared runner is slower and busier than the workstation these
      # deadlines were chosen on, so it gets more patience -- in one line,
      # here, rather than by enlarging a constant in a test file and slowing
      # every developer's run forever. That was the only lever available while
      # the suite had 171 hand-rolled deadlines (#842).
      #
      # It costs nothing when tests pass: a wait that resolves in 3 ms returns
      # in 3 ms whatever the deadline says. It is only spent on a test that
      # was going to fail anyway.
      # `--no-fail-fast`, for the reason the nightly job already gives: plain
      # cargo abandons the remaining targets at the first failure. On this
      # run a single flaky case in `postio-runtime` stopped the job with 98
      # of ~107 binaries reported and the rest -- including two suites the
      # branch had just restructured -- never executed at all. A red run that
      # hides what else would have failed costs a whole extra round trip to
      # find out, and it is the difference between "one test is flaky" and
      # "something is badly wrong", which is exactly what you want to know
      # while looking at a red tick.
      # One process per test, and test binaries run concurrently instead of one
      # after another. Measured on this workspace: 3,462 tests across 140
      # binaries in 118s against ~500s for `cargo test --workspace`. The
      # binaries are what dominates -- `cargo test` serialises all 140 of them.
      #
      # Still inside `dbus-run-session`, for the same reason as before: mutter
      # wants a session bus and a runner has none. `--profile ci` is where
      # fail-fast is turned off, alongside the retry override for #957.
      #
      # Everything but the two GTK crates. `postio-widgets` and the desktop
      # app, `postio-gtk`, run in the two jobs below: their suites are the
      # ones a dying web process on this runner's software-GL stack can take
      # down, and they were most of this job's minutes. Apart, a flake there
      # re-runs one job rather than the whole workspace, and the engine
      # crates report in a few minutes.
      # **The sanity tier, not the whole workspace** (2026-09-19).
      #
      # A pull request now runs the same gate a landing does: the workspace's
      # unit tests, plus the integration suites of the crates whose *tests
      # enumerate a vocabulary* -- the golden binding tables, `[keys]`,
      # `docs/keybindings.md`, `docs/config.md`. Those are the ones neither
      # `--lib` nor `cargo check --all-targets` can fail for, which is the
      # whole argument in `scripts/full-suite-crates.sh`.
      #
      # The rest of the integration suites run on the nightly timer and again
      # as the release gate. That is a deliberate trade and it is not free:
      # this project's characteristic bug is layers that each pass and were
      # never joined up, and those are exactly what a unit tier cannot see.
      # What keeps the window to a day rather than a release is `nightly.yml`,
      # and what stops a red nightly being ignored is the `nightly` job below,
      # which refuses to go green while the last run was a failure.
      - name: cargo nextest run (sanity tier)
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: >-
          dbus-run-session -- cargo nextest run --workspace --profile ci --lib
          -E 'not (package(postio-widgets) + package(postio-gtk))'

      # No test on the merge path waits on the clock (CLAUDE.md, Tests). A
      # literal sleep is caught by check-no-clock-waits.py; a product timer
      # run in real time shows only as duration, so each nextest run above
      # leaves a report and this refuses any case over the tier's budget:
      # 10 s for a unit or integration case, 20 s for one that opens a GTK
      # window. The numbers and the remedies are in the script.
      - name: Every test under its budget
        if: ${{ !cancelled() }}
        run: scripts/ci-test-budget.py target/nextest/ci/junit.xml 10

      - name: cargo nextest run (the suites a vocabulary change breaks)
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: >-
          dbus-run-session -- cargo nextest run --profile ci
          -p postio-core -p postio-config

      - name: Every test under its budget
        if: ${{ !cancelled() }}
        run: scripts/ci-test-budget.py target/nextest/ci/junit.xml 10

      # **nextest does not run doctests**, and does not say so. They are
      # compiled and run by rustdoc, not by a test binary it can list, so this
      # step is not a leftover to tidy: delete it and ~20 doctests stop running
      # with nothing to report that they did. Under `dbus-run-session` like the
      # step above, so the two see the same environment.
      - name: cargo test --doc
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- cargo test --workspace --doc

      # The workspace's own artifacts are dropped before the save, and the
      # ~400 third-party crates are what the cache keeps. #1126 kept ours,
      # on the argument that "Restore mtimes from commit history" above made
      # an unchanged crate's artifacts reusable. It does, for as long as the
      # cache is fresh -- and it is not: `actions/cache` cannot overwrite a
      # key, so this cache is re-saved only when Cargo.lock or a profile
      # changes, and within hours every merge to `main` has touched some
      # crate whose dependants then rebuild. Measured on #2004, a pull
      # request that changed no Rust at all: an exact cache hit, and all 46
      # workspace units compiled anyway, 110 s. Keeping them bought nothing
      # and cost 1.7 GB of the repository's 10 GB cache quota (4.6 GB of
      # which this one cache was), which is what kept evicting the macOS
      # cache, and 155 s of restore against ~90.
      #
      # `scripts/lib/drop-workspace-artifacts.sh` is the one copy of what
      # "ours" means; clippy and rustdoc above call the same script.
      - name: Drop workspace artifacts before caching
        if: always()
        run: scripts/ci-drop-workspace-artifacts.sh

      # From `main` only; see .github/actions/build-cache.
      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # The two GTK crates, one job each, unit and integration suites both --
  # see the `test` job's nextest step for why they are apart from the
  # workspace and from each other. Same runner, same compositor, same
  # patience; their own build caches, because the artifacts a GTK crate's
  # suite produces are not the ones the workspace job keeps, and two jobs
  # saving one cache key race.
  #
  # `postio_widgets::composer::web_process` is the other half of the split: a
  # web process that dies fails the case in one turn of the loop rather than
  # at nextest's cap, so a flake here costs seconds and a retry, not four
  # minutes and a red run.
  #
  # The shared widgets in two shards (#1710 follow-up, 2026-10-01): splitting
  # the suite across two runners halves the wall clock, and both restore the
  # same warm `build-gtk` cache, so the price is one runner's build check,
  # not a second cold build.
  # The frontend suites: compiled once, run on six runners.
  #
  # They were two jobs, `Tests (GTK widgets N/2)` and `Tests (application)`,
  # and each compiled its own crate's tests before running them: 2.7 minutes
  # of runner start, cache restore and compile before the first test, then
  # 11 minutes of application tests on four cores. Sharding that job the
  # same way would have paid the 2.7 minutes on every shard.
  #
  # So one job builds the test binaries of both crates and ships them as a
  # nextest archive (`cargo nextest archive`: the binaries, their build-script
  # outputs, and nextest's own metadata; 169 MB for both crates), and six
  # shards download it, check out the tree for the fixtures, and run their
  # partition against it. A shard restores no build cache and compiles
  # nothing; its floor is the apt cache, the toolchain and the download,
  # about a minute. `--workspace-remap` is what lets a test find its
  # fixtures by path in the checkout rather than where the archive was
  # built, and the runner in `.cargo/config.toml` still applies, read from
  # the checkout: every shard runs on its own headless compositor as before.
  #
  # Six, from the numbers of 2026-10-23: the two suites are about 33 CPU-
  # minutes of tests after the sweeps moved to the nightly, so six shards of
  # four cores run about 1.4 minutes each. The partition is `count`, which
  # deals cases round-robin by binary and name and balances well now that no
  # case takes more than 15 s.
  frontend-build:
    name: Build the frontend tests
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-workspace
        with:
          cache-name: "build-app"
      - name: Restore mtimes from commit history
        run: scripts/restore-mtimes.py
      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}
      - name: Install cargo-nextest
        run: scripts/install-nextest.sh
      - name: cargo nextest archive (postio-gtk, postio-widgets)
        run: >-
          cargo nextest archive -p postio-gtk -p postio-widgets --profile ci
          --archive-file "$RUNNER_TEMP/frontend-tests.tar.zst"
      - name: Ship the archive to the shards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-tests
          path: ${{ runner.temp }}/frontend-tests.tar.zst
          retention-days: 1
          if-no-files-found: error
      # From `main` only; see .github/actions/build-cache.
      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  test-frontends:
    name: Tests (frontends ${{ matrix.shard }}/6)
    runs-on: ubuntu-26.04
    needs: [changes, frontend-build]
    if: needs.changes.outputs.rust == 'yes'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The system libraries and the toolchain, and nothing to build.
      - uses: ./.github/actions/rust-workspace
        with:
          build-cache: "false"
      - name: Give the GTK suites a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}
      - name: Install cargo-nextest
        run: scripts/install-nextest.sh
      - name: Fetch the archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-tests
          path: ${{ runner.temp }}
      # nextest extracts the archive to a temporary directory of its own and
      # keeps its store -- the JUnit report the budget step reads -- under
      # the remapped workspace's target/, the same place as a normal run
      # (checked on the Linux box, 2026-10-23: 133 cases from the archive in
      # 59 s, report at target/nextest/ci/junit.xml).
      - name: cargo nextest run (shard ${{ matrix.shard }}/6)
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: >-
          dbus-run-session -- cargo nextest run
          --archive-file "$RUNNER_TEMP/frontend-tests.tar.zst"
          --workspace-remap "$GITHUB_WORKSPACE"
          --profile ci --partition count:${{ matrix.shard }}/6
      - name: Every test under its budget
        if: ${{ !cancelled() }}
        run: scripts/ci-test-budget.py target/nextest/ci/junit.xml 20

  # The one required check for the GTK suites.
  #
  # `Tests (frontends N/6)` and the build they run from are not required by
  # name, and four GTK-only failures reached main in one session when their
  # predecessors were not. They cannot simply be added to the ruleset: they
  # are skipped when no Rust changed (a skip counts as passed) and the shards
  # have matrix names. This job always runs, so the
  # ruleset gets one fixed name, and it fails unless they succeeded -- or were
  # skipped because `changes` said no Rust changed. Any other skip, say one
  # because `changes` itself failed, is a gate green having done nothing, so
  # `scripts/ci-frontends-gate.sh` refuses it. There is no label that bypasses
  # it; a flake already gets one isolated retry.
  #
  # `macos` is not in it: it is gated on `macos`, not `rust`, and belongs to
  # the Mac port's own lane. See the script.
  frontends:
    name: Frontends
    runs-on: ubuntu-latest
    needs: [changes, frontend-build, test-frontends]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide
        env:
          RUST: ${{ needs.changes.outputs.rust }}
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.frontend-build.result }}
          SHARDS: ${{ needs.test-frontends.result }}
        run: scripts/ci-frontends-gate.sh "$RUST" "$CHANGES" "frontend-build=$BUILD" "test-frontends=$SHARDS"

  # The macOS half, and the link.
  #
  # ADR 0019 Q7 says how Linux stays green and this is the other direction:
  # `postio-ffi` has no macOS-specific code, so the `test` job above already
  # proves the *seam* on a cheap Linux runner. What a macOS runner adds is the
  # Swift, the bindings generator's output, and the link between them — none of
  # which anything else compiles. A Linux session cannot break the seam
  # silently; without this, it can break the Swift silently.
  #
  # Gated on `macos`, which is not `rust`: Swift cannot reach a Rust build, so
  # a Swift-only change skips the workspace suite entirely, and a `postio-ffi`
  # change runs both because the bindings the Swift compiles against are
  # regenerated from it (`scripts/ci-changes.sh`).
  #
  # macos-latest has an Aqua session, which is what
  # `WindowServerRequiredTests` checks it still has: an ssh step or a
  # `launchctl` context without one would make any Swift test that needs a
  # window server skip and report success.
  macos:
    name: macOS build and Swift tests
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.macos == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pin decides; see the note in the `fmt` job. `rust-toolchain.toml`
      # is honoured by rustup on every platform, so there is no toolchain
      # step here either — and `check-toolchain-pinned.py` refuses one.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # `.cargo/config.toml` names `postio-cc` and `postio-linker` as bare
      # program names (#1101). `scripts/macos-build.sh` installs them itself,
      # but doing it here too keeps the failure — if there is one — attached
      # to a step that names it rather than to a cold cargo build.
      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      # The registry and `target/`. This cached only the registry, so
      # `cargo build -p postio-ffi` was a cold 14-minute build on every run --
      # the job's median was 16.7 minutes and it was the last to finish in 31
      # of 56 pull requests (#1710).
      - name: Restore the build cache
        uses: ./.github/actions/build-cache
        with:
          name: macos-ffi

      # Xcode's own toolchain, outside any Nix-style environment. Ghostty hit
      # this and hardcoded the fix in three places: a `swift` that is not the
      # one `xcode-select` points at links against a different SDK and fails
      # in a way that reads as a source error.
      - name: Report the Swift toolchain
        run: |
          xcode-select --print-path
          swift --version

      # The whole chain: cargo, the bindings generator, the tokens, and
      # `swift build`. Five joins, each of which fails in its own way — doing
      # them by hand in the wrong order produces a Swift file that compiles
      # against nothing, which is why the script exists.
      - name: Build the macOS application
        # `--with-tests`: the test bundle is built here, in the same pass, so
        # the step below only runs it. It used to build the package twice.
        run: scripts/macos-build.sh --with-tests

      # Runs `macos-build.sh --lib-only` itself first, so this cannot test
      # against a stale library.
      - name: Swift tests
        env:
          CI: "true"
        run: scripts/macos-test.sh

      # The bundle is the deliverable, and it is the step that exercises the
      # icon render and the ad-hoc signature — neither of which the build
      # above touches, and both of which fail on their own terms.
      - name: Assemble Postio.app
        run: scripts/macos-bundle.sh

      # The bindings generator's self-test, here rather than among the tooling
      # self-tests: it builds `postio-ffi`, which the build above has just
      # done, so it costs seconds here and was 15 minutes there. ci-changes.sh
      # starts this job when the generator or the test changes.
      - name: The bindings generator's self-test
        env:
          CI: "true"
          POSTIO_TEST_PATIENCE: "2"
        run: python3 scripts/tests/test-ffi-bindgen.py

      # From `main` only; see .github/actions/build-cache.
      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # The tooling self-tests, on the platform whose shell they were never run
  # on (#1151).
  #
  # `scripts/jobserver.sh` started its holder with `sleep infinity`, a GNU
  # extension BSD rejects. On macOS the holder exited instantly, no pool ever
  # existed, and every cargo on the machine fell back to two jobs on a
  # ten-core box -- for months, with a green board.
  # `scripts/tests/test-jobserver.py` catches it in two seconds. It had simply
  # never been run on a Mac.
  #
  # `scripts/` is the least platform-specific-looking code in this repository
  # and is mostly shell, which is where portability breaks live. The
  # self-tests are the only thing that tests it, and until this they tested it
  # on one platform: the gate ran where the bug was not, which is the shape
  # `docs/notes/2026-09-05-the-gate-that-runs-cannot-see-the-platform-that-does-not.md`
  # records one layer up.
  #
  # # Why its own job and not a step in `macos`
  #
  # `macos` is gated on `changes.outputs.macos`, and `ci-changes.sh` answers
  # `no` for `scripts/tests/`, `scripts/checks/` and `scripts/issue-*.sh` --
  # which are exactly the changes the self-tests exist for. Hanging them off
  # that gate would skip them on every diff that most needs them. So this is
  # gated on the tooling question instead, which is the same one `boundaries`
  # asks, from the same script.
  #
  # The Linux job keeps its own copy of that decision rather than reading this
  # one: #1151 asks that it be unchanged in what it runs and how long it
  # takes, and rewiring it to depend on `changes` would be neither.
  macos-tooling:
    name: Tooling self-tests (macOS)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.tooling == 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pin decides; see the note in the `fmt` job. Several self-tests
      # build a cargo sandbox, so this job needs a toolchain even though it
      # compiles none of the workspace.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # `.cargo/config.toml` names `postio-cc` and `postio-linker` as bare
      # program names (#1101), and a sandbox that inherits that config needs
      # them on PATH like any other build here.
      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      - name: Restore the build cache
        uses: ./.github/actions/build-cache
        with:
          name: tooling
          target: "false"

      # `test-issue-land-no-tests.py` asserts that the landing gate gives the
      # same answer under both test runners, so it needs the one that is not
      # already here. `prereq.py` turns a missing prerequisite into a failure
      # under CI rather than a skip, so this is what stops that self-test
      # standing down on a runner where it is supposed to run. Cached and
      # keyed on the script, as the Tests job does it.
      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      # The same two dependency-policy cases run here (#1290); see the
      # boundaries job for why the tool has to be on PATH.
      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('scripts/install-cargo-deny.sh') }}

      - name: Install cargo-deny
        run: scripts/install-cargo-deny.sh

      # `check-workspace-hack.py` and its self-test ask `cargo hakari` whether
      # the workspace-hack is in step with the manifests (ADR 0047); under CI
      # a missing tool fails rather than skips (`scripts/lib/prereq.py`).
      # Cached on the install script's hash, like the two above.
      - name: Cache cargo-hakari
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-hakari
          key: ${{ runner.os }}-cargo-hakari-${{ hashFiles('scripts/install-hakari.sh') }}

      - name: Install cargo-hakari
        run: scripts/install-hakari.sh

      # `--skip test-ffi-bindgen.py`, and so no `target/` in the cache above:
      # that test builds `postio-ffi`, most of the workspace, and it runs in
      # the `macos` job after the build that job already does.
      # `CI` is what `scripts/lib/prereq.py` reads to decide that a missing
      # prerequisite is a broken runner rather than somebody's laptop. Set
      # explicitly, the way the Swift job sets it, rather than relied upon:
      # a self-test that skips here is indistinguishable from one that
      # passed, and that is the failure this whole job exists to stop.
      - name: Prove the tooling still holds itself up on macOS
        env:
          CI: "true"
          POSTIO_TEST_PATIENCE: "2"
        run: scripts/run-self-tests.sh --logs "$RUNNER_TEMP/self-test-logs" --skip test-ffi-bindgen.py

      # From `main` only; see .github/actions/build-cache.
      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save
