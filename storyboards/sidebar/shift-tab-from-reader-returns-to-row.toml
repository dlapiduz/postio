# Shift-Tab from the reader lands on the row being read (#437).
#
# The defect: Shift-Tab out of the reader landed on the list's last row, not
# the current one. The reader is a web view and takes real key input; the
# focus chain drops the chord there, so this reports not covered until a
# real-input run exists. The step is written so that run has the check.
source = { kind = "issue", ref = "#437" }
proof  = "pinned"

[[step]]
command = "next_message"
[[step]]
id      = "row"
command = "next_message"
check   = { cursor.index = 2 }

[[step]]
command = "go_to_folders"
[[step]]
command = "cycle_pane"
[[step]]
command = "cycle_pane"
check   = { keyboard.region = "reader" }

[[step]]
command = "cycle_pane_back"
routing = "real"
check   = { keyboard.region = "list", cursor.index = { same_as = "row" } }
expect  = "The keyboard is back on the list, on the row that was open, not on the last row."
