# Open a to-do, capture it as a task in the vault, and come back
# (specs/009-focus-macos US9, screen 25; the controller's capture, T109).
#
# Needs `[focus.vault]` (C9): without one `T` says so in the toast and
# opens nothing. With one, `T` on an open message with a to-do opens the
# capture sheet over it, the keyboard in its field: the sentence
# verbatim, its due day with the quick picks, the project the vault
# suggests and why, and the exact line it will append, its `postio://`
# link before the date (C21). Alt+S puts the subject in its place;
# Ctrl+Return appends the line, the sheet closes onto the message it was
# captured from, and the toast says where the line went. (The Mac's
# capture replaces the message window instead, M4.)
apps   = ["focus"]
# The window runs with the demo's vault configured: without one, `T` only
# says how to name one (`reader/capture-task-without-vault-says-why`).
preset = "vault"
source = { kind = "spec", ref = "specs/009-focus-macos US9" }

[[step]]
wait    = { until = { cursor.index = 0 } }
check   = { keyboard.region = "list", overlay.kind = "none" }

[[step]]
id      = "todo"
command = "toggle_has_action"
check   = { keyboard.region = "list" }
expect  = "Only rows with an invite, a question or a to-do are listed, under the Has action heading."

# The first two Has action rows are an invitation and a question; the
# to-do is the third.
[[step]]
command = "next_message"
check   = { cursor.index = 1 }

[[step]]
command = "next_message"
check   = { cursor.index = 2, cursor.subject = "Harbor API draft v3" }

[[step]]
command = "open_message"
settle  = { until = { view = "reader" } }
check   = { view = "reader", keyboard.region = "reader" }
expect  = "The to-do opens in the message window, its action card under the sender block."

[[step]]
command = "capture_task"
check   = { keyboard.typing = true }
expect  = "Capture opens over the message, the keyboard in its Task field: Cancel with Esc, Task and Note, Add task with Ctrl+Return as the primary button. \"From\" names the sender, the subject and when it came; the Task field holds the action sentence as written, with \"Alt+S use the subject instead\" under it; Due shows the day the mail gives with Today, the weekdays and None beside it; Project names the vault's suggestion and why, with Change; and the preview is the exact line, ending in the message's postio:// link and the date."

[[step]]
command = "capture_use_subject"
check   = { keyboard.typing = true }
expect  = "The Task field holds the message's subject now, and the preview's line says the subject too."

[[step]]
command = "capture_write"
check   = { view = "reader", keyboard.region = "reader", keyboard.typing = false }
expect  = "Capture closes onto the message it was captured from, the keyboard back in the message, and the toast says the task was added to the project, with its due day."
