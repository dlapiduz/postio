# Search finds files by what is in them, and the Files tab is where they
# are cards (specs/010-focus-search US8, FR-031, FR-044, design §3.8,
# screen 11).
#
# "fy26" is written only inside Atlas-budget-template.xlsx, on sheet
# "Summary", row 14: no subject, body or file name says it. The
# Threads tab finds the thread that carries the file, tagged
# with the file's name, and the passage says where in the file it was. The
# Files tab is a grid of cards, four across: a preview with the matching
# line marked, the type tile, the name, "sender · date · size", the
# matching line from the contents, and "in ‘<subject>’". The arrows move
# between cards, Space hands a copy of the file to the system (Quick Look
# on the Mac, the desktop's app for its type on Linux), Return opens its
# message, mod+Down saves it.
#
# The seed's two PDFs whose bytes were never downloaded are never fetched
# to be indexed (FR-050): searching their contents finds nothing, and the
# header says contents are searched only for files on this machine.
#
# A top hit is also listed under its month: every thread is in its month,
# a top hit too (D4 in postio-focus's results.rs).
#
# The Files tab's count is its cards, the same on the Threads tab as once
# it opens (#2178), and its heading and footer count the files (#2183).
# Space and mod+Down hand the file to the system's previewer and save
# dialog, which are outside the window the runner films, so those steps
# are filmed by hand on both apps.
#
# The engine's half is postio-index's attachment_text and conversations
# suites and postio-session's attachment_index_pass; the controller's is
# postio-focus tests/controller_suite/results.rs (files_*).
apps   = ["macos", "focus"]
source = { kind = "spec", ref = "specs/010-focus-search US8" }
seed   = "search"
design = "11-files-tab"

[[step]]
wait    = { until = { cursor.index = 0 } }

[[step]]
command = "search"

[[step]]
type    = "fy26"

[[step]]
id      = "found-inside"
command = "show_all_results"
check   = { keyboard.region = "results" }
expect  = "The results open on Threads with one thread, “Atlas budget template v2”, listed twice: as the one top hit, and again under its month, “April 2026 · 1”, because every thread is in its month, a top hit too. Its source tag is the file's name, “Atlas-budget-template.xlsx”, and its passage reads “Sheet ‘Summary’, row 14: Total Atlas budget FY26 …” with “FY26” marked. The tabs read Threads 1 · Files 1 · People 1."

[[step]]
id      = "files"
command = "results_files"
check   = { keyboard.region = "results" }
expect  = "The Files tab's key (⌘2, ctrl+2 off the Mac) shows the Files tab: one card, ringed, under the heading “1 file”. Its preview is a sheet with the matching row marked in highlight yellow; the XLSX tile, “Atlas-budget-template.xlsx”, “Ada Moreno · <date> · <size>”; “Sheet ‘Summary’, row 14: Total Atlas budget FY26” with “FY26” marked; and “in ‘Atlas budget template v2’”. The header line says contents are indexed on this Mac, or “on this computer” off the Mac."

[[step]]
command = "history_back"
check   = { keyboard.region = "list" }

[[step]]
command = "search"

[[step]]
type    = "atlas budget"

[[step]]
command = "show_all_results"
check   = { keyboard.region = "results" }

[[step]]
id      = "grid"
command = "results_files"
check   = { keyboard.region = "results" }
expect  = "The Files tab for “atlas budget”: a grid of cards four across with 12 between them, the first ringed. Every file whose bytes are on this machine and whose name or contents match has a card: the two workbooks (“Sheet ‘Q3’, row …”, “Sheet ‘Summary’, row …”), the September actuals (“Page 1: Atlas budget actuals, September”), the memo (“Paragraph …”), the review deck (“Slide …”) and the notes (“Line …”). The Files tab's count is the number of cards, the count it had on the Threads tab, and the heading and the footer say it too: “6 files”, “6 files · local index · … ms”."

[[step]]
key     = "Right"
check   = { keyboard.region = "results" }
expect  = "→ moves the ring to the second card; nothing else changes."

[[step]]
key     = "Down"
check   = { keyboard.region = "results" }
expect  = "↓ moves the ring to the card below it, in the second row."

[[step]]
key     = "Up"
check   = { keyboard.region = "results" }
expect  = "↑ moves it back to the second card of the first row."

[[step]]
id      = "look"
command = "quick_look"
check   = { keyboard.region = "results" }
expect  = "Space hands the system a copy of the file from the app's own temporary folder: on the Mac, Quick Look opens on it; on Linux, the desktop opens it in its app for the type, and the footer's Space says “open the file”. The grid stays where it was, with its ring."

[[step]]
id      = "unlook"
command = "quick_look"
check   = { keyboard.region = "results", overlay.kind = "none" }
expect  = "Space again lets the copy go: on the Mac it closes Quick Look; on Linux the desktop's app is a window of its own, closed there. The grid is as it was, the ring on the same card."

[[step]]
id      = "save"
key     = "mod+Down"
expect  = "The save key (⌘↓, ctrl+Down off the Mac) offers to save the file: the system's save dialog, with the file's name filled in."

[[step]]
command = "open_message"
check   = { view = "reader" }
expect  = "Return opens the message that carries the ringed file, scrolled to its attachments."

[app.macos.step.look]
skip = { reason = "QLPreviewPanel is the system's own window, outside the app's observation; filmed by hand until the runner can see it" }

[app.macos.step.save]
skip = { reason = "The save panel is the system's own window, outside the app's observation; filmed by hand until the runner can see it" }

[app.focus.step.look]
skip = { reason = "The desktop's previewer opens the copy outside the window the runner films; filmed by hand until the runner can see it" }

[app.focus.step.unlook]
skip = { reason = "Closes the previewer the look step opened, which the runner cannot see" }

[app.focus.step.save]
skip = { reason = "The save dialog is the portal's own window, outside the window the runner films; filmed by hand until the runner can see it" }

# The tabs' words and the count, which only Postio publishes (#2118:
# Threads, never Conversations).
[app.focus.step.found-inside]
check = { keyboard.region = "results", app.focus.results.tab = "Threads", app.focus.results.count_line = "1 thread" }

[app.focus.step.files]
check = { keyboard.region = "results", app.focus.results.tab = "Files", app.focus.results.count_line = "1 file" }

[app.focus.step.grid]
check = { keyboard.region = "results", app.focus.results.tab = "Files", app.focus.results.count_line = "6 files" }
