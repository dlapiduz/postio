# Leaving the composer returns the keyboard to the list (#1751).
#
# In the classic app, after Escape from a composer the keyboard was left on
# the split pane's divider rather than on a row (#1751). Focus's composer is
# a dialog over the list, and the next key is the test: the list is where
# the keyboard was when the composer opened, on the row it left.
#
# Re-expressed for Focus (T265), where it holds: pinned. The classic app
# #1751 was found in is removed by T256.
apps   = ["focus"]
source = { kind = "issue", ref = "#1751" }
proof  = "pinned"

[[step]]
command = "next_message"
check   = { keyboard.region = "list", cursor.index = 0 }

[[step]]
command = "compose"
check   = { composer.open = true, keyboard.region = "composer" }

[[step]]
command = "back"
check   = { composer.open = false, keyboard.region = "list", cursor.index = 0 }
expect  = "The composer is gone and the keyboard is on the list row it left."
