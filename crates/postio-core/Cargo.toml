[package]
name = "postio-core"
description = "UI-agnostic runtime: command bus, event stream, app state, undo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-channel = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
postio-config.workspace = true
postio-model.workspace = true
serde = { workspace = true }
# `net` compiles in tokio's IO driver; relying on another crate to unify it would make socket
# support depend on who else is built.
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
postio-workspace-hack.workspace = true

[dev-dependencies]
postio-test-support = { workspace = true, features = ["logs"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
