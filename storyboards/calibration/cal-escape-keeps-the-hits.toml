# must_fail: #1474 stated as the intent. Escape really closes the bar.
apps        = ["focus"]
source      = { kind = "issue", ref = "#1474" }
calibration = "must_fail"

[[step]]
command = "search"

[[step]]
type    = "harbour"

[[step]]
key     = "Return"
settle  = { until = { app.focus.bar.messages = { changed = true } } }

[[step]]
command = "back"
expect  = "After Escape the command bar is still open, listing the search's matches under its count."
