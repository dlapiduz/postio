[package]
name = "postio-sync"
description = "Sync engine: operation queue, QRESYNC resync, IDLE, and backoff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# `default-features = false` drops `io-imap` and its TLS stack: all this crate
# needs is the `MailBackend` seam and its mock. See ADR 0001 and the feature
# comment in `postio-imap/Cargo.toml`.
# Spelled as a path rather than inherited from the workspace: cargo will not
# let an inherited dependency turn default features off, and turning them off
# is the entire point here.
postio-imap = { version = "0.1.0", path = "../postio-imap", default-features = false }
# The search index's body column. A body is only ever indexable at the moment
# it lands, and this crate is where it lands -- see `fetch_body` (#327).
postio-index.workspace = true
postio-model.workspace = true
postio-smtp.workspace = true
postio-storage.workspace = true
# Matches `postio-storage`: one `links = "sqlite3"` crate in the graph, so
# the feature that selects SQLCipher has to agree everywhere (ADR 0014).
rusqlite = { version = "0.40.2", features = [
    "bundled-sqlcipher-vendored-openssl",
] }
secrecy = "0.10.3"
thiserror = "2.0.20"
tracing = "0.1"

[dev-dependencies]
# Decoding the SASL PLAIN argument a transcript recorded, so a test can say
# *which* credential reached the server rather than only that one did.
base64 = "0.22.1"
# Tests only: the real io-imap-backed backend and the in-process IMAP server
# it can be pointed at, so the engine can be driven over a loopback socket
# rather than only against the mock. Everything above still goes through
# `MailBackend` — no io-imap type appears anywhere in this crate — and the
# ordinary build keeps `default-features = false` above, which is what keeps
# the protocol crate out of the engine's dependency graph.
postio-imap = { path = "../postio-imap", features = ["imap", "test-server"] }
postio-storage = { workspace = true, features = ["test-support"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
