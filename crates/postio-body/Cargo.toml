[package]
name = "postio-body"
description = "Message bodies in both directions: the document, its HTML subset, quoting and sanitisation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# The HTML parser, and the reason this is its own crate rather than part of
# postio-model: `ammonia` pulls html5ever, markup5ever and a generated tag
# table, and postio-model is what the whole workspace waits on. See ADR 0004.
ammonia = "4"
# Already in the tree: `ammonia` parses `style` attributes with it, so the
# sender-CSS work shares one parser rather than adding a second. See #1326.
cssparser = "0.37"
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
postio-model = { workspace = true }

[dev-dependencies]
# Spike T0.1 (specs/005-tui-frontend T005): is htmd good enough to turn the
# reader's sanitised HTML into Markdown for the terminal? Moves to
# [dependencies] with `markdown::from_html` (T040) if it is.
htmd = "0.5.5"
postio-model = { workspace = true, features = ["test-corpus"] }

[lints]
workspace = true
