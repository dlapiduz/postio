# Repeated archive works down the list, one row per press (#1687, #1746).
#
# The defect: after one archive the cursor went elsewhere, so a second `a`
# archived a message nobody had looked at. `a a a` is how people clear a
# list, so each press must act on the row the cursor was on, and the cursor
# must stay at the same index (the next row slid into it). On the
# thirty-six-thread seed so there is always a row below.
#
# Focus's form of the defect is #1746: the cursor was not handed to the row
# below, so after the first archive there was no cursor and the next two
# presses archived nothing.
#
# Re-expressed for Focus (T265): the list opens with the cursor on index 0,
# so one `j` leaves it on index 1.
apps   = ["focus"]
source = { kind = "issue", ref = "#1746" }
proof  = "pinned"
seed   = "thirty-threads"

[[step]]
wait    = { until = { cursor.index = 0 } }
check   = { keyboard.region = "list", cursor.index = 0 }

[[step]]
command = "next_message"
check   = { cursor.index = 1, rows.count = 36 }

[[step]]
command = "archive"
check   = { keyboard.region = "list", cursor.index = 1, rows.count = 35 }

[[step]]
command = "archive"
check   = { keyboard.region = "list", cursor.index = 1, rows.count = 34 }

[[step]]
command = "archive"
check   = { keyboard.region = "list", cursor.index = 1, rows.count = 33, notice.undo = true }
expect  = "Three rows are gone, one per press, and the cursor ring still sits on the second row. The list never scrolled to the top."
