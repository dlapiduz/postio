[package]
name = "postio-classify"
description = "Classification for Postio Focus: filter, hold and mark, decided in layers, with no path that sends mail."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Due dates and event times in the fixed schema.
chrono = { workspace = true, features = ["std"] }
# The message as filed: its envelope, flags and addresses. The leaf every
# crate waits on, with nothing in it that sends or connects.
postio-model = { workspace = true }

[dev-dependencies]
# Spike S4 reads its labelled dataset, tests/data/needs_action.toml.
serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
