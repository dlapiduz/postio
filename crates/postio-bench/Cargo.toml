[package]
name = "postio-bench"
description = "The workspace's benchmarks, kept out of the crates they measure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# No library and no binary: this crate is nine bench targets and nothing else.
# Without this, cargo looks for `src/lib.rs` and fails.
[lib]
path = "src/lib.rs"

# Everything is a dev-dependency, deliberately.
#
# Bench targets can read them, and `cargo build --workspace` cannot -- which
# matters because `postio-storage/test-support` pulls in seeding and fixture
# code that has no business being reachable from an ordinary build. As
# ordinary dependencies, feature unification would switch that on for every
# crate in the workspace.
[dev-dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
chrono = { workspace = true, features = ["std"] }
criterion = "0.8.2"
futures-util = { workspace = true }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_20"] }
postio-config.workspace = true
postio-core.workspace = true
postio-gtk.workspace = true
postio-account.workspace = true
postio-index.workspace = true
postio-model.workspace = true
postio-runtime.workspace = true
postio-search.workspace = true
postio-session.workspace = true
postio-storage = { workspace = true, features = ["test-support"] }
postio-sync.workspace = true
# Throwaway stores: a bench that measured a database it had to keep would be
# measuring the disk it was left on.
tempfile = { workspace = true }
# `store_reads` builds a multi-thread runtime and `sync_lanes` a current-thread
# one, both by hand: the store and the sync engine are async, and a bench has
# to own the runtime it measures them on.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

# The perf budgets CLAUDE.md names -- startup, interaction, search -- plus the
# store, sync and list benchmarks. `harness = false` on every one: each owns
# its `main`, whether through criterion or by printing its own table.
[[bench]]
name = "action_round_trip"
harness = false

[[bench]]
name = "perf_budgets"
harness = false

[[bench]]
name = "list_scroll"
harness = false

[[bench]]
name = "composer_open"
harness = false

[[bench]]
name = "conversation_rows"
harness = false

[[bench]]
name = "search_budget"
harness = false

[[bench]]
name = "search_under_load"
harness = false

[[bench]]
name = "store_reads"
harness = false

[[bench]]
name = "sync_writes"
harness = false

[[bench]]
name = "sync_lanes"
harness = false
