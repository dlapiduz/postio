# The reply's caret sits above the quote, and typing lands there (15192fb5).
#
# The defect: the caret offset for "none" and for "at the start" were the
# same number, so a reply's caret could sit below the quote and typing went
# where the person was not looking. The caret's offset is not an observed
# field, so this is judged from the frame: the empty first line the caret
# sits on must be above the "wrote:" line.
#
# Re-expressed for Focus (T265): the cursor is on the first row, the
# one Reply answers.
apps   = ["focus"]
source = { kind = "commit", ref = "15192fb5" }
proof  = "pinned"

[[step]]
wait    = { until = { cursor.index = 0 } }
[[step]]
command = "reply"
check   = { composer.open = true, keyboard.field = "body" }
expect  = "The caret is on an empty line above the quoted message."

[[step]]
type    = "Thanks."
check   = { composer.open = true, keyboard.field = "body", keyboard.typing = true }
expect  = "The typed word lands on the first line, above the 'wrote:' line and the folded quote. A blinking caret may be off in one frame, so the typed text is what shows where it was."
