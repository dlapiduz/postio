# The agent hooks' own tests. `ci.yml` ignores `.claude/**`, which left `guard-shared-tree.py`
# without coverage (#87).
# A workflow of its own on exactly the paths ci.yml skips; Python with no dependencies, so seconds.
name: Hooks

# Written out twice, not shared through a YAML anchor: a workflow that fails to register gives no
# diagnostic.
on:
  push:
    branches: [main]
    paths:
      - '.claude/hooks/**'
      - '.github/workflows/hooks.yml'
  pull_request:
    paths:
      - '.claude/hooks/**'
      - '.github/workflows/hooks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Shared-tree guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Prove the guard denies what it must and allows what it must
        # The suite asserts both halves: destructive commands refused in the shared checkout and
        # allowed in a private worktree.
        run: python3 .claude/hooks/test-guard-shared-tree.py

  session-start:
    name: Session start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Prove the session start fetches, reports and never fails
        run: python3 .claude/hooks/test-session-start.py

  format-rust:
    name: Format after edit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Prove an edited file is formatted and nothing else is touched
        run: python3 .claude/hooks/test-format-rust.py
