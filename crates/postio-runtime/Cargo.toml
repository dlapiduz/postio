[package]
name = "postio-runtime"
description = "The half of the runtime that owns a database and a connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-channel = { workspace = true }
chrono = { workspace = true, features = ["std"] }
# `FuturesUnordered` only, for the concurrent sync wave; `default-features = false` keeps the
# futures executor and `Sink` out of the graph.
futures-util = { workspace = true }
io-http = { version = "0.9", default-features = false, features = ["std"] }
pimalaya-stream = { workspace = true }
url = { workspace = true }
postio-core.workspace = true
postio-account.workspace = true
postio-index.workspace = true
postio-model.workspace = true
postio-search.workspace = true
postio-smtp.workspace = true
postio-storage.workspace = true
postio-sync.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
zbus = { version = "6.3.0", default-features = false, features = ["tokio"] }
postio-workspace-hack.workspace = true

[dev-dependencies]
# The application's allocator, so `first_sync_memory` measures the heap the application would hold
# (#1606).
mimalloc = "0.1"
postio-model = { workspace = true, features = ["test-corpus"] }
postio-storage = { workspace = true, features = ["test-support"] }
postio-test-support = { workspace = true, features = ["logs"] }
async-trait = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
