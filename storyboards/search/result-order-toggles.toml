# Search results can be switched between relevance and date order (#499).
#
# The defect: the results header showed a "Relevance" chip whose chevron did
# nothing, and there was no key. `toggle_result_order` is the keyboard path.
#
# Re-expressed for Focus (T265), and again for spec 010's search (#1825):
# the order is the results' Sort, and `alt+o` switches it between best
# match and newest. `O` is a letter in the field whatever is highlighted,
# so a name like O'Brien can be typed; the query is what is read back.
apps   = ["focus"]
source = { kind = "issue", ref = "#499" }
proof  = "pinned"

[[step]]
command = "search"

[[step]]
type    = "harbour"
settle  = { until = { app.focus.bar.messages = { changed = true } } }

[[step]]
key     = "Return"
check   = { keyboard.region = "results" }
expect  = "The results for the word, the Sort button reading “Best match”."

[[step]]
command = "toggle_result_order"
check   = { keyboard.region = "results" }
expect  = "alt+o switches the results to newest first: the Sort button reads “Newest”, Top hits is gone and the months run newest first."

[[step]]
command = "toggle_result_order"
check   = { keyboard.region = "results" }
expect  = "alt+o again switches them back to best match, Top hits first."

[[step]]
command = "search"
check   = { keyboard.region = "search", keyboard.typing = true }
expect  = "/ opens the dropdown over the results to edit the query."

[[step]]
type    = "O"
check   = { keyboard.region = "search", keyboard.typing = true, app.focus.bar.typed = { changed = true } }
expect  = "A capital O is typed into the query; the key is not taken from the field."
