[package]
name = "postio-dav"
description = "CalDAV for Postio: the backend sync calls, a fake for its tests, and io-webdav behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["std"] }
# Pinned exactly: new, and behind this crate's trait (plan R3, spike S2).
io-http = { version = "0.9", default-features = false }
io-webdav = { version = "=0.14.0", default-features = false, features = ["std", "rustls-ring"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
url = { workspace = true }
postio-workspace-hack.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
