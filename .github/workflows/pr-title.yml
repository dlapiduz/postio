# The PR title against CLAUDE.md's commit rules.
#
# PRs merge squashed, so the title is the subject that lands on main. The
# commit-msg hook (.githooks/commit-msg) checks each commit as it is made,
# and issue-land.sh titles the PR from the last one, but a title edited on
# GitHub, or a branch committed with the hooks off, reaches main unchecked
# without this. Its own workflow rather than a job in ci.yml: a title edit
# has to re-run it, and `edited` on ci.yml would re-run the whole suite
# every time a PR body changes.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Least-privilege default; see the note in ci.yml. #145.
permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the title as the squash subject
        # Through the environment, never interpolated into the script: a
        # title is text anyone opening a PR controls.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/commit-msg.py --title "$TITLE"
