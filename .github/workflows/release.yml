name: Release

# A release is the push that merges a release pull request (#1714): `scripts/release-prepare.sh
# X.Y.Z` bumps the version and writes docs/releases/X.Y.Z.md. This workflow runs on every push to
# `main`; the first job stops it unless `Cargo.toml` names a version with no tag yet, newer than the
# newest one. `.github/release-variants.json` lists what ships, one row per package; each kind is
# one job run per row, with an SBOM and provenance attestation. Nothing is published until
# everything is built and the full suite passed: `publish` makes a draft, attaches every asset and
# `SHA256SUMS`, checks the list against the variants file, then publishes, which creates the tag.
# `workflow_dispatch` builds every package as an artifact versioned `<version>-dev.<sha>` and
# publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-suite:
        description: "Skip the full suite (a dispatch publishes nothing either way)"
        type: boolean
        default: false

permissions:
  contents: write        # to create the release and upload the packages
  id-token: write        # to mint the Sigstore signature behind an attestation
  attestations: write    # to publish the provenance and SBOM attestations
  actions: read          # `plan` asks whether the nightly passed this commit

# Never cancel a release half-way: a cancelled `publish` leaves a draft with half its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Is this a release?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      suite: ${{ steps.plan.outputs.suite }}
      flatpaks: ${{ steps.matrices.outputs.flatpaks }}
      tarballs: ${{ steps.matrices.outputs.tarballs }}
      macos: ${{ steps.matrices.outputs.macos }}
    steps:
      # One commit is enough: `release-plan.sh` asks origin for its tags (`git ls-remote`); this
      # clone has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_SUITE: ${{ inputs.skip-suite && '--skip-suite' || '' }}
        run: |
          # shellcheck disable=SC2086  # an empty $SKIP_SUITE is no argument
          scripts/release-plan.sh $SKIP_SUITE | tee -a "$GITHUB_OUTPUT"

      - name: Read what the release ships
        id: matrices
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 scripts/release-variants.py check
          {
            echo "flatpaks=$(python3 scripts/release-variants.py matrix flatpak --version "$VERSION")"
            echo "tarballs=$(python3 scripts/release-variants.py matrix tarball --version "$VERSION")"
            echo "macos=$(python3 scripts/release-variants.py matrix macos-app --version "$VERSION")"
          } | tee -a "$GITHUB_OUTPUT"

  # The full suite, and nothing ships without it. The push that merged the release started
  # `nightly.yml` on this commit with the identical suite, so this job waits for that answer
  # (`scripts/release-await-nightly.sh`). Red stops the release. `suite` and `storyboards` below run
  # only when there is no answer (cancelled or never started), and are skipped when `plan` found a
  # green nightly.
  nightly:
    name: Full suite on main
    needs: plan
    if: >-
      github.event_name == 'push' && needs.plan.outputs.build == 'true'
      && needs.plan.outputs.suite == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    outputs:
      answer: ${{ steps.wait.outputs.answer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python
      - name: Wait for the nightly on this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-await-nightly.sh >> "$GITHUB_OUTPUT"

  # The suite here, when the nightly gave no answer, or for a dispatch. `--profile ci-full` omits
  # the stopwatch measurement and the storyboard passes (run by `storyboards`);
  # `.config/nextest.toml` says why.
  suite:
    name: Full suite
    needs: [plan, nightly]
    if: >-
      !cancelled() && needs.plan.outputs.build == 'true' && needs.plan.outputs.suite == 'run'
      && (needs.nightly.result == 'skipped' || needs.nightly.outputs.answer == 'run-here')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - uses: ./.github/actions/rust-workspace

      - name: Give the GTK suites a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      # Through the flake-retry script: a target that fails once is retried alone before it blocks,
      # and one that fails twice still blocks.
      - name: Run the release gate
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- scripts/test-with-flake-retry.sh ci-full

      - name: cargo test --doc
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- cargo test --workspace --doc

  # Focus's two storyboard passes, held out of `profile.ci-full` so they run beside the suite; same
  # condition as `suite`.
  #
  # The test binary, built once for the four shards, which restore the `build-app` cache ci.yml
  # keeps warm on `main` and save none.
  storyboards-build:
    name: Build the storyboard passes
    needs: [plan, nightly]
    if: >-
      !cancelled() && needs.plan.outputs.build == 'true' && needs.plan.outputs.suite == 'run'
      && (needs.nightly.result == 'skipped' || needs.nightly.outputs.answer == 'run-here')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - uses: ./.github/actions/rust-workspace
        with:
          cache-name: build-app

      - name: Restore mtimes from commit history
        run: scripts/restore-mtimes.py

      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      # The attachment text helper rides in the archive to the shards
      # (`profile.ci-storyboards.archive`) (#2178).
      - name: cargo build (postio-extract-helper)
        run: cargo build -p postio-session --bin postio-extract-helper

      - name: cargo nextest archive (focus_suite)
        run: >-
          cargo nextest archive -p postio-gtk --test focus_suite
          --profile ci-storyboards
          --archive-file "$RUNNER_TEMP/storyboard-tests.tar.zst"

      - name: Ship the archive to the shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storyboard-tests
          path: ${{ runner.temp }}/storyboard-tests.tar.zst
          retention-days: 1
          if-no-files-found: error

  storyboards:
    name: Storyboard passes (${{ matrix.shard }}/4)
    needs: [plan, nightly, storyboards-build]
    if: >-
      !cancelled() && needs.plan.outputs.build == 'true' && needs.plan.outputs.suite == 'run'
      && (needs.nightly.result == 'skipped' || needs.nightly.outputs.answer == 'run-here')
    runs-on: ubuntu-26.04
    # Each pass is one test that plays hundreds of windows; the tests split themselves by
    # `POSTIO_STORYBOARD_SHARD`.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - uses: ./.github/actions/rust-workspace
        with:
          build-cache: "false"

      - name: Give the GTK suites a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      - name: Fetch the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storyboard-tests
          path: ${{ runner.temp }}

      - name: cargo nextest run --profile ci-storyboards
        env:
          POSTIO_TEST_PATIENCE: "3"
          POSTIO_STORYBOARD_SHARD: ${{ matrix.shard }}/4
        run: >-
          dbus-run-session -- scripts/test-with-flake-retry.sh ci-storyboards ""
          --archive-file "$RUNNER_TEMP/storyboard-tests.tar.zst"
          --workspace-remap "$GITHUB_WORKSPACE"

  # One job per Flatpak row of the variants file; it builds the checkout as it is, since the release
  # PR already holds the version.
  flatpak:
    name: Flatpak (${{ matrix.variant.id }})
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.flatpaks != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.flatpaks || '[]') }}
    env:
      MANIFEST: ${{ matrix.variant.manifest }}
      APP_ID: ${{ matrix.variant.app_id }}
      ASSET: ${{ matrix.variant.asset }}
      SBOM: ${{ matrix.variant.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # A --release Flatpak build needs the runtime and SDK on top of a build that already exhausted
      # a runner's disk; reclaim unused toolchains first.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Give flatpak a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # The runtime and SDK come from the manifest. The SDK extensions do not: `rust-stable` follows
      # freedesktop's branches, not GNOME's, so `flatpak-builder --install-deps-from` below installs
      # what is required.
      - name: Install the runtime the manifest asks for
        run: |
          RUNTIME=$(jq -r '.runtime + "//" + (."runtime-version"|tostring)' "$MANIFEST")
          SDK=$(jq -r '.sdk + "//" + (."runtime-version"|tostring)' "$MANIFEST")
          echo "runtime: $RUNTIME"
          echo "sdk:     $SDK"
          flatpak install --user -y flathub "$RUNTIME" "$SDK"

      # Flatpak builds offline, so crates are pinned by checksum. Generated, not committed: a stale
      # copy would build something other than Cargo.lock.
      - name: Generate the offline cargo sources
        run: |
          pip install --quiet aiohttp PyYAML tomlkit
          python3 flatpak/flatpak-cargo-generator.py Cargo.lock \
            -o flatpak/cargo-sources.json
          echo "$(jq length flatpak/cargo-sources.json) crate sources pinned"

      - name: Cache flatpak-builder state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: ${{ runner.os }}-flatpak-${{ matrix.variant.app_id }}-${{ hashFiles('Cargo.lock', matrix.variant.manifest) }}
          restore-keys: ${{ runner.os }}-flatpak-${{ matrix.variant.app_id }}-

      # The manifest builds from a copy with no .git, so the commit (app.rs's COMMIT) is passed in
      # the environment, after the cache key is read.
      - name: Stamp the commit
        run: |
          jq --arg commit "$(git rev-parse --short=9 HEAD)" \
            '."build-options".env.POSTIO_COMMIT = $commit' \
            "$MANIFEST" > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" "$MANIFEST"

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub \
            --repo=repo build-dir "$MANIFEST"

      # Each bundle carries what its manifest installs; a manifest that stops installing one still
      # builds, so look inside.
      # `packaging.rs` in postio-gtk's tests holds these lists to the manifests.
      - name: Check the build carries the app
        run: |
          case "$APP_ID" in
            dev.postio.Postio)
              paths="
                files/bin/postio
                files/bin/postio-mcp
                files/share/applications/dev.postio.Postio.desktop
                files/share/metainfo/dev.postio.Postio.metainfo.xml
              " ;;
            dev.postio.PostioTui)
              paths="
                files/bin/postio-tui
                files/bin/postio-mcp
              " ;;
            *)
              echo "::error::no list of what $APP_ID carries"; exit 1 ;;
          esac
          for path in $paths; do
            test -e "build-dir/$path" || { echo "::error::the build has no $path"; exit 1; }
          done

      - name: Bundle
        run: |
          flatpak build-bundle repo "$ASSET" "$APP_ID" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          ls -lh "$ASSET"

      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      # A signed SLSA provenance statement tying the package to this repository, commit and
      # workflow, and the SBOM to the package.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.variant.asset }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}
          if-no-files-found: error

  # One job per tarball row: a binary for a machine without Flatpak, with its README.
  tarball:
    name: Tarball (${{ matrix.variant.id }})
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.tarballs != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.tarballs || '[]') }}
    env:
      ASSET: ${{ matrix.variant.asset }}
      SBOM: ${{ matrix.variant.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-workspace

      - name: Build
        env:
          PROFILE: ${{ matrix.variant.profile }}
          PACKAGE: ${{ matrix.variant.package }}
          BIN: ${{ matrix.variant.bin }}
        run: cargo build --profile "$PROFILE" -p "$PACKAGE" --bin "$BIN"

      # Binaries shipped beside it (`also` in the variants file), each under its own profile: the
      # helper under `release`, which unwinds, where `release-tui` aborts (#1824).
      - name: Build what ships beside it
        env:
          ALSO: ${{ toJSON(matrix.variant.also) }}
        run: |
          jq -r '(. // [])[] | "\(.profile) \(.package) \(.bin)"' <<<"$ALSO" |
            while read -r profile package bin; do
              cargo build --profile "$profile" -p "$package" --bin "$bin"
            done

      - name: Package
        env:
          PROFILE: ${{ matrix.variant.profile }}
          BIN: ${{ matrix.variant.bin }}
          README: ${{ matrix.variant.readme }}
          ALSO: ${{ toJSON(matrix.variant.also) }}
        run: |
          DIR="${ASSET%.tar.zst}"
          mkdir -p "$DIR"
          install -m755 "target/${PROFILE}/${BIN}" "$DIR/"
          jq -r '(. // [])[] | "\(.profile) \(.bin)"' <<<"$ALSO" |
            while read -r profile bin; do
              install -m755 "target/${profile}/${bin}" "$DIR/"
            done
          cp "$README" "$DIR/README.md"
          tar --zstd -cf "$ASSET" "$DIR"
          ls -lh "$ASSET"

      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.variant.asset }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}
          if-no-files-found: error

  # The macOS app, zipped. Ad-hoc signed and not notarized (ADR 0019 Q8): Gatekeeper refuses a
  # double click, so open it once with right-click -> Open. Apple Silicon only.
  macos:
    name: macOS (${{ matrix.variant.id }})
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.macos != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.macos || '[]') }}
    env:
      ASSET: ${{ matrix.variant.asset }}
      SBOM: ${{ matrix.variant.sbom }}
      APP: macos/build/${{ matrix.variant.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      # A release build of `postio-ffi`, so not CI's debug `macos-ffi` cache.
      - name: Restore the build cache
        uses: ./.github/actions/build-cache
        with:
          name: macos-release

      - name: Build
        run: scripts/macos-build.sh --release

      - name: Assemble the app
        run: scripts/macos-bundle.sh --release

      # `ditto`, not `zip`: it keeps the extended attributes and the ad-hoc signature.
      - name: Zip
        run: |
          ditto -c -k --keepParent "$APP" "$ASSET"
          ls -lh "$ASSET"

      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.variant.asset }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}
          if-no-files-found: error

      # Keep the ~470 dependencies, drop the workspace's crates, which rebuild each release: saved
      # whole it was 2.5 GB and evicted first.
      - name: Drop workspace artifacts before caching
        if: ${{ !cancelled() }}
        run: scripts/ci-drop-workspace-artifacts.sh

      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # One draft, every asset, the checksums, and a check against the variants file; then publish
  # creates the tag at the built commit.
  # Anything short of that leaves a draft and no tag, so re-running the failed jobs finishes it.
  # The gates are needed here, not by the packages, so packages build beside them. A skipped gate
  # passed elsewhere: `plan` or `nightly` found it green.
  publish:
    name: Publish
    needs: [plan, nightly, suite, storyboards-build, storyboards, flatpak, tarball, macos]
    if: >-
      always() && needs.plan.outputs.publish == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.nightly.result)
      && contains(fromJSON('["success", "skipped"]'), needs['storyboards-build'].result)
      && contains(fromJSON('["success", "skipped"]'), needs.suite.result)
      && contains(fromJSON('["success", "skipped"]'), needs.storyboards.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.flatpak.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.tarball.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.macos.result)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      # Full history: drafting notes reads the commits since the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      # Every artifact of the run lands here, including the storyboard shards' test binaries, which
      # are not packages.
      - name: Check every package is here
        run: |
          rm -f assets/storyboard-tests.tar.zst
          missing=0
          for asset in $(python3 scripts/release-variants.py assets --version "$VERSION"); do
            if [ -f "assets/$asset" ]; then
              echo "  have $asset"
            else
              echo "::error::missing $asset"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Notes
        run: |
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -s "$NOTES" ]; then
            # shellcheck source=scripts/lib/release.sh
            source scripts/lib/release.sh
            release_draft_notes "$(release_newest_tag)" > "$NOTES"
            [ -s "$NOTES" ] || echo "- Maintenance release" > "$NOTES"
          fi
          cp "$NOTES" release-notes.md
          cat release-notes.md

      # A 0.x is a pre-release on the release page too, and marks the AppStream entry
      # `type="development"`. A re-run fills its own draft again. An already-published release is
      # refused even though `plan` should never get here (it once could not see the tags): the step
      # that writes, with `--clobber`, must not trust its inputs.
      - name: Draft, attach, publish
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error::$TAG is already published. Refusing to change it."
            exit 1
          fi
          if [ "$draft" = none ]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file release-notes.md "${flags[@]}"
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false
          echo "published $(gh release view "$TAG" --json url --jq .url)"

  # The terminal binaries are under half the desktop ones, and the terminal Flatpak with its runtime
  # under two-thirds (docs/archive/specs/005-tui-frontend SC-004).
  # Beside `publish`: a size is a reason the next release must shrink, not to withhold this one.
  # The binaries comparison follows shared libraries with `ldd`, so it needs the desktop binary
  # built here against host GTK.
  package-sizes:
    name: Terminal packages are small enough (SC-004)
    needs: [plan, flatpak, tarball]
    if: always() && needs.flatpak.result == 'success' && needs.tarball.result == 'success'
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - uses: ./.github/actions/rust-workspace

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Is the terminal binary under half the desktop one?
        run: |
          cargo build --release -p postio-gtk --bin postio \
            -p postio-session --bin postio-extract-helper
          tar --zstd -xf "assets/postio-tui-${VERSION}-linux-x86_64.tar.zst"
          scripts/measure-package-size.sh binaries \
            "postio-tui-${VERSION}-linux-x86_64/postio-tui" \
            "postio-tui-${VERSION}-linux-x86_64/postio-extract-helper" \
            -- target/release/postio target/release/postio-extract-helper

      - name: Install both Flatpaks and their runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          for bundle in "assets/postio-${VERSION}-linux-x86_64.flatpak" \
                        "assets/postio-tui-${VERSION}-linux-x86_64.flatpak"; do
            flatpak install --user -y --noninteractive "$bundle"
          done

      - name: Is the terminal Flatpak under two-thirds of the desktop one?
        run: scripts/measure-package-size.sh flatpak dev.postio.PostioTui dev.postio.Postio
