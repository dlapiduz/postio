[package]
name = "postio-test-support"
description = "One deadline, one backoff, one timeout message: the wait primitive every suite in this workspace shares."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# `time` only: `settle_until_async` backs off with `tokio::time::sleep`, since a thread sleep parks
# a runtime worker.
tokio = { workspace = true, features = ["time"] }
tracing-subscriber = { workspace = true, optional = true }
png = { version = "0.18", optional = true }
postio-workspace-hack.workspace = true

[features]
logs = ["dep:tracing-subscriber"]
fidelity = ["dep:png"]

[lints]
workspace = true
