# `g s` (go_to_flagged) opens the Flagged list with its flagged mail.
#
# Found while filming #813: the sidebar's own count says Flagged has 9, and
# walking there with j lists 9 rows, but the go_to_flagged chord shows
# "Flagged is empty" with 0 rows. Open until the chord and the sidebar row
# load the same list.
source = { kind = "spec", ref = "specs/008-storyboards" }
proof  = "open"

[[step]]
command = "go_to_flagged"
settle  = { until = { rows.count = 9 } }
check   = { rows.count = 9 }
expect  = "The Flagged list shows the nine flagged conversations the sidebar counts."
