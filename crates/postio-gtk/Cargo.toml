[package]
name = "postio-gtk"
description = "GTK4/libadwaita frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The crate is `postio-gtk`; what lands on PATH — and what the desktop
# entry's `Exec` names — is `postio`.
[[bin]]
name = "postio"
path = "src/main.rs"

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_7"] }
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
gio = "0.21.5"
glib = { version = "0.21.5", features = ["v2_72"] }
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_20"] }
pango = { version = "0.21.5", features = ["v1_56"] }
pangocairo = "0.21.5"
postio-config.workspace = true
postio-core.workspace = true
postio-model.workspace = true
postio-search.workspace = true
thiserror = "2.0.20"

[dev-dependencies]
postio-config.workspace = true
tempfile = "3.27.0"

[build-dependencies]
glib-build-tools = "0.21.0"
