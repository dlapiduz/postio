name: Rust workspace
description: >
  System dependencies, the pinned toolchain, and the build caches used by the
  clippy and test jobs -- one cache each, because they do not build the same
  thing (see `cache-name`).

  Factored out when those three stopped being one job (#818). Three copies of
  forty lines is three chances to drift, and the copy that drifts is the cache
  key -- at which point the jobs stop sharing anything and each pays for a
  cold build of GTK and WebKit.

inputs:
  cache-name:
    description: >
      Which cache this job reads and writes. It exists because `cargo clippy`
      and `cargo test` cannot share artifacts, and for a while this action
      pretended they could.

      Clippy compiles through `clippy-driver` and emits *check* units;
      `cargo test` emits *build* units. Cargo fingerprints them separately, so
      a `target/` full of one is worth nothing to the other. Measured on run
      33828724926, where both jobs restored the same 3.1 GB cache on an exact
      key hit:

          Tests   21 units rebuilt   <- reused the cache almost perfectly
          Clippy  380 units rebuilt  <- rebuilt the graph from unicode-ident up

      That was ~7 minutes of runner on every pull request, and it read as
      "the cache is cold" when the cache was fine and simply the wrong shape.
      One cache per kind of build fixes it.

      Every job restores its cache; the ones that build it end with
      `.github/actions/build-cache-save`, which writes it back from `main`.
    required: false
    default: "build"

runs:
  using: composite
  steps:
    # `mold` is the odd one out: not a system library the workspace links
    # against, but the linker `scripts/linker.sh` prefers. Installed here so
    # the runner takes the same path a developer's box does rather than the
    # script's fallback, which shells out to `rustc --print sysroot` on every
    # single link -- 141 test binaries in the test job alone.
    #
    # It is not installed for speed. Measured on the largest binary here, mold
    # and rust-lld are within noise of each other (docs/archive/engineering-notes.md);
    # what mold gives is ~265 MB lower peak RSS per link, and this job has
    # already had a debug build exhaust a runner and kill lld mid-link.
    #
    # Ubuntu equivalents of the Fedora packages in README.md:
    #   gtk4-devel        -> libgtk-4-dev
    #   libadwaita-devel  -> libadwaita-1-dev
    #   webkitgtk6.0-devel-> libwebkitgtk-6.0-dev
    #   sqlite-devel      -> libsqlite3-dev
    #   libsecret-devel   -> libsecret-1-dev
    #   glib2-devel       -> libglib2.0-dev
    #
    # # The packages come from a cache, not the mirror
    #
    # These pull in about two hundred packages, and the runner fetched every
    # one from azure.archive.ubuntu.com on every job. That mirror is often
    # slow: in the 30 CI runs before 2026-10-22, 18 had a job spend more than
    # 10 minutes here -- up to 40 -- on a step that is otherwise under one,
    # and those runs took 40.5 minutes against 14.9 for the rest. One
    # `libwebkitgtk-6.0-4` download took 8 minutes alone.
    #
    # So the downloaded `.deb`s are cached and handed to apt as its archive
    # directory: it still resolves against a fresh index, so a package Ubuntu
    # has since updated is fetched, and only that one. The key ends in a hash
    # of the archive's file names -- the package versions -- so `main` writes
    # a new cache only when a version moved, never on every run, and a pull
    # request restores `main`'s (`.github/actions/build-cache` says why only
    # `main` writes). `autoclean` drops a superseded version before the save,
    # so the cache does not grow.
    #
    # # Or they are already there
    #
    # The CI and nightly jobs run inside `.github/ci-image/Dockerfile`, which
    # installs these when it is built, and this whole half is skipped there.
    # It stays for the jobs on a bare runner (`release.yml`). The two lists
    # must agree: change one, change the other.
    - name: Name the system packages
      id: apt
      shell: bash
      run: |
        if [ -n "${POSTIO_CI_IMAGE:-}" ]; then
          echo "image=true" >> "$GITHUB_OUTPUT"
          echo "in the CI image: the system packages are part of it"
          exit 0
        fi
        packages="build-essential pkg-config libgtk-4-dev libadwaita-1-dev
          libwebkitgtk-6.0-dev libsqlite3-dev libsecret-1-dev libglib2.0-dev
          libpango1.0-dev mutter dbus-daemon mold"
        packages=$(echo $packages)
        echo "APT_PACKAGES=$packages" >> "$GITHUB_ENV"
        . /etc/os-release
        echo "prefix=apt-$ID-$VERSION_ID-$(echo "$packages" | sha256sum | cut -c1-12)-" >> "$GITHUB_OUTPUT"

    - name: Restore the downloaded system packages
      id: apt-restore
      if: steps.apt.outputs.image != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.apt.outputs.prefix }}restore
        restore-keys: ${{ steps.apt.outputs.prefix }}

    - name: Install system dependencies
      id: apt-install
      if: steps.apt.outputs.image != 'true'
      shell: bash
      run: |
        # The runner image ships apt sources this workspace never installs
        # from -- Google Chrome, Microsoft, and whatever else the image adds
        # -- and `apt-get update` exits 100 when *any* of them has a bad
        # index, even though it says itself that it ignored them and used
        # the old ones. Two green jobs died in fifteen seconds on a CDN's
        # hash-sum mismatch that way (#1420). Everything below comes from
        # the Ubuntu archive, so only the Ubuntu sources are kept, and a
        # stale Ubuntu index still fails loudly rather than quietly.
        sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -print -delete
        sudo apt-get update
        archives="$HOME/apt-archives"
        mkdir -p "$archives/partial"
        # apt downloads as `_apt`; a partial directory it cannot write makes
        # it fall back to root with a warning on every job.
        sudo chown _apt "$archives/partial"
        echo "restored $(ls "$archives" | grep -c '\.deb$' || true) packages from the cache"
        # shellcheck disable=SC2086 # the list is words on purpose
        sudo apt-get install --no-install-recommends -y \
          -o Dir::Cache::Archives="$archives" $APT_PACKAGES
        sudo apt-get autoclean -o Dir::Cache::Archives="$archives"
        versions=$(cd "$archives" && { ls -- *.deb 2>/dev/null || true; } | sort | sha256sum | cut -c1-12)
        echo "key=${{ steps.apt.outputs.prefix }}$versions" >> "$GITHUB_OUTPUT"

    - name: Save the downloaded system packages
      if: >-
        steps.apt.outputs.image != 'true'
        && github.ref == 'refs/heads/main'
        && steps.apt-install.outputs.key != steps.apt-restore.outputs.cache-matched-key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.apt-install.outputs.key }}

    # Ask the runner how big it is rather than hardcoding a number.
    #
    # `ci.yml` used to say `CARGO_BUILD_JOBS: 4`, chosen when a public repo's
    # standard runner had four vCPUs. That is a number that goes stale in
    # silence: on a larger runner it leaves cores idle, and on a smaller one it
    # oversubscribes. Neither shows up as a failure, only as a slower job.
    #
    # It matters more since the test job moved to nextest, which runs one
    # process per test and scales its own concurrency with the core count --
    # so the runner's width now sets how fast the *tests* go, not just the
    # compile.
    #
    # Printed, not just set: this is the only place the number is visible, and
    # "how many cores does CI have" turned out to be unanswerable from the
    # logs when it was asked.
    - name: Match cargo's parallelism to the runner
      shell: bash
      run: |
        cores=$(nproc)
        echo "runner has $cores cores, $(free -g | awk '/^Mem:/{print $2}') GB RAM"
        echo "CARGO_BUILD_JOBS=$cores" >> "$GITHUB_ENV"

    # The pin decides; see the note in the `fmt` job.
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup show active-toolchain
        rustc --version && cargo clippy --version

    # `.cargo/config.toml` names `postio-linker` and `postio-cc` rather than
    # paths, so sccache and copied target dirs work across worktrees on the
    # development box (#1101). The names have to resolve here too.
    - name: Install the linker and cc shims
      shell: bash
      run: scripts/install-shims.sh

    # Restored here; written back by `.github/actions/build-cache-save` at the
    # end of the job, from `main` only (#1710). The key, the fallback and why a
    # pull request never writes are that action's description.
    - name: Restore the build cache
      uses: ./.github/actions/build-cache
      with:
        name: ${{ inputs.cache-name }}
