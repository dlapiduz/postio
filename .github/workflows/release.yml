name: Release

# Deliberately not part of CI. A Flatpak build compiles the whole workspace
# --release inside a sandbox against a ~3 GB runtime it has to download first,
# which is minutes of runner time that says nothing new about a commit. It runs
# when a version is tagged, and on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # to create the release and upload the bundle
  id-token: write        # to mint the Sigstore signature behind an attestation
  attestations: write    # to publish the provenance and SBOM attestations

env:
  APP_ID: dev.postio.Postio
  MANIFEST: flatpak/dev.postio.Postio.json

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A cold debug build already ran a runner out of disk once and killed lld
      # with SIGBUS mid-link. This build is --release and additionally needs the
      # GNOME runtime and SDK, so reclaim the preinstalled toolchains nothing
      # here uses before starting rather than diagnosing it again.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # Pinned to what the manifest declares. Reading them from the manifest
      # rather than repeating the versions keeps this from drifting out of step
      # with it -- a second copy of a version number is a second thing to forget.
      # The runtime and SDK branch with `runtime-version`, so those are named
      # here. The SDK *extensions* do not: `rust-stable` is a freedesktop
      # extension and its branches follow freedesktop's versions, not GNOME's,
      # so asking flathub for `org.freedesktop.Sdk.Extension.rust-stable//50`
      # -- the manifest's GNOME runtime version -- resolves to nothing:
      #
      #   error: Nothing matches org.freedesktop.Sdk.Extension.rust-stable
      #          in remote flathub
      #
      # and the bare-name fallback beneath it fails for the same reason, a
      # ref with no branch being no more resolvable than a wrong one.
      #
      # So the extensions are left to `flatpak-builder --install-deps-from`
      # below, which reads the manifest it is about to build and installs what
      # that manifest actually requires. Guessing a branch from a version that
      # does not govern it is what broke; the tool that parses the manifest
      # does not have to guess.
      - name: Install the runtime the manifest asks for
        run: |
          RUNTIME=$(jq -r '.runtime + "//" + (."runtime-version"|tostring)' "$MANIFEST")
          SDK=$(jq -r '.sdk + "//" + (."runtime-version"|tostring)' "$MANIFEST")
          echo "runtime: $RUNTIME"
          echo "sdk:     $SDK"
          flatpak install --user -y flathub "$RUNTIME" "$SDK"

      # Flatpak builds offline, so every crate is pinned by checksum up front.
      # Generated rather than committed: a stale copy is worse than none, since
      # it would silently build something other than what Cargo.lock resolves.
      - name: Generate the offline cargo sources
        run: |
          pip install --quiet aiohttp PyYAML tomlkit
          python3 flatpak/flatpak-cargo-generator.py Cargo.lock \
            -o flatpak/cargo-sources.json
          echo "$(jq length flatpak/cargo-sources.json) crate sources pinned"

      - name: Cache flatpak-builder state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .flatpak-builder
          key: ${{ runner.os }}-flatpak-${{ hashFiles('Cargo.lock', 'flatpak/dev.postio.Postio.json') }}
          restore-keys: ${{ runner.os }}-flatpak-

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub \
            --repo=repo build-dir "$MANIFEST"

      - name: Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="$(git rev-parse --short HEAD)"
          BUNDLE="postio-${VERSION}-x86_64.flatpak"
          flatpak build-bundle repo "$BUNDLE" "$APP_ID" --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          ls -lh "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "SBOM=postio-${VERSION}.spdx.json" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flatpak-bundle
          path: ${{ env.BUNDLE }}

      # What actually went into this build: 405 crates in Cargo.lock plus the
      # Flatpak runtime, from the same Cargo.lock flatpak-cargo-generator read
      # to produce the offline sources above. Answerable after the fact
      # rather than reconstructed from a tag. #97 adds cargo-deny -- "what is
      # in the graph" -- this is "what did we actually ship".
      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attach to the release
        if: github.ref_type == 'tag'
        run: gh release upload "$GITHUB_REF_NAME" "$BUNDLE" "$SBOM" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # A signed SLSA provenance statement tying the bundle to this
      # repository, commit, workflow and runner. Before this, the only
      # evidence a downloaded bundle came from this workflow was that it
      # appeared on a release page -- exactly the evidence an attacker with a
      # token also has. Verify with:
      #   gh attestation verify postio-VERSION-x86_64.flatpak --repo dlapiduz/postio
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.BUNDLE }}

      # Ties the SBOM to the exact bundle it describes, the same way the
      # provenance attestation ties the bundle to the workflow that built it.
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.BUNDLE }}
          sbom-path: ${{ env.SBOM }}
