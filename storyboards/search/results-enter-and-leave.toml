# ⌘↩ in the dropdown turns the main window into the results view, a mode
# of the main window and not a window of its own (specs/010-focus-search
# US2, FR-020, D17, design §3 and screens 06 and 07): ‹ Inbox with its Esc
# keycap, the query as chips and words, the filter bar with the three
# tabs and their counts, the timeline, then Top hits and the month groups.
# Esc with nothing open and nothing selected leaves it, and the inbox is
# back on the row and the selection it had (US2 scenario 4).
#
# The rows are threads (specs/013-focus-threads US6): a thread with several
# matches says "N of M messages match" in place of its passage, and the top
# one opens expanded on arrival, its matching messages as child rows and
# every run of the others as one line, so `j` walks into its messages
# before it reaches the second result. A reply that matches only by
# quoting another message of the thread is one of the K, a child tagged
# "quoted" (#2184), so the children and the lines agree with the count.
apps   = ["macos", "focus"]
source = { kind = "spec", ref = "specs/010-focus-search US2" }
seed   = "search"
design = "06-results"

[[step]]
wait    = { until = { cursor.index = 0 } }

[[step]]
command = "next_message"

[[step]]
id      = "row"
command = "toggle_selection"
check   = { cursor.index = 1 }

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search" }

[[step]]
type    = "atlas budget"
check   = { overlay.kind = "finder", keyboard.region = "search" }

[[step]]
command = "show_all_results"
check   = { overlay.kind = "none", keyboard.region = "results" }
expect  = "The dropdown is gone and the main window is the results view: ‹ Inbox with an Esc keycap, the field holding “atlas budget” with “/ to edit” on its right, and Save search ⌘S. The filter bar has Threads, Files and People with their counts, Threads selected, the filter buttons in outline, and Sort “Best match”. The timeline says “N threads”, N the dropdown's Show all count, over “F files · P people · last 12 months” with the tabs' counts, beside twelve bars. Top hits come first, each with its reason under the sender (such as “you replied · 3 matches” or “you flagged”), then “June 2026” with its count and the other months, newest first. A row with one match has a source tag and a passage with “atlas” and “budget” in the find yellow; a thread with several says “K of M messages match” instead. The first top hit is expanded under its row: each of the K matching messages a child row tagged “message n” with its passage (“message n · quoted” for a reply whose only match is its quote of another), and every message it does not show in a line such as “Messages 2–4 don't match · Ben, 16 Mar”, dated as the rows date mail, before the first match, between two and after the last: K children, and lines for the other M − K. The footer reads “N threads · local index · … ms”, the same N. The first row has the focus ring."

[[step]]
command = "next_message"
check   = { keyboard.region = "results" }
expect  = "j moves the focus ring into the expanded top hit, onto its first matching message, past any line before it; the inbox behind is not touched."

[[step]]
command = "back"
check   = { overlay.kind = "none", keyboard.region = "list", cursor.index = { same_as = "row" }, selection.count = { same_as = "row" } }
expect  = "Esc leaves the results: the inbox is back with the keyboard on the row it had and that row still selected."

# The tab's word, which only Postio publishes (#2118: Threads, never
# Conversations).
[app.focus.step.6]
check = { overlay.kind = "none", keyboard.region = "results", app.focus.results.tab = "Threads" }
