# The Date popover takes a date in plain words and says what it became,
# offers its presets with counts, and previews like the others
# (specs/010-focus-search US3, FR-027, design §3.6, screen 09).
#
# "since july" in its field shows "→ after:2026-07-01" beside it, the
# results narrow while it is open, This quarter is the preset ringed (it
# is the same date), and the line under the chart says how many of the
# conversations it opened on are kept, and the months. Return applies it;
# the Date button reads "Since July".
#
# Date opens by its key, as its button shows it (#2090). The controller's half is postio-focus tests/controller_suite/results.rs
# (the_date_popover_turns_words_into_dates_and_its_presets_carry_counts).
apps   = ["macos", "focus"]
source = { kind = "spec", ref = "specs/010-focus-search US3" }
seed   = "search"
design = "09-filter-date"

[[step]]
wait    = { until = { cursor.index = 0 } }

[[step]]
command = "search"

[[step]]
type    = "atlas budget"

[[step]]
command = "show_all_results"
check   = { keyboard.region = "results" }

[[step]]
id      = "open-date"
command = "filter_date"
expect  = "Date's key, shown on its button, opens its popover, 470 wide in two columns: on the left the presets with their counts (Any time, Last 7 days, Last 30 days, This quarter, This year, Custom…); on the right a field, a 90-tall month chart and the result line."

[[step]]
type    = "since july"
expect  = "The field says “since july” with “→ after:” the last first of July beside it (2025-07-01 under the runner's clock). The list behind narrows to July onwards while the popover is open; the chart's bars from July are dark and bold-labelled; the line under it reads the months kept and the conversations kept “of” those it opened on."

[[step]]
key     = "Return"
check   = { keyboard.region = "results", overlay.kind = "none" }
expect  = "Return applies it: an “after:” chip in the field, the Date button solid and reading “Since July” and its year, the timeline's band from July."
