[package]
name = "postio-account"
description = "The account crate: the MailBackend seam, discovery, the keyring, and (behind the imap feature) an IMAP backend built on Pimalaya io-imap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["imap"]

# The io-imap-backed implementation, on by default. Off leaves the MailBackend seam, mock,
# autoconfig discovery and keyring, which keeps a pre-1.0 protocol crate out of everything above
# this one (ADR 0001).
imap = [
    "dep:io-imap",
    "dep:io-sasl",
    "dep:postio-transport",
]

# Off by default: a build that never opens a maildir should not carry `io-maildir` (#1278).
maildir = ["dep:io-maildir"]

# Test-only: seeds `MockMailbox::corpus` from the shared `.eml` fixtures; the self dev-dependency
# enables it.
test-corpus = ["postio-model/test-corpus"]

# Test-only in-process IMAP server, so a shipped build has no listening socket. Implies
# `test-corpus` but not `imap`:
# it is written against the wire, so a bug in the protocol crate cannot hide inside what catches it.
test-server = ["test-corpus"]

[dependencies]
# io-pim-discovery's `with_factory` is typed `anyhow::Result<S>`, so supplying our own stream names
# the type (discovery/transport.rs, #57).
anyhow = "1.0.104"
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde", "std"] }
# io-http's coroutines for the token POST and metadata GET, since `io-pim-discovery` has no
# POST-capable one (ADR 0006 Q3).
# `default-features = false`: its `rustls-ring` feature already turns on `io-http/client`.
io-http = { version = "0.8", default-features = false }
io-imap = { version = "0.11.2", default-features = false, features = ["client"], optional = true }
# The OAuth 2.0 wire core (#537). `client` is only the random generators; HTTP stays on this crate's
# cancellable transport, because io-oauth's client wrapper consumes the status the
# 200-with-error-body shim in `exchange.rs` needs. The DNS wire format for the MX query (#94):
# `io-pim-discovery` publishes no MX lookup of its own.
domain = { version = "0.12", default-features = false, features = ["alloc", "std", "unstable-new"] }
io-oauth = { version = "0.7", default-features = false, features = ["client"] }
io-pim-discovery = { version = "0.13", default-features = false, features = ["autoconfig", "rfc6186", "rfc6764", "rfc8414", "rustls-ring"] }
io-sasl = { workspace = true, optional = true }
oo7 = "0.7.1"

pimalaya-stream = { workspace = true }
postio-config.workspace = true
postio-model.workspace = true
postio-transport = { workspace = true, optional = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
io-maildir = { version = "0.5.0", default-features = false, features = ["client", "parser"], optional = true }
postio-workspace-hack.workspace = true


# build.rs compiles `providers_toml.rs` a second time (`#[path]`), so it needs everything that
# module needs.
[build-dependencies]
postio-config.workspace = true
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# For the commands `postio-account` does not wrap yet (QRESYNC SELECT, ENABLE, STORE, COPY, APPEND),
# driven by `tests/imap_loopback.rs`.
io-imap = { version = "0.11.2", default-features = false, features = ["client"] }
postio-account = { path = ".", features = ["maildir", "test-corpus", "test-server"] }
postio-model = { path = "../postio-model", features = ["test-corpus"] }
postio-test-support.workspace = true
serde-xml-rs = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

# Platform sections stay at the foot: a TOML table runs to the next header, so a mid-list one makes
# everything below it conditional (`check-target-sections-last.py`, #642).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[lints.rust]
unsafe_code = "deny"

# A crate with its own `[lints.rust]` inherits no workspace lints, so the clippy floor's
# `let_underscore_future` rule is restated.
[lints.clippy]
let_underscore_future = "deny"

[lints.cargo]
unused_dependencies = "allow"
