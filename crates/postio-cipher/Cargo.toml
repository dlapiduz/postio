[package]
name = "postio-cipher"
description = "A SQLCipher crypto provider written in Rust, in place of OpenSSL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# AES-256-CBC, no padding: SQLCipher hands whole pages, always a multiple of
# the block size, and does its own framing.
aes = "0.8.4"
cbc = "0.1.2"
# PBKDF2-HMAC-SHA512 for the key derivation, HMAC-SHA512 for the page MAC.
# Both are SQLCipher 4's defaults; the SHA-1 and SHA-256 arms exist because
# the vtable has to answer for a store written under an older `PRAGMA`.
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
# The provider's `random`, which SQLCipher uses for salts and page IVs. The
# OS entropy pool with no generator in front of it, the same choice ADR 0014
# made for the store key itself.
getrandom = "0.2.17"
# A derived key is key material and must not outlive its buffer.
zeroize = "1.9.0"

[features]
# Build `sha2` against its assembly backend, to measure whether it closes the
# gap `examples/hmac_backends.rs` reports. Off by default because it wants a
# C toolchain at build time, which is half of what this crate exists to avoid.
sha2-asm = ["sha2/asm"]

[dev-dependencies]
# Already in this workspace's graph, pulled in by rustls for every TLS path
# Postio has. It embeds BoringSSL's assembly, which is where its SHA-256
# differs from `sha2`'s.
ring = "0.17.14"
# Pure-Rust candidates for `examples/page_schemes.rs`. The first two are
# already in this workspace's graph — `chacha20poly1305` seals every blob
# (ADR 0017) and `blake3` names them — so only `aes-gcm` is new, and only to
# be measured.
chacha20poly1305 = "0.11.0"
blake3 = "1.8.7"
aes-gcm = "0.11"

# Only to force SQLCipher's own provider into the process so the two can be
# compared. The features must match `postio-storage`'s or cargo links two
# different SQLCiphers and the comparison is meaningless.
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = "3.27.0"

[lints.rust]
# `deny` rather than the workspace's `forbid`, and the difference is the
# whole discipline: every `unsafe` in this crate still needs an explicit
# `#[allow(unsafe_code)]` and a `# Safety` or `SAFETY:` beside it. What this
# crate cannot do is inherit `forbid`, because handing C a table of function
# pointers is what it is for. See EXCEPTIONS in check-lint-floor.py.
unsafe_code = "deny"
