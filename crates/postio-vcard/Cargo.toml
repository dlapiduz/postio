[package]
name = "postio-vcard"
description = "vCard import and export: the mapping between cards and Postio's contacts, over Pimalaya's parser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
postio-model = { workspace = true }
postio-workspace-hack.workspace = true
# Pinned exactly: the parser is young and reads files a stranger handed the user, so a bump re-runs
# the round-trip corpus (specs/005-contacts R9).
vcard-rs = { version = "=0.6.0", default-features = false, features = ["parser", "quoted-printable", "base64", "encoding"] }

[lints]
workspace = true

# The library is named `vcard`, so cargo-machete does not see `vcard_rs` used.
[package.metadata.cargo-machete]
ignored = ["vcard-rs"]
