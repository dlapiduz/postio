name: Nightly

# The work that is worth doing daily and not worth doing on the merge path.
#
# The test each job here had to pass: **is anyone blocked on learning this
# within the hour?** If the answer is no, it costs every contributor on every
# push to ask it, and the timer is where it belongs.
#
# Coverage drift is a trend, not a per-commit fact: a floor breached at 09:00
# is just as breached at 23:00, and nothing about the next pull request
# depends on learning it within seventeen minutes. It cost ~5 minutes of every
# push (and 10.8 in its worst measured run) to answer a question nobody was
# blocked on -- #818.
#
# It is also the noisiest job in the workspace, which is an argument for
# keeping it off the merge path rather than for running it more often: #710's
# SQLCipher key flake and the stale-target-cache bug that made the numbers
# meaningless both surfaced here, and both would have failed pull requests
# that had nothing to do with either.
#
# `doc` is here for a different reason and passes the test less comfortably,
# which is worth being honest about (#833). A broken intra-doc link IS a
# per-commit fact, and the pull request that introduced it is the cheapest
# place to fix it -- cheaper than a nightly failure someone bisects back to
# yesterday. What decided it was measuring the actual loss: clippy already
# denies `missing_docs` on every pull request (it runs rustc's lints, and
# `-D warnings` promotes it), so the only thing that moved here is broken
# link detection, which rustdoc alone catches. 23m35s off every pull request
# -- it was the longest job by nearly double -- against link rot found a few
# hours later.
#
# `workflow_dispatch` for when you have just written tests and want the number
# now, or have just rewritten a module's docs and would rather not find the
# broken links in the morning. That is the case the per-push runs were really
# serving, and it is one button away.
on:
  schedule:
    # Offset from bench.yml (06:00) and audit.yml (06:30) so three scheduled
    # jobs are not queuing for a runner at the same minute.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: 4

jobs:
  coverage:
    name: Coverage floors
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # None of scripts/coverage-floors.json's crates need GTK -- postio-model,
      # postio-search and postio-config are pure leaves, and postio-storage /
      # postio-sync need SQLite and the keyring, not a display. Still ubuntu-26.04
      # rather than ubuntu-latest, so the pinned toolchain's cache key and the
      # rest of this workflow's runner-version assumptions stay one thing.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libsqlite3-dev \
            libsecret-1-dev \
            libglib2.0-dev

      # The pin decides; see the note in the `fmt` job.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # cargo-llvm-cov instruments with LLVM's own source-based coverage,
      # which needs the toolchain's llvm-tools alongside it -- a component,
      # not a second toolchain, so `check-toolchain-pinned.py`'s rule 2 does
      # not apply (that rule is about a workflow selecting a *toolchain* of
      # its own, not adding a component to the one rust-toolchain.toml pins).
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Identify the compiler
        id: rust
        run: echo "version=$(rustc --version | tr ' ()/' '----')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry, cargo-llvm-cov, and target dir
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-llvm-cov
            target
          key: ${{ runner.os }}-cargo-coverage-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-${{ steps.rust.outputs.version }}-

      # Pinned the same way cargo-fuzz is in fuzz.yml: a version, not a
      # floating latest, so a coverage-tool release cannot change what
      # "passing" means out from under a commit that touched nothing.
      # Reinstalled only when the cache did not already bring the right
      # binary. `cache-hit` is the wrong question here: this cache has
      # restore-keys, and a *prefix* restore reports `cache-hit: false` while
      # still putting cargo-llvm-cov on disk -- after which an unconditional
      # `cargo install` fails outright with "binary `cargo-llvm-cov` already
      # exists in destination" and takes the job with it. Asking the binary
      # its version answers under an exact hit, a prefix hit and a miss alike,
      # and catches a cached copy of the wrong version too.
      - name: Install cargo-llvm-cov
        run: |
          if cargo llvm-cov --version 2>/dev/null | grep -qw "0.9.0"; then
            echo "cargo-llvm-cov 0.9.0 restored from the cache"
          else
            cargo install cargo-llvm-cov --locked --version 0.9.0 --force
          fi

      # This is the PR-gating half of #98's "open question": coverage
      # instrumentation roughly doubles test wall-clock, which is too much
      # to add to every crate on every PR, but the five crates named in
      # scripts/coverage-floors.json are cheap enough, and pure/logic enough,
      # that a real regression here is worth blocking on rather than only
      # noticing later. postio-gtk and the rest are deliberately not run
      # here -- see that file's own comment for why a single global number
      # would be actively misleading across crates this different.
      - name: cargo llvm-cov (gated crates)
        run: scripts/coverage.sh

  doc:
    name: Docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-workspace

      # Denying warnings is what makes rustdoc's link checking mean anything:
      # broken intra-doc links are invisible until somebody browses the docs,
      # and there were 41 of them the first time this ran (#96).
      #
      # `missing_docs` is denied on the pull-request path by the clippy job,
      # not here -- it is a rustc lint, so `cargo clippy -- -D warnings`
      # reports it. Measured, because the comment this replaces claimed the
      # attribute "failed nothing, because no job ever built the docs", which
      # predates the clippy job and is no longer true.
      #
      # `private_intra_doc_links` is allowed on purpose. These docs are
      # written for contributors and cross-reference internals deliberately;
      # the build passes --document-private-items, so those links do resolve.
      # The lint exists for published crate docs, which this is not.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps --document-private-items
