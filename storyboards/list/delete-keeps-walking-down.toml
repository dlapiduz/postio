# Repeated delete works down the list, one row per press (#1687, #1746).
#
# The defect: after one delete the cursor went elsewhere, so a second `d`
# deleted a message nobody had looked at. Rapid deletes are how people clear
# a list, so each press must act on the row the cursor was on, and the
# cursor must stay at the same index (the next row slid into it). On the
# thirty-six-thread seed so there is always a row below.
#
# Focus's form of the defect is #1746: the cursor is not handed to the row
# below, so after the first delete there is no cursor and the next presses
# delete nothing. Red until #1746 lands.
#
# Re-expressed for Focus (T265): its cursor starts on no row, so two `j`
# leave it on index 1, and `delete` is Focus's own binding for it. The
# classic app it was written against is removed by T256.
apps   = ["focus"]
source = { kind = "issue", ref = "#1746" }
proof  = "open"
seed   = "thirty-threads"

[[step]]
command = "next_message"
check   = { keyboard.region = "list", cursor.index = 0 }

[[step]]
command = "next_message"
check   = { cursor.index = 1, rows.count = 36 }

[[step]]
command = "delete"
check   = { keyboard.region = "list", cursor.index = 1, rows.count = 35 }

[[step]]
command = "delete"
check   = { keyboard.region = "list", cursor.index = 1, rows.count = 34 }

[[step]]
command = "delete"
check   = { keyboard.region = "list", cursor.index = 1, rows.count = 33, notice.undo = true }
expect  = "Three rows are gone, one per press, and the cursor ring still sits on the second row. The list never scrolled to the top."
