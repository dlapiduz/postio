# A notice's to-do (spec 007 screens.md, "A notice's to-do"): automated mail
# the person guard never asks, marked only by a few strong patterns.
#
# `addressing`: `automated` is an Auto-Submitted machine; `bulk` is a bulk
# sending service's header and no list header; `table` is a sender the
# shipped table knows as a machine and files nowhere; `promotion` offers an
# unsubscribe; `list` carries a List-Id; `direct` is a person.
# `label`: `todo` with the clause quoted verbatim and its due day, or `none`.
# Every name and address is invented; every domain is reserved.

sent = "2026-05-04"

