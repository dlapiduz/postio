[package]
name = "postio-body"
description = "Message bodies in both directions: the document, its HTML subset, quoting and sanitisation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# The HTML parser, and the reason this is its own crate rather than part of
# postio-model: `ammonia` pulls html5ever, markup5ever and a generated tag
# table, and postio-model is what the whole workspace waits on. See ADR 0004.
ammonia = "4"
# Already in the tree: `ammonia` parses `style` attributes with it, so the
# sender-CSS work shares one parser rather than adding a second. See #1326.
cssparser = "0.37"
html5ever = "0.39.0"
# Sanitised HTML to Markdown, for the terminal's reader (specs/005-tui-frontend
# research R5; spike T005 found it keeps every safety promise over the corpus).
htmd = "0.5.5"
markup5ever_rcdom = "0.39.0"
postio-model = { workspace = true }
# Markdown to the composer's document, for the terminal composer
# (specs/005-tui-frontend research R6).
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
postio-model = { workspace = true, features = ["test-corpus"] }

[lints]
workspace = true
