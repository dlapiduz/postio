name: Benches

# On a timer: this job only proves the bench targets compile, and times nothing because a shared
# runner is too noisy for a 16ms budget.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 4

jobs:
  # A scheduled run is skipped when `main` has not moved (#1710); clippy's `--all-targets` already
  # checks benches on every PR.
  changed:
    name: Anything to compile
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            mise.toml
            .github/actions/python
      - uses: ./.github/actions/python

      - name: Compare against the last run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-anything-new.sh bench.yml >> "$GITHUB_OUTPUT"

  bench:
    name: Benches (compile only)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # The pin decides; a `rustup default stable` here would win over rust-toolchain.toml (#38).
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # Puts `postio-linker` and `postio-cc` on PATH (#1101), after rustup has made
      # `$CARGO_HOME/bin`.
      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      # The cache key names the compiler: a key of Cargo.lock alone would restore 2 GB of artifacts
      # the new compiler discards.
      - name: Identify the compiler
        id: rust
        run: echo "version=$(rustc --version | tr ' ()/' '----')" >> "$GITHUB_OUTPUT"

      # A missing bench is not a failure; this job only builds, since perf budgets are asserted by
      # the bench code.
      - name: Detect bench targets
        id: detect
        run: |
          if cargo metadata --format-version 1 --no-deps \
              | jq -e '[.packages[].targets[] | select(.kind[] == "bench")] | length > 0' >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Bench targets found; they will be compiled."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No bench targets yet - skipping. (See the criterion harness bead.)"
          fi

      - name: Install system dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libsecret-1-dev \
            libglib2.0-dev \
            libpango1.0-dev

      - name: Cache cargo registry and target dir
        if: steps.detect.outputs.found == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-bench-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-${{ steps.rust.outputs.version }}-

      - name: Compile benches
        if: steps.detect.outputs.found == 'true'
        run: cargo bench --workspace --no-run

      # Drop our own artifacts, keep the third-party crates; names only files this workspace
      # produces.
      # A normal step, so it runs before the post step that saves the cache.
      - name: Drop workspace artifacts before caching
        if: always()
        run: |
          before=$(du -sm target 2>/dev/null | cut -f1 || echo 0)
          rm -rf target/*/incremental
          rm -f  target/*/deps/libpostio_*.rlib \
                 target/*/deps/libpostio_*.rmeta \
                 target/*/deps/postio_*.d \
                 target/*/deps/libpostio_*.d
          rm -rf target/*/.fingerprint/postio-* \
                 target/*/build/postio-*
          echo "cached target: ${before}MB -> $(du -sm target 2>/dev/null | cut -f1 || echo 0)MB"

