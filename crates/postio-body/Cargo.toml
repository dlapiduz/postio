[package]
name = "postio-body"
description = "Message bodies in both directions: the document, its HTML subset, quoting and sanitisation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Test-only: spec 014's golden document, for every suite that asserts what a
# formatted message is. Downstream crates enable it from their
# dev-dependencies, so nothing ships in a normal build.
test-golden = []

[dependencies]
# The HTML parser, and the reason this is its own crate rather than part of
# postio-model: `ammonia` pulls html5ever, markup5ever and a generated tag
# table, and postio-model is what the whole workspace waits on. See ADR 0004.
ammonia = "4.2.5"
# Already in the tree: `ammonia` parses `style` attributes with it, so the
# sender-CSS work shares one parser rather than adding a second. See #1326.
cssparser = "0.38"
html5ever = "0.40.1"
# Sanitised HTML to Markdown, for the terminal's reader (docs/archive/specs/005-tui-frontend
# research R5; spike T005 found it keeps every safety promise over the corpus).
htmd = "0.6.0"
markup5ever_rcdom = "0.40.1"
postio-model = { workspace = true }
# Markdown to the composer's document, for the terminal composer
# (docs/archive/specs/005-tui-frontend research R6).
pulldown-cmark = { version = "0.13", default-features = false }
postio-workspace-hack.workspace = true

[dev-dependencies]
# Self dev-dependency, as postio-model's corpus is, so the body suite sees
# the golden document without making it a default feature.
postio-body = { path = ".", features = ["test-golden"] }
postio-model = { workspace = true, features = ["test-corpus"] }

[lints]
workspace = true
