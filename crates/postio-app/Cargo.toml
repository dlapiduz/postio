[package]
name = "postio-app"
description = "The composition root: opens the store, starts the runtime, runs the UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# What lands on PATH — and what the desktop entry's `Exec` names — is `postio`.
[[bin]]
name = "postio"
path = "src/main.rs"

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_7"] }
async-channel = "2.5.0"
# Queue rows are stamped with when the user performed the action, so the
# drainer replays them in the order they happened.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_20"] }
postio-config.workspace = true
postio-core.workspace = true
postio-gtk.workspace = true
postio-imap.workspace = true
postio-index.workspace = true
postio-model.workspace = true
# The database half. Nothing else depends on it but this crate, so nothing is
# guarded against the `rusqlite` it pulls in — which is the whole reason this
# crate exists. See its `main.rs`.
postio-runtime.workspace = true
postio-search.workspace = true
postio-session.workspace = true
postio-smtp.workspace = true
postio-storage.workspace = true
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread"] }
tracing = "0.1"
tracing-journald = "0.3"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
# Both are for the `shot` example, which renders surfaces the application
# itself reaches only through postio-gtk: the search panels, and the settings
# panel over a real config file.
postio-config.workspace = true
postio-search.workspace = true
# Throwaway migrated databases, so a verb is an ordinary function over a real
# schema rather than something only a running application can exercise.
postio-storage = { workspace = true, features = ["test-support"] }
# Named explicitly by the integration tests, which drive the composition root
# through the crate that actually holds it rather than through this one's
# re-exports. That is the point of the split (#82): what those tests exercise
# is `postio-session`, and the import should say so.
postio-session.workspace = true
# The end-to-end suite (tests/e2e.rs) syncs a real window against the
# in-process wire-level IMAP server over loopback.
postio-imap = { workspace = true, features = ["imap", "test-server"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
criterion = "0.7.0"
async-trait = "0.1.92"
serde-xml-rs = "0.8"
url = { version = "2.5.8", default-features = false }

[[bench]]
name = "action_round_trip"
harness = false

# The consolidated app suite: same custom harness as postio-gtk's
# gtk_suite, same reasons -- see tests/app_suite/main.rs. #329.
[[test]]
name = "app_suite"
path = "tests/app_suite/main.rs"
harness = false

[lints.rust]
# Not the workspace floor: see EXCEPTIONS in scripts/checks/check-lint-floor.py.
unsafe_code = "deny"
