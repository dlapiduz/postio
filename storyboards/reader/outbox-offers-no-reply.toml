# A message on its way out does not offer Reply (#1523-#1525, #1749).
#
# The defect: opening a message queued to send showed the reader's verbs
# for mail somebody else sent, so `e` composed a reply to your own mail
# still on its way out. The key has to refuse with a notice instead.
#
# Re-expressed for Focus (T265): the Outbox is a place in `g o`, and the key
# is pressed on its one row.
apps   = ["focus"]
source = { kind = "issue", ref = "#1749" }
proof  = "pinned"
seed   = "outbox"

[[step]]
command = "go_to_folders"
check   = { keyboard.region = "picker" }

[[step]]
type    = "Outbox"

[[step]]
key     = "Return"
check   = { scope = "Outbox", rows.count = 1, keyboard.region = "list", app.focus.strip.counts = "1", app.focus.strip.has_action_shown = false }
expect  = "The Outbox lists the one queued message and the strip counts one, not the inbox's numbers."

[[step]]
id      = "outbox"
command = "next_message"
check   = { rows.count = 1, cursor.index = 0 }
expect  = "The Outbox lists the one message queued to send."

[[step]]
command = "reply"
check   = { composer.open = false, notice.text = "An outgoing message cannot be replied to" }
expect  = "Nothing opens. A notice says an outgoing message cannot be replied to."
