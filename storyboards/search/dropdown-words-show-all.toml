# Typing words reshapes the dropdown on every keystroke into the words
# state: up to four top hits with their passage, folder and date, up to
# four "Narrow to" pills with counts, and "Show all N results ⌘↩" focused
# by default; the footer says how many matched and how long the search
# took (specs/010-focus-search US1 scenarios 3, FR-013, FR-014, design
# screen 03).
#
# An answer for an earlier keystroke never replaces the panel for a later
# one (D8): the controller drops it by its stamp, and the driver aborts
# the superseded read.
#
# Show all, ⌘↩, is results-enter-and-leave.toml's.
apps   = ["macos", "focus"]
source = { kind = "spec", ref = "specs/010-focus-search US1" }
seed   = "search"
design = "03-typing-words"

[[step]]
wait    = { until = { cursor.index = 0 } }

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search" }

[[step]]
type    = "atlas budget"
check   = { overlay.kind = "finder", keyboard.region = "search", keyboard.typing = true }
expect  = "Top hits lists up to four messages, “Sender · Subject” with the matched words in the find highlight, a passage, `in:` folder and date. Narrow to shows up to four pills (top senders, has: attachment, the top label) with counts. “Show all N results”, N the count the Recent row gave “atlas budget”, is the last row and has the focus ring. The footer reads “N matches · … ms” with the same N and the real time."

[[step]]
key     = "Up"
check   = { overlay.kind = "finder", keyboard.region = "search", keyboard.typing = true }
expect  = "↑ takes the focus ring from Show all to the last top hit; the field keeps the keyboard."

[[step]]
key     = "Return"
check   = { keyboard.region = "reader" }
expect  = "↩ on a top hit opens that message (on the Mac in its window, on Linux in its dialog over the list); the panel is gone."
