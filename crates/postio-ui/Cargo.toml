[package]
name = "postio-ui"
description = "Toolkit-free presentation logic shared by every Postio frontend (ADR 0019)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
# The conversation header writes a date span, and a span is a decision (which
# ends carry a year, when a month is written once) rather than a format string.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
thiserror = "2.0.20"
postio-body = { version = "0.2.0", path = "../postio-body" }
postio-core = { version = "0.2.0", path = "../postio-core" }
# The query language. `search.rs` reads a `ParsedQuery` as chips and says
# what a result set turned out to be; neither is a toolkit's business (#1157).
postio-search = { version = "0.2.0", path = "../postio-search" }
postio-model = { version = "0.2.0", path = "../postio-model" }

[dev-dependencies]
postio-config = { version = "0.2.0", path = "../postio-config" }
