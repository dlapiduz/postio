# Tab cycles the panes deliberately (#494).
#
# The defect: there was no deliberate pane cycle, and Shift-Tab from the
# reader landed on the list's last row instead of the row being read. Fixed,
# so pinned: the region sequence is sidebar, list, reader, and the cursor is
# the row that was open all the way. Shift-Tab out of the reader is its own
# storyboard: the reader's web view takes real input, which the focus chain
# cannot deliver.
source = { kind = "issue", ref = "#494" }
proof  = "pinned"

[[step]]
command = "next_message"
[[step]]
id      = "row"
command = "next_message"
check   = { cursor.index = 2 }

[[step]]
command = "open_message"
check   = { keyboard.region = "list" }

[[step]]
command = "go_to_folders"
check   = { keyboard.region = "sidebar" }

[[step]]
command = "cycle_pane"
check   = { keyboard.region = "list", cursor.index = { same_as = "row" } }
expect  = "The keyboard moves from the sidebar to the list, on the row that was open."

[[step]]
command = "cycle_pane"
check   = { keyboard.region = "reader", cursor.index = { same_as = "row" } }
expect  = "The keyboard moves on to the reading pane."
