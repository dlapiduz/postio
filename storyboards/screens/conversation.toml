# A long thread opened: its newest message over the list, with the thread's
# chip and `[`/`]` to step it (C2).
#
# Re-expressed for Focus (T265): the classic canvas design it was compared
# with is the classic app's, which T256 removes; Focus's references are
# never committed (specs/007-postio-focus/screens.md records each one).
apps   = ["focus"]
source = { kind = "design", ref = "focus 04" }
seed   = "long-thread"
vary   = { width = ["wide"] }

[[step]]
command = "next_message"

[[step]]
command = "open_message"
check   = { view = "reader", reading.id = "7" }
