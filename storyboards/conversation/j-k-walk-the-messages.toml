# The thread's messages are walked from the keyboard, and Reply answers the
# one shown (#1386, #1365, #1748).
#
# The defect: per-message focus and per-message reply did nothing, so a
# long thread could only be read from its newest message, and `r` always
# answered that one. In the classic app `J`/`K` never reached the
# conversation (#1748).
#
# Re-expressed for Focus (T265): Focus shows one message at a time and steps
# the thread with `p` and `n` (C2, FR-037), so the open message names the
# message it shows. The seven-message long-thread opens on its first unread,
# message 6, the first of its two unread, as spec 013 opens a thread on its
# first unread (FR-013); `p` steps back, `n` forward, and `r` replies to the
# one shown.
apps   = ["focus"]
source = { kind = "issue", ref = "#1386" }
proof  = "pinned"
seed   = "long-thread"

[[step]]
command = "next_message"

[[step]]
id      = "open"
command = "open_message"
check   = { view = "reader", keyboard.region = "reader", reading.id = "6" }
expect  = "The thread opens on its first unread message."

[[step]]
command = "prev_in_thread"
check   = { reading.id = "5" }
expect  = "The open message steps back one, to the one before it in the thread."

[[step]]
command = "prev_in_thread"
check   = { reading.id = "4" }

[[step]]
command = "next_in_thread"
check   = { reading.id = "5" }
expect  = "`n` steps forward again."

[[step]]
command = "reply"
check   = { composer.open = true, keyboard.field = "body" }
expect  = "The composer opens as a reply to the message shown (message 5), not the first unread, and the caret is in the body."
