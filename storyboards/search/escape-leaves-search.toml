# Escape leaves a search, and the list is the folder again (#1474, #1011).
#
# The defect: once a search had run, Escape did nothing, and the window
# stayed stuck on the hits. The folder's own rows must be what is left.
#
# Re-expressed for Focus (T265), and again for spec 010's search (#1825):
# the dropdown never narrows the inbox behind it; Return runs the search
# into the results in the inbox's place, and Escape gives the inbox back,
# every row there.
apps   = ["focus"]
source = { kind = "issue", ref = "#1474" }
proof  = "pinned"

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search", keyboard.typing = true }

[[step]]
type    = "harbour"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
check   = { keyboard.region = "search", rows.count = { same_as = 0 }, app.focus.bar.highlighted = "show_all" }
expect  = "The top hits are listed as the word is typed, with Show all under the ring; the inbox behind is not narrowed."

[[step]]
key     = "Return"
check   = { keyboard.region = "results", overlay.kind = "none" }
expect  = "Return runs the search: its results stand in the inbox's place, the keyboard on them."

[[step]]
command = "back"
check   = { keyboard.region = "list", overlay.kind = "none", view = "list", rows.count = { same_as = 0 } }
expect  = "Escape leaves the results: the list is the Inbox, every row there; nothing of the search is left."
