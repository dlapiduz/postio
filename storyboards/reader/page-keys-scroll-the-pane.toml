# Page keys scroll the open message (#1402, #1431, #438).
#
# The defect: the message being read could not be scrolled from the
# keyboard: Space, Page Down, Page Up did nothing, so a long message could
# only be read with the mouse. The scroll offset must actually move, in
# both directions, and the view must never blank doing it.
#
# Re-expressed for Focus (T265): the long-newsletter seed's fifth row is the
# message tall enough to scroll; Return opens it over the list, where Page
# Down, Page Up, Space and Shift+Space page it (the arrows and `j`/`k` are
# dialog-scroll-keys-leave-the-list-alone's).
apps   = ["focus"]
source = { kind = "issue", ref = "#1402" }
proof  = "pinned"
seed   = "long-newsletter"

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
command = "next_message"

[[step]]
id      = "start"
command = "open_message"
settle  = { until = { view = "reader" } }
check   = { view = "reader", reading.id = "90", reading.scroll.offset = 0 }
expect  = "The newsletter is open at its top."

[[step]]
command = "scroll_reader_down"
settle  = { until = { reading.scroll.offset = { changed = true } } }
check   = { reading.scroll.offset = { changed = true }, reading.id = "90" }
expect  = "Page Down scrolls forward by a page, smoothly, with no flash."

[[step]]
command = "scroll_reader_up"
settle  = { until = { reading.scroll.offset = { changed = true } } }
check   = { reading.scroll.offset = { changed = true } }
expect  = "Page Up scrolls back again."

[[step]]
key     = "space"
settle  = { until = { reading.scroll.offset = { changed = true } } }
check   = { reading.scroll.offset = { changed = true } }
expect  = "Space pages down, the same as Page Down."

[[step]]
key     = "shift+space"
settle  = { until = { reading.scroll.offset = { changed = true } } }
check   = { reading.scroll.offset = { changed = true } }
expect  = "Shift+Space pages back up, the same as Page Up."
