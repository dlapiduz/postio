# Escape from search puts the keyboard back on the row it left (6eadd8e2).
#
# 6eadd8e2 fixed the keyboard half: Escape closed the search and left focus
# in the field. The cursor half is #1744: once the live search has replaced
# the list's rows, Escape brings the folder back with the cursor on row 0.
# Red until #1744 lands.
source = { kind = "issue", ref = "#1744" }
proof  = "open"

[[step]]
command = "next_message"
[[step]]
command = "next_message"
[[step]]
id      = "fifth"
command = "next_message"
check   = { cursor.index = 3 }

[[step]]
command = "search"
check   = { keyboard.region = "search" }

[[step]]
type    = "tide"
settle  = { until = { rows.count = { changed = true } } }
check   = { rows.count = { changed = true } }

[[step]]
command = "back"
check   = { keyboard.region = "list", overlay.kind = "none", cursor.index = { same_as = "fifth" } }
expect  = "The keyboard is back on the row it left, with that row still under the cursor."

# Focus has no cursor row until a key puts one there, so three `j` leave it
# on index 2, and its bar does not narrow the inbox behind it, so the row
# count never changes while the query is typed. The check at the end is the
# same: the cursor is where it was.
[app.focus.step.fifth]
check = { cursor.index = 2 }

[app.focus.step.5]
check = { rows.count = { unchanged = true } }
