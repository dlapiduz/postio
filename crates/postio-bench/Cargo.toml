[package]
name = "postio-bench"
description = "The workspace's benchmarks, kept out of the crates they measure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# Bench targets only: no library and no binary.
[lib]
path = "src/lib.rs"

# All dev-dependencies: `cargo build --workspace` cannot reach them, so
# `postio-storage/test-support` is not unified onto every crate.
[dev-dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
chrono = { workspace = true, features = ["std"] }
criterion = "0.8.2"
futures-util = { workspace = true }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
postio-config.workspace = true
postio-core.workspace = true
postio-gtk.workspace = true
postio-host.workspace = true
postio-widgets.workspace = true
postio-account.workspace = true
postio-index.workspace = true
postio-model = { workspace = true, features = ["test-corpus"] }
postio-body.workspace = true
postio-render.workspace = true
postio-ui.workspace = true
postio-runtime.workspace = true
postio-search.workspace = true
postio-session.workspace = true
postio-storage = { workspace = true, features = ["test-support"] }
postio-sync.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

# `harness = false` on every bench: each owns its `main`.
[[bench]]
name = "perf_budgets"
harness = false

[[bench]]
name = "list_scroll"
harness = false

[[bench]]
name = "composer_open"
harness = false

[[bench]]
name = "search_budget"
harness = false

[[bench]]
name = "search_under_load"
harness = false

[[bench]]
name = "store_reads"
harness = false

[[bench]]
name = "sync_writes"
harness = false

[[bench]]
name = "sync_lanes"
harness = false

[[bench]]
name = "reader_render"
harness = false

[[bench]]
name = "search_focus"
harness = false

[[bench]]
name = "body_index_size"
harness = false

[[bench]]
name = "event_hub"
harness = false

[[bench]]
name = "thread_bar"
harness = false

[dependencies]
postio-workspace-hack.workspace = true
