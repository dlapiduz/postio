[package]
name = "postio-session"
description = "The composition root without a toolkit: store, runtime, engines and the verb vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Queue rows are stamped with when the user performed the action, so the
# drainer replays them in the order they happened.
chrono = { workspace = true, features = ["std"] }
postio-config.workspace = true
postio-core.workspace = true
# `maildir` on: the composition root is where a stored account's backend is
# chosen, so it has to be able to build every kind an account row can name.
postio-account = { workspace = true, features = ["maildir"] }
postio-jmap.workspace = true
postio-gmail.workspace = true
postio-index.workspace = true
postio-model.workspace = true
# The database half. This crate is where SQLite is allowed; postio-gtk is
# guarded against it and so is postio-core.
postio-runtime.workspace = true
postio-search.workspace = true
postio-smtp.workspace = true
# `watch_policy`'s `WatchPolicy` (#932). Already in the graph under
# `postio-runtime`; naming it here is what lets a config value reach it
# rather than only `postio-runtime`'s own tests.
postio-sync.workspace = true
postio-storage.workspace = true
# `reader::Absent` and `reader::parts::BlobSource`: the frontend-independent
# half of the reader. Toolkit-free, so no cycle and no widget reaches in.
postio-ui.workspace = true
# The credential a "test connection" hands to SMTP. Same version the two
# crates that already carry one use, because a second `SecretString` type in
# the graph would defeat the zeroing this exists for.
secrecy = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-journald = "0.3"
tracing-log = "0.2"
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter"] }

[dev-dependencies]
# The patience dial (#842), so the indexer test's wait scales with the machine.
postio-test-support.workspace = true
# Throwaway migrated databases, so a verb is an ordinary function over a real
# schema rather than something only a running application can exercise. This
# is the whole argument for the crate: the verbs are testable without a
# toolkit, and they were not while they lived beside a GTK binary.
postio-storage = { workspace = true, features = ["test-support"] }
# The unkeyed digest a blob written before ADR 0014 was named by, so the
# fixture is the shape a real pre-release store has rather than a plausible
# one.
blake3 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
