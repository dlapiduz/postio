[package]
name = "postio-tui"
description = "Postio in the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "postio-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The terminal: crossterm for input, mouse, bracketed paste and the keyboard
# protocol (research R3, R4).
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
postio-core.workspace = true
postio-ui.workspace = true

[dev-dependencies]
postio-config.workspace = true
