name: Nightly

# Work worth doing daily and not on the merge path: nobody is blocked on learning it within the
# hour.
# Coverage drift is a trend, and the noisiest job here (#818). `doc` is the exception (#833): a
# broken intra-doc link is a
# per-commit fact, but the workspace doc build was 23m35s of every PR; clippy already denies
# `missing_docs`.
# `workflow_dispatch` is for when you want the number now.
on:
  schedule:
    - cron: "0 7 * * *"
  # Also every push to `main`: nothing waits on it, and it lets the merge-path tier stay at minutes.
  # `ci.yml`'s
  # `Nightly is green` reads the latest completed run and locks merges while it is red; `unlock.yml`
  # reopens them.
  push:
    branches: [main]
  workflow_dispatch:
  # Called by `full-suite.yml` (`issue-land.sh --full-suite`); reused so there is one definition of
  # what the nightly runs.
  # The inputs narrow a call to a subset (`scripts/ci-nightly-rerun.py` builds the filter); with
  # none it is the whole nightly.
  workflow_call:
    inputs:
      # Single-line descriptions: `scripts/checks/ci-expected-workflows.py` reads this file with a
      # YAML reader that has no folded scalars.
      only:
        description: "Space-separated subset of: coverage doc tests doctests. Empty runs every job."
        type: string
        default: ""
      profile:
        description: The nextest profile for the suite.
        type: string
        default: ci-full
      tests:
        description: "The tests to run, one '<binary_id> <test name>' per line, as the nightly-failed-tests artifact lists them. Empty runs the profile's whole reach."
        type: string
        default: ""

permissions:
  contents: read
  actions: read

# On main the newest push supersedes the one before it: the lock asks about the latest state. Other
# triggers are never cancelled.
concurrency:
  group: nightly-${{ github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 4

jobs:
  # A scheduled run skips when `main`'s head matches the head the last run tested; only a schedule
  # is ever skipped.
  # `--rerun-failed`: a red nightly re-runs over an unchanged tree, because an all-skipped run would
  # read as green
  # to `Nightly is green`. The script's header has the argument; bench.yml and mutants.yml share it
  # without the flag (#1710).
  changed:
    name: Anything to test
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            mise.toml
            .github/actions/python
      - uses: ./.github/actions/python

      - name: Compare against the last run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-anything-new.sh nightly.yml --rerun-failed >> "$GITHUB_OUTPUT"

  coverage:
    name: Coverage floors
    needs: changed
    # `inputs.only` is null on a schedule or dispatch and empty from a caller that passed nothing:
    # both mean every job.
    if: needs.changed.outputs.run == 'true' && (!inputs.only || contains(format(' {0} ', inputs.only), ' coverage '))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      # None of the coverage-floor crates need GTK or a display; still ubuntu-26.04 so the toolchain
      # cache key and runner assumptions stay one thing.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libsecret-1-dev \
            libglib2.0-dev

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      # A component of the pinned toolchain, not a second toolchain, so
      # `check-toolchain-pinned.py`'s rule 2 does not apply.
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      # `scripts/coverage.sh` measures through nextest so the measurement tier stays off this job
      # (#1456); plain `cargo test` ignores its default-filter.
      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      # Restored everywhere, written from `main` only: a cache saved from a PR is readable only by
      # it and evicts `main`'s (#1710).
      - name: Restore cargo registry, cargo-llvm-cov, and target dir
        uses: ./.github/actions/build-cache
        with:
          name: coverage
          extra-paths: ~/.cargo/bin/cargo-llvm-cov

      - name: Install cargo-llvm-cov
        run: |
          if cargo llvm-cov --version 2>/dev/null | grep -qw "0.9.0"; then
            echo "cargo-llvm-cov 0.9.0 restored from the cache"
          else
            cargo install cargo-llvm-cov --locked --version 0.9.0 --force
          fi

      # Coverage roughly doubles test wall-clock, so only the crates in scripts/coverage-floors.json
      # are gated (#98).
      - name: cargo llvm-cov (gated crates)
        run: scripts/coverage.sh

      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  doc:
    name: Docs
    needs: changed
    if: needs.changed.outputs.run == 'true' && (!inputs.only || contains(format(' {0} ', inputs.only), ' doc '))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-workspace

      # Denying warnings makes rustdoc's link checking mean something (#96). `missing_docs` is
      # denied by the clippy job.
      # `private_intra_doc_links` is allowed on purpose: these docs are for contributors and build
      # with --document-private-items.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps --document-private-items

  full-suite:
    name: Full suite
    needs: changed
    if: needs.changed.outputs.run == 'true' && (!inputs.only || contains(format(' {0} ', inputs.only), ' tests ') || contains(format(' {0} ', inputs.only), ' doctests '))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - uses: ./.github/actions/rust-workspace

      - name: Give the GTK suites a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      # Every test in the workspace, integration binaries and measurements included. This job is the
      # first reader of the
      # integration suites (the PR run is the sanity tier), so `ci.yml`'s `nightly` job goes red on
      # every PR while it fails (#847).
      # `--profile ci-full` runs the measurement files `profile.default` holds off the merge path
      # (#1450), with fail-fast off.
      # `cache_pressure` is the one test no shared runner runs: it asserts a larger cache is
      # measurably faster, a timing
      # CLAUDE.md does not ask of a shared runner, and it timed out at 240s, 720s and 1200s. Run it
      # with
      # `cargo nextest run --profile nightly -E 'binary(cache_pressure)'` on a workstation.
      # The exclusion is `profile.ci-full`, not an `-E` here, because `release.yml`'s gate must hold
      # out the same thing.
      # Through the flake-retry script (#1710): a test that fails again alone still fails the run; a
      # forgiven flake is a `::warning::`.
      # Tests that fail twice go to `nightly-failed-tests`, which `scripts/ci-nightly-rerun.py`
      # turns into `inputs.tests`.
      # That script recognises this step by its name: keep the prefix `cargo nextest run`.
      - name: cargo nextest run --profile ci-full
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' tests ') }}
        env:
          POSTIO_TEST_PATIENCE: "3"
          POSTIO_FAILED_TESTS_FILE: ${{ runner.temp }}/nightly-failed-tests/failed.txt
          PROFILE: ${{ inputs.profile || 'ci-full' }}
          TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$POSTIO_FAILED_TESTS_FILE")"
          if [ -z "$TESTS" ]; then
            exec dbus-run-session -- scripts/test-with-flake-retry.sh "$PROFILE"
          fi

          echo "Re-running only what the last nightly failed:"
          printf '%s\n' "$TESTS" | sed 's/^/  /'
          printf '%s\n' "$TESTS" | python3 scripts/ci-nightly-rerun.py cargo-args > "$RUNNER_TEMP/select"
          printf '%s\n' "$TESTS" | python3 scripts/ci-nightly-rerun.py filter > "$RUNNER_TEMP/filter"
          select=()
          while IFS= read -r arg; do select+=("$arg"); done < "$RUNNER_TEMP/select"
          if [ "${#select[@]}" -eq 0 ]; then
            echo "Every binary that failed is gone from this branch; nothing left to fail."
            exit 0
          fi
          POSTIO_NEXTEST_FILTER="$(cat "$RUNNER_TEMP/filter")" \
            dbus-run-session -- scripts/test-with-flake-retry.sh "$PROFILE" "" "${select[@]}"

      - name: Keep the failed tests for the pull requests that follow
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-failed-tests
          path: ${{ runner.temp }}/nightly-failed-tests/
          if-no-files-found: ignore
          retention-days: 14

      # nextest does not run doctests and does not say so (#1440). Runs even when the suite failed,
      # so a red nightly says
      # whether the doctests were red too.
      - name: cargo test --doc
        if: ${{ !cancelled() && (!inputs.only || contains(format(' {0} ', inputs.only), ' doctests ')) }}
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- cargo test --workspace --doc

  # Focus's two storyboard passes, beside the full suite: `every_command` (~411 s) and
  # `storyboard_catalogue` (~275 s) each take every test
  # thread, which held the suite for twelve minutes. `profile.ci-storyboards` selects what
  # `profile.ci-full` holds out;
  # `check-measurement-tier.py` keeps the two in step.
  #
  # The test binary, built once for the four shards, which restore the `build-app` cache that ci.yml
  # keeps warm on `main` and save none.
  storyboards-build:
    name: Build the storyboard passes
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - uses: ./.github/actions/rust-workspace
        with:
          cache-name: build-app

      - name: Restore mtimes from commit history
        run: scripts/restore-mtimes.py

      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      # The attachment text helper rides in the archive to the shards
      # (`profile.ci-storyboards.archive`); without it a PDF's words are found nowhere (#2178).
      - name: cargo build (postio-extract-helper)
        run: cargo build -p postio-session --bin postio-extract-helper

      - name: cargo nextest archive (focus_suite)
        run: >-
          cargo nextest archive -p postio-gtk --test focus_suite
          --profile ci-storyboards
          --archive-file "$RUNNER_TEMP/storyboard-tests.tar.zst"

      - name: Ship the archive to the shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storyboard-tests
          path: ${{ runner.temp }}/storyboard-tests.tar.zst
          retention-days: 1
          if-no-files-found: error

  storyboards:
    name: Storyboard passes (${{ matrix.shard }}/4)
    needs: [changed, storyboards-build]
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-26.04
    # Each pass is one test that plays hundreds of windows, so nextest cannot split it; the tests
    # split themselves by
    # `POSTIO_STORYBOARD_SHARD`.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python

      - uses: ./.github/actions/rust-workspace
        with:
          build-cache: "false"

      - name: Give the GTK suites a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      - name: Fetch the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storyboard-tests
          path: ${{ runner.temp }}

      - name: cargo nextest run --profile ci-storyboards
        env:
          POSTIO_TEST_PATIENCE: "3"
          POSTIO_STORYBOARD_SHARD: ${{ matrix.shard }}/4
        run: >-
          dbus-run-session -- scripts/test-with-flake-retry.sh ci-storyboards ""
          --archive-file "$RUNNER_TEMP/storyboard-tests.tar.zst"
          --workspace-remap "$GITHUB_WORKSPACE"
