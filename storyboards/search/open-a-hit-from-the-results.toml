# Opening a hit from the search results reads that message (#961, #767,
# #1526).
#
# The defects: search ignored the account scope, opening a hit reached an
# unwired dispatcher (nothing opened), and a hit was listed once per folder
# it was filed in. On the two-accounts seed, the hits are listed once each,
# across both accounts, and Return on the first puts exactly that message in
# the reader.
#
# Re-expressed for Focus (T265): the bar lists the hits under its field as
# the word is typed; Return highlights the first, and a second Return opens it
# over the list, in a fresh window with no cursor row. That last was red
# when re-expressed -- the bar opened a hit through the list's cursor, so
# with none nothing opened -- and is fixed beside it.
apps   = ["focus"]
source = { kind = "issue", ref = "#961" }
proof  = "pinned"
seed   = "two-accounts"

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search" }

[[step]]
type    = "harbour"
settle  = { until = { app.focus.bar.messages = 8 } }
check   = { app.focus.bar.messages = 8, app.focus.bar.heading = "Conversations · 8 matches" }
expect  = "Eight hits from both accounts, each saying which account it is in."

[[step]]
id      = "hit"
key     = "Return"
check   = { app.focus.bar.highlighted = "message", app.focus.bar.highlighted_id = "57" }
expect  = "The first hit, the Tide gate interlock proposal, is highlighted."

[[step]]
key     = "Return"
check   = { view = "reader", keyboard.region = "reader", reading.id = "57", overlay.kind = "none" }
expect  = "The reader shows the first hit, the Tide gate interlock proposal, over the list."

[[step]]
id      = "first"
command = "next_message"
check   = { view = "reader", reading.id = { changed = true }, keyboard.region = "reader" }
expect  = "`j` steps to the next hit in the bar's order, not to the list's next row behind the dialog."

[[step]]
command = "prev_message"
check   = { view = "reader", reading.id = "57" }
expect  = "`k` steps back to the first hit."

[[step]]
command = "back"
check   = { view = "search", overlay.kind = "finder", app.focus.bar.messages = 8, app.focus.bar.highlighted = "message", app.focus.bar.highlighted_id = { same_as = "hit" } }
expect  = "Escape returns to the results with the bar as it was, the highlight on the hit that was open and not back on the Search mail row."
