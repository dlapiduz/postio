# A folder reload keeps the list on Flagged (#813).
#
# The defect: a mailbox-list reload (resync, rename) threw the list out of
# Flagged back to the inbox. Fixed, so pinned: the list stays Flagged and
# the cursor stays put. Classic's observed scope is the account, not the
# view row, so Flagged is pinned by its row count (9 in the small seed; the
# inbox has 34).
source = { kind = "issue", ref = "#813" }
proof  = "pinned"

[[step]]
command = "focus_sidebar"

[[step]]
command = "next_folder"
settle  = { until = { rows.count = 9 } }
check   = { rows.count = 9 }

[[step]]
command = "cycle_pane"
check   = { keyboard.region = "list" }

[[step]]
id      = "down"
command = "next_message"
check   = { cursor.index = 1 }

[[step]]
event   = "mailboxes_changed"
settle  = { watch_ms = 500 }
check   = { rows.count = 9, cursor.index = { same_as = "down" } }
expect  = "The list is still Flagged, with the cursor where it was. Nothing jumps back to the inbox."
