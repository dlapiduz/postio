[package]
name = "postio-imap"
description = "IMAP backend built on Pimalaya io-imap, behind the MailBackend trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["imap"]

# The io-imap-backed implementation, and everything it drags in: the protocol
# crate, its SASL companion, and our own TLS stack. On by default.
#
# Turn it off and what is left is the MailBackend seam, its mock, autoconfig
# discovery and the keyring. That is all `postio-sync` needs, and it is what
# keeps a pre-1.0 protocol crate — and the CI rule that bans io-imap from
# `postio-gtk` — out of everything above this one. See ADR 0001.
imap = [
    "dep:io-imap",
    "dep:io-sasl",
    "dep:log",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:tokio-rustls",
]

# Test-only: lets `MockMailbox::corpus` seed mailboxes from the shared `.eml`
# fixtures. Off by default so nothing in a normal build carries them; the
# self dev-dependency below turns it on for this crate's own test suite.
test-corpus = ["postio-model/test-corpus"]

# Test-only: the in-process IMAP server in `test_server`. Off by default so a
# shipped build carries no listening socket at all. It implies `test-corpus`
# because its mailboxes are seeded from the shared `.eml` fixtures rather than
# from fixtures invented here, and it deliberately does *not* imply `imap`:
# the server is written against the wire, not against `io-imap`, so a bug in
# the protocol crate cannot hide inside the thing meant to catch it.
test-server = ["test-corpus"]

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
io-imap = { version = "=0.6.0", default-features = false, features = ["client"], optional = true }
io-pim-discovery = { version = "0.7", default-features = false, features = ["autoconfig", "rfc6186", "rustls-ring"] }
io-sasl = { version = "=0.1.0", default-features = false, optional = true }
log = { version = "0.4", features = ["std"], optional = true }
oo7 = "0.6.0-alpha"
pimalaya-stream = { version = "0.3", features = ["rustls-ring"] }
postio-model.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "time", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
tracing = "0.1"
url = "2.5.8"
zeroize = "1.9.0"

[dev-dependencies]
# The protocol crate, for the handful of commands `postio-imap` does not wrap
# yet — QRESYNC SELECT, ENABLE, STORE, COPY, APPEND — which `tests/imap_loopback.rs`
# drives against the in-process server directly. Same exact pin as above, so
# cargo resolves one copy and the types match.
io-imap = { version = "=0.6.0", default-features = false, features = ["client"] }
postio-imap = { path = ".", features = ["test-corpus", "test-server"] }
postio-model = { path = "../postio-model", features = ["test-corpus"] }
serde-xml-rs = "0.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
toml = "1.1.4"
