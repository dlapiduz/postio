[package]
name = "postio-client"
description = "What every Postio frontend holds: commands down, events up, queries answered by the store's one owner (ADR 0041)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-channel = { workspace = true }
postio-core.workspace = true
postio-model.workspace = true
serde = { workspace = true }
# The wire encoding. Self-describing on purpose: several model types have
# hand-written `Deserialize` impls, which compact non-self-describing
# formats cannot always read back. Already in the graph (research R2, T008).
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
