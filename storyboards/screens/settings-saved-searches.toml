# Settings, Saved searches: the searches pinned to the places list, each
# with its query. There is no form that adds one: the page says a search
# is saved from the command bar, and names the key.
#
# Focus's design references are never committed
# (specs/007-postio-focus/screens.md records each one).
apps   = ["focus"]
source = { kind = "design", ref = "none" }
preset = "settings/saved-searches"
