[package]
name = "postio-ui"
description = "Toolkit-free presentation logic shared by every Postio frontend (ADR 0019)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
postio-body = { version = "0.6.2", path = "../postio-body" }
postio-config = { version = "0.6.2", path = "../postio-config" }
postio-core = { version = "0.6.2", path = "../postio-core" }
postio-search = { version = "0.6.2", path = "../postio-search" }
postio-model = { version = "0.6.2", path = "../postio-model" }
postio-contact-sync.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
postio-workspace-hack.workspace = true
psl = "2.1.255"

[dev-dependencies]
tempfile = { workspace = true }
postio-model = { version = "0.6.2", path = "../postio-model", features = ["test-corpus"] }
postio-config = { version = "0.6.2", path = "../postio-config" }
