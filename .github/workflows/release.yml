name: Release

# Deliberately not part of CI. A Flatpak build compiles the whole workspace
# --release inside a sandbox against a ~3 GB runtime it has to download first,
# which is minutes of runner time that says nothing new about a commit. It runs
# when a version is tagged, and on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # to create the release and upload the bundle
  id-token: write        # to mint the Sigstore signature behind an attestation
  attestations: write    # to publish the provenance and SBOM attestations

env:
  APP_ID: dev.postio.Postio
  MANIFEST: flatpak/dev.postio.Postio.json

jobs:
  # **The full suite, and nothing ships without it** (2026-09-19).
  #
  # This workflow used to build and publish without running a test at all --
  # CLAUDE.md said so in as many words, and the answer was "a release needs a
  # local full-suite run first", which is a rule that lives in a person's
  # memory and fails the day they are in a hurry.
  #
  # It matters more now than it did. The pull-request gate is the sanity tier,
  # so the integration suites that catch layers which each pass and were never
  # joined up run on the nightly timer and here. A tag is the last point at
  # which finding one is cheaper than shipping it.
  #
  # `--profile ci-full`: the measurement tier runs here too -- a release is the
  # job with no one waiting on it and therefore the least excuse for running
  # less than everything -- minus the one measurement that asserts on a
  # stopwatch, which a shared runner cannot defend and which has never once
  # finished on one. `.config/nextest.toml` says which and why.
  #
  # This asked for `--profile nightly` until 2026-09-19, and would have taken
  # the release down with it: `cache_pressure` has been terminated on a runner
  # at 240s, 720s and 1200s, so this gate could not have gone green and
  # `flatpak` below `needs` it. Nothing would have been published, twenty
  # minutes after the tag, for a reason nowhere near the tag.
  suite:
    name: Full suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-workspace

      - name: Give the GTK suites a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      # Keyed on the script rather than a version repeated here, as `ci.yml`
      # and `nightly.yml` both do it: the key changes when the pin does and
      # cannot go stale against it.
      - name: Cache cargo-nextest
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      - name: cargo nextest run --profile ci-full
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- cargo nextest run --workspace --profile ci-full

      # nextest does not run doctests and does not say so. Asked for by name
      # here for the same reason `nightly.yml` asks for them.
      - name: cargo test --doc
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- cargo test --workspace --doc

  flatpak:
    name: Flatpak bundle
    # Nothing is built, signed, attested or published until the suite above
    # is green. The bundle is the artifact people install; it is the wrong
    # thing to produce optimistically.
    needs: suite
    runs-on: ubuntu-26.04
    steps:
      # Full history, not the default single commit: bumping the version
      # below needs `git log`/`git describe` against the *previous* tag to
      # write the changelog, and pushing the bump needs real ancestry to
      # rebase onto if `main` moves while this job runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A cold debug build already ran a runner out of disk once and killed lld
      # with SIGBUS mid-link. This build is --release and additionally needs the
      # GNOME runtime and SDK, so reclaim the preinstalled toolchains nothing
      # here uses before starting rather than diagnosing it again.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      # #886: pushing a tag is the whole trigger for a release, not a script
      # a session runs by hand first. Everything from here down to "Commit
      # and push the version bump" is skipped on a `workflow_dispatch` rerun
      # (github.ref_type != 'tag'), which still wants to rebuild whatever is
      # already checked out, unbumped.
      #
      # This has to be the same job the Flatpak build runs in, not a job of
      # its own: the bump below lands as a commit to `main`, and the build
      # further down needs to see that commit's Cargo.toml without a second
      # checkout, which is the only way the bundle it produces and the
      # version it claims to be never disagree.
      - uses: ./.github/actions/rust-workspace
        if: github.ref_type == 'tag'

      # Hand-written notes win when there are any: docs/releases/<version>.md
      # is a paragraph or two and a list of what changed, written for a
      # person, and it becomes both the GitHub release body and the AppStream
      # changelog entry (release-bump.py renders its paragraphs and bullets).
      # Without one the notes are the commit subjects since the last tag --
      # complete, and unreadable past a few dozen commits.
      - name: Generate release notes since the last tag
        if: github.ref_type == 'tag'
        run: |
          : > release-notes.txt
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -s "docs/releases/${VERSION}.md" ]; then
            cp "docs/releases/${VERSION}.md" release-notes.txt
          else
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              git log "$LAST_TAG"..HEAD --no-merges --format='- %s' \
                | grep -v '^- chore(release):' >> release-notes.txt || true
            fi
          fi
          [ -s release-notes.txt ] || echo "- Maintenance release" >> release-notes.txt
          echo "--- release-notes.txt ---"
          cat release-notes.txt

      # The mechanical half of what cutting v0.2.0 by hand required: the
      # workspace version, every internal path-dependency pin that names it,
      # and the AppStream changelog. See scripts/release-bump.py and #886.
      - name: Bump the workspace version for this release
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release-bump.py "$VERSION" --notes-file release-notes.txt

      # Also regenerates Cargo.lock for the bumped internal versions -- the
      # same side effect this had by hand.
      - name: Verify the bump compiles
        if: github.ref_type == 'tag'
        run: cargo check --workspace --all-targets

      # Same reasoning and the same mechanism as ci.yml's `test` job: no
      # display means the GTK suites skip themselves and report a false
      # green, so the release gate gets the real compositor, not a weaker
      # substitute. See that job's comments for the "why" in full.
      - name: Give the GTK suites a runtime directory
        if: github.ref_type == 'tag'
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      # A release does not ship on a test that only failed because this
      # runner was busy. See scripts/test-with-flake-retry.sh -- a target
      # that fails once is retried alone before it is allowed to block
      # anything; one that fails twice still blocks the release.
      - name: Run the release gate
        if: github.ref_type == 'tag'
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- scripts/test-with-flake-retry.sh

      - name: Run repository invariant checks
        if: github.ref_type == 'tag'
        run: bash scripts/check.sh

      # `main` moves while this job runs -- it did, three times, cutting
      # v0.2.0 by hand. A push rejected as non-fast-forward means exactly
      # that; the fix is to rebase the one bump commit onto wherever `main`
      # ended up and try again, not to fail a release over an ordinary
      # landing that happened at the wrong moment.
      - name: Commit and push the version bump
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "postio-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml \
            crates/postio-gtk/data/dev.postio.Postio.metainfo.xml
          git commit -m "chore(release): bump workspace to ${VERSION}"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected -- main moved, rebasing and retrying ($attempt/5)" >&2
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the version bump after 5 attempts" >&2
          exit 1

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # Pinned to what the manifest declares. Reading them from the manifest
      # rather than repeating the versions keeps this from drifting out of step
      # with it -- a second copy of a version number is a second thing to forget.
      # The runtime and SDK branch with `runtime-version`, so those are named
      # here. The SDK *extensions* do not: `rust-stable` is a freedesktop
      # extension and its branches follow freedesktop's versions, not GNOME's,
      # so asking flathub for `org.freedesktop.Sdk.Extension.rust-stable//50`
      # -- the manifest's GNOME runtime version -- resolves to nothing:
      #
      #   error: Nothing matches org.freedesktop.Sdk.Extension.rust-stable
      #          in remote flathub
      #
      # and the bare-name fallback beneath it fails for the same reason, a
      # ref with no branch being no more resolvable than a wrong one.
      #
      # So the extensions are left to `flatpak-builder --install-deps-from`
      # below, which reads the manifest it is about to build and installs what
      # that manifest actually requires. Guessing a branch from a version that
      # does not govern it is what broke; the tool that parses the manifest
      # does not have to guess.
      - name: Install the runtime the manifest asks for
        run: |
          RUNTIME=$(jq -r '.runtime + "//" + (."runtime-version"|tostring)' "$MANIFEST")
          SDK=$(jq -r '.sdk + "//" + (."runtime-version"|tostring)' "$MANIFEST")
          echo "runtime: $RUNTIME"
          echo "sdk:     $SDK"
          flatpak install --user -y flathub "$RUNTIME" "$SDK"

      # Flatpak builds offline, so every crate is pinned by checksum up front.
      # Generated rather than committed: a stale copy is worse than none, since
      # it would silently build something other than what Cargo.lock resolves.
      - name: Generate the offline cargo sources
        run: |
          pip install --quiet aiohttp PyYAML tomlkit
          python3 flatpak/flatpak-cargo-generator.py Cargo.lock \
            -o flatpak/cargo-sources.json
          echo "$(jq length flatpak/cargo-sources.json) crate sources pinned"

      - name: Cache flatpak-builder state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .flatpak-builder
          key: ${{ runner.os }}-flatpak-${{ hashFiles('Cargo.lock', 'flatpak/dev.postio.Postio.json') }}
          restore-keys: ${{ runner.os }}-flatpak-

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub \
            --repo=repo build-dir "$MANIFEST"

      - name: Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="$(git rev-parse --short HEAD)"
          BUNDLE="postio-${VERSION}-x86_64.flatpak"
          flatpak build-bundle repo "$BUNDLE" "$APP_ID" --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          ls -lh "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "SBOM=postio-${VERSION}.spdx.json" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flatpak-bundle
          path: ${{ env.BUNDLE }}

      # What actually went into this build: 405 crates in Cargo.lock plus the
      # Flatpak runtime, from the same Cargo.lock flatpak-cargo-generator read
      # to produce the offline sources above. Answerable after the fact
      # rather than reconstructed from a tag. #97 adds cargo-deny -- "what is
      # in the graph" -- this is "what did we actually ship".
      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      # A tag push does not create a GitHub Release on its own -- nothing
      # here ever did, so `gh release upload` below always failed with
      # "release not found" the one time this workflow ran from an actual
      # tag push (v0.2.0's own: the bundle, SBOM and attestations all built
      # clean and were never published anywhere a person would find them).
      # Guarded on not existing yet, unlike `gh release upload --clobber`
      # below it: `create` has no clobber flag, and a rerun (workflow_dispatch
      # against the same tag, after some earlier step failed) must not error
      # out here just because this step already succeeded once.
      #
      # A 0.x tag is a pre-release on the release page too: `--prerelease`
      # keeps it off the "Latest" badge and says what the version number
      # already says. The same rule marks the AppStream entry
      # `type="development"` (scripts/release-bump.py).
      - name: Create the release
        if: github.ref_type == 'tag'
        run: |
          PRERELEASE=""
          case "${GITHUB_REF_NAME#v}" in 0.*) PRERELEASE="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.txt $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach to the release
        if: github.ref_type == 'tag'
        run: gh release upload "$GITHUB_REF_NAME" "$BUNDLE" "$SBOM" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # A signed SLSA provenance statement tying the bundle to this
      # repository, commit, workflow and runner. Before this, the only
      # evidence a downloaded bundle came from this workflow was that it
      # appeared on a release page -- exactly the evidence an attacker with a
      # token also has. Verify with:
      #   gh attestation verify postio-VERSION-x86_64.flatpak --repo dlapiduz/postio
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.BUNDLE }}

      # Ties the SBOM to the exact bundle it describes, the same way the
      # provenance attestation ties the bundle to the workflow that built it.
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.BUNDLE }}
          sbom-path: ${{ env.SBOM }}
