[package]
name = "postio-jmap"
description = "JMAP MailBackend adapter over Pimalaya's io-jmap (ADR 0018)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }

# The RFC 8620/8621 protocol crate — coroutines plus the std blocking
# client. No TLS features: connections are opened on this workspace's own
# cancellable pimalaya-stream, exactly like postio-account's OAuth exchange.
io-jmap = { version = "0.3", default-features = false, features = ["client"] }
pimalaya-stream = { workspace = true }

# The MailBackend seam and nothing else: default-features = false leaves
# io-imap and the IMAP TLS stack out of this crate's tree entirely.
postio-account = { version = "0.3.0", path = "../postio-account", default-features = false }
postio-model = { version = "0.3.0", path = "../postio-model" }

secrecy = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
