# Search, open a hit, reply, and come back (ux-architect §4).
#
# `/` and a query, Return to run it, the arrows to a hit, Return to open
# it, `e` to reply, and Escape walks back out: first the composer, then the
# hit. Nothing should be lost on the way: the inbox is whole.
#
# Re-expressed for Focus (T265): its bar lists the hits under the field and
# never narrows the inbox, so the inbox's rows are the same at the end as at
# the start. In the classic app `e` was unbound on an open hit (#1750).
apps   = ["focus"]
source = { kind = "flow", ref = "ux-architect §4" }

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search" }

[[step]]
id      = "found"
type    = "harbour"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
check   = { keyboard.region = "search", app.focus.bar.messages = { changed = true } }
expect  = "The bar lists the mail that matches as the word is typed, under the Search mail for row."

[[step]]
key     = "Return"
check   = { keyboard.region = "search", app.focus.bar.highlighted = "message" }
expect  = "Return takes the highlight to the first hit."

[[step]]
id      = "hit"
key     = "Return"
check   = { view = "reader", composer.open = false, reading.id = { changed = true } }
expect  = "The hit is open over the list."

[[step]]
command = "reply"
check   = { composer.open = true, keyboard.field = "body" }
expect  = "The reply opens, quoting the hit."

[[step]]
command = "back"
check   = { composer.open = false, view = "reader", reading.id = { same_as = "hit" } }
expect  = "Escape leaves the composer and the hit is back."

[[step]]
command = "back"
check   = { composer.open = false, overlay.kind = "finder", keyboard.region = "search", app.focus.bar.messages = { same_as = "found" } }
expect  = "A second Escape leaves the hit for the results it was opened from, the words still typed."

[[step]]
command = "back"
check   = { composer.open = false, overlay.kind = "none", view = "list", rows.count = { same_as = 0 } }
expect  = "A third Escape leaves the search: the list is the whole Inbox, as it was."
