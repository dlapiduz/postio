# Search results can be switched between relevance and date order (#499).
#
# The defect: the results header showed a "Relevance" chip whose chevron did
# nothing, and there was no key. `toggle_result_order` is the keyboard path;
# the order is read off the first row, which must change.
source = { kind = "issue", ref = "#499" }
proof  = "pinned"
design = "05-search"

[[step]]
command = "search"
[[step]]
type    = "harbour"
settle  = { until = { rows.count = { changed = true } } }
check   = { rows.count = 11, cursor.id = "43" }
[[step]]
key     = "Return"
check   = { keyboard.region = "list" }
[[step]]
command = "toggle_result_order"
settle  = { until = { cursor.id = "30" } }
check   = { keyboard.region = "list", rows.count = 11, cursor.id = "30" }
expect  = "The same eleven hits, now newest first, and the chip in the header says so."
[[step]]
command = "toggle_result_order"
settle  = { until = { cursor.id = "43" } }
check   = { rows.count = 11, cursor.id = "43" }
expect  = "Back to relevance order."
