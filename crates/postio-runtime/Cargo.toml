[package]
name = "postio-runtime"
description = "The half of the runtime that owns a database and a connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# `FuturesUnordered` only, for the concurrent sync wave in `engine.rs`.
# `default-features = false` keeps the futures executor, its io traits and its
# `Sink` machinery out of the graph -- tokio is this crate's runtime, and the
# only thing missing from it is a way to poll a variable number of futures at
# once. Already in the lock file via `zbus`, so it costs no extra compile.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
postio-core.workspace = true
postio-imap.workspace = true
postio-index.workspace = true
postio-model.workspace = true
postio-search.workspace = true
postio-smtp.workspace = true
postio-storage.workspace = true
postio-sync.workspace = true
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
criterion = "0.7.0"
postio-model = { workspace = true, features = ["test-corpus"] }
postio-storage = { workspace = true, features = ["test-support"] }
# The `sync_writes` bench only: the phase split has to wrap each phase in the
# same kind of transaction `commit_batch` uses, or the numbers include a
# commit apiece and stop being comparable to the whole they came from.
# Features match `postio-storage`'s -- one `links = "sqlite3"` crate in the
# graph, so the feature selecting SQLCipher has to agree everywhere (ADR 0014).
rusqlite = { version = "0.40.2", features = [
    "bundled-sqlcipher-vendored-openssl",
] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[bench]]
name = "store_reads"
harness = false

[[bench]]
name = "sync_writes"
harness = false

[[bench]]
name = "sync_lanes"
harness = false

[lints]
workspace = true
