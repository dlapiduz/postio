[package]
name = "postio-smtp"
description = "SMTP sending built on Pimalaya io-smtp."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
io-sasl = { workspace = true }
# Address types are `ToStatic`; turning a parsed borrowed `&str` into the `'static` the session
# keeps needs the trait in scope.
bounded-static = "0.8"
io-smtp = { version = "0.9", default-features = false, features = ["client"] }
# IDNA for RFC 6531's easy half: a non-ASCII domain is punycoded. `io-smtp` has no module for 6531,
# so the conversion is ours (#922).
idna = "1.1.0"
postio-model.workspace = true
postio-transport.workspace = true
secrecy = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
postio-workspace-hack.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
