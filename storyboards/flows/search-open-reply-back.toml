# Search, open a hit, reply, and come back (ux-architect §4).
#
# `/` and a query, Return to run it, the arrows to a hit, Return to open
# it, `r` to reply, and Escape walks back out: first the composer, then the
# hit. Nothing should be lost on the way: the inbox is whole.
#
# Re-expressed for Focus (T265), and again for spec 010's search (#1825):
# Return runs the query into the results in the inbox's place, Return on
# a result opens it over them, and Escape walks back out: the composer, the
# hit, the results, then the inbox, whose rows are the same at the end as
# at the start. In the classic app `e` was unbound on an open hit (#1750).
apps   = ["focus"]
source = { kind = "flow", ref = "ux-architect §4" }

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search" }

[[step]]
id      = "found"
type    = "harbour"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
check   = { keyboard.region = "search", app.focus.bar.messages = { changed = true } }
expect  = "The dropdown lists the top hits for the word as it is typed, Show all under the ring."

[[step]]
id      = "results"
key     = "Return"
check   = { keyboard.region = "results", overlay.kind = "none" }
expect  = "Return runs the search: its results in the inbox's place, the first ringed."

[[step]]
id      = "hit"
key     = "Return"
check   = { view = "reader", composer.open = false, reading.id = { changed = true } }
expect  = "The ringed result is open over the results."

[[step]]
command = "reply"
check   = { composer.open = true, keyboard.field = "body", app.focus.composer.quoted = true }
expect  = "The reply opens, quoting the hit."

[[step]]
command = "back"
check   = { composer.open = false, view = "reader", reading.id = { same_as = "hit" }, app.focus.keyboard.in_message = true }
expect  = "Escape leaves the composer and the hit is back, the keyboard on the message as it was before the reply."

[[step]]
command = "back"
check   = { composer.open = false, overlay.kind = "none", keyboard.region = "results" }
expect  = "A second Escape leaves the hit for the results it was opened from, the ring on the result that was open."

[[step]]
command = "back"
check   = { composer.open = false, overlay.kind = "none", view = "list", keyboard.region = "list", rows.count = { same_as = 0 } }
expect  = "A third Escape leaves the results: the list is the whole Inbox, as it was."
