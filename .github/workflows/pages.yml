name: Pages

# Deploys the docs site to GitHub Pages: site/ at `/` and the mdBook reference (docs/book/) at
# `/docs/` (ADR 0011).
# Its own workflow, off the PR critical path. It trusts the checked-in generated references;
# `ci.yml`'s mdbook-build job catches drift on the PR.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/book/**"
      - "docs/keybindings.md"
      - "docs/config.md"
      - "docs/releases/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Cache the mdbook binary
        id: mdbook-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook-0.5.4

      # Pinned to a version so a new mdbook release cannot change the deployed rendering.
      # Skipped on a cache hit: `cargo install` exits 101 over an existing binary, and the key pins
      # the version (#760).
      - name: Install mdbook
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook --locked --version 0.5.4

      - name: Build the book
        run: mdbook build docs/book

      # upload-pages-artifact takes one directory: the landing page at its root, the book under
      # docs/ (ADR 0011 Q1).
      - name: Assemble the Pages artifact
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/docs
          cp -r docs/book/book/. _site/docs/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
