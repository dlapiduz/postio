[package]
name = "postio-session"
description = "The composition root without a toolkit: store, runtime, engines and the verb vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Queue rows are stamped with when the user performed the action, so the
# drainer replays them in the order they happened.
chrono = { workspace = true, features = ["std"] }
postio-config.workspace = true
postio-core.workspace = true
# `maildir` on: the composition root is where a stored account's backend is
# chosen, so it has to be able to build every kind an account row can name.
postio-account = { workspace = true, features = ["maildir"] }
# An invitation's reply, written from its calendar part (spec 007 FR-102).
# A pure leaf: no store, no toolkit, no network.
postio-calendar.workspace = true
# The quote detector the reader folds by, so a search passage says "quoted
# text" for exactly what the reader would fold (spec 010 D6). A pure leaf.
postio-body.workspace = true
# Text out of attachments already on this machine, for search (spec 010
# D10). A pure leaf; the indexer here runs it on the blocking pool.
postio-extract.workspace = true
postio-jmap.workspace = true
postio-gmail.workspace = true
postio-index.workspace = true
postio-model.workspace = true
# The database half. This crate is where SQLite is allowed; the view layer is
# guarded against it and so is postio-core.
postio-runtime.workspace = true
postio-search.workspace = true
postio-smtp.workspace = true
# `watch_policy`'s `WatchPolicy` (#932). Already in the graph under
# `postio-runtime`; naming it here is what lets a config value reach it
# rather than only `postio-runtime`'s own tests.
postio-sync.workspace = true
postio-storage.workspace = true
# `reader::Absent` and `reader::parts::BlobSource`: the frontend-independent
# half of the reader. Toolkit-free, so no cycle and no widget reaches in.
postio-ui.workspace = true
# The credential a "test connection" hands to SMTP. Same version the two
# crates that already carry one use, because a second `SecretString` type in
# the graph would defeat the zeroing this exists for.
secrecy = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
# A digest rule kept by the undo entry that took a sender out of it, as the
# TOML `[[focus.digests]]` holds (spec 007 FR-125).
toml = { workspace = true }
tracing = { workspace = true }
tracing-journald = "0.3"
tracing-log = "0.2"
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter"] }
postio-workspace-hack.workspace = true

[dev-dependencies]
# The application's allocator, for `body_index_memory`, which measures the heap
# the application would hold (#1606).
mimalloc = "0.1"
# The patience dial (#842), so the indexer test's wait scales with the machine.
postio-test-support = { workspace = true, features = ["logs"] }
# Throwaway migrated databases, so a verb is an ordinary function over a real
# schema rather than something only a running application can exercise. This
# is the whole argument for the crate: the verbs are testable without a
# toolkit, and they were not while they lived beside a GTK binary.
postio-storage = { workspace = true, features = ["test-support"] }
# The unkeyed digest a blob written before ADR 0014 was named by, so the
# fixture is the shape a real pre-release store has rather than a plausible
# one.
blake3 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The search seed, with its attachments' bytes, for the attachment
# indexer's pass over files that say "Atlas budget" (spec 010 T124).
postio-demo = { workspace = true }
# `Location`, as the indexer's tests read it back.
postio-extract = { workspace = true }
# The `.eml` corpus, so a conversation search's passages are cut from mail
# as clients actually quote it (spec 010 T028).
postio-model = { workspace = true, features = ["test-corpus"] }

# Platform sections at the foot, after every plain table
# (`check-target-sections-last.py`).
#
# The extraction helper's request goes in over a socket that cannot raise
# SIGPIPE (spec 010 D28): `SO_NOSIGPIPE` on Apple, `MSG_NOSIGNAL` elsewhere,
# through rustix's safe calls so `forbid(unsafe_code)` holds. The Mac app's
# `main` is Swift's, which does not ignore the signal as Rust's does. The
# version already in the graph; `net` is the only feature it needs.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "net"] }

[lints]
workspace = true
