# The labelled needs-action dataset (specs/007-postio-focus T010, spike S4;
# research R10; SC-013).
#
# One item per message. Every person, place and organisation is invented, and
# every address is on a reserved domain. The dataset is text, not mail: the
# detector reads a message's text and how it was addressed, which a labelled
# file states directly, and the shared .eml corpus stays the size its other
# suites expect.
#
# Fields:
#
#   id          unique, names what the item is
#   case        what it exercises (see the list below)
#   addressing  how the user received it:
#                 direct     the user is in To
#                 copied     the user is only in Cc
#                 list       mailing-list or bulk mail
#                 automated  an automated sender
#   text        the plain-text body as it arrived: the newest message, and
#               whatever quoted history, forwarded mail and signature came
#               with it
#   label       question | todo | none: the marker the product should show
#   quote       for question and todo, the sentence the marker quotes,
#               verbatim (compared with whitespace runs collapsed)
#   due         for a todo whose sentence names a deadline, YYYY-MM-DD
#   also        other genuine asks in the same message, as { label, quote }:
#               rule 5 below picks one marker, but a marker quoting one of
#               these is still a right marker, only not the preferred one
#
# Every message was sent on Saturday 26 September 2026 (`sent`, below), which
# is what "by Friday" is resolved against.
#
# Labelling rules, so that the next person labels the same way:
#
#  1. Only the newest message's own words count: never quoted history, a
#     forwarded message, or a signature.
#  2. Only direct mail can be marked (FR-106). Copied, list and automated
#     mail is labelled none whatever it says.
#  3. A sentence that ends in "?" and asks the reader something is a
#     question, including a request phrased as one ("Can you approve these by
#     Friday...?" is a question, as in the spec's US12 scenario 1). Questions
#     carry no due date.
#  4. A request that is not a question ("Please...", "Let me know...", an
#     imperative) is a todo, with a due date when it names a deadline ("by",
#     "before", "no later than"). "On Monday" says when, not by when, and is
#     not a deadline.
#  5. One marker per message (R10): the first todo with a deadline, else the
#     first question, else the first todo.
#  6. None: pleasantries, rhetorical questions, boilerplate ("Let me know if
#     you have any questions", "Please find attached"), questions and asks
#     put to somebody else, the sender's own commitments, and text addressed
#     to an assistant rather than to the person reading.
#  7. A clause after ";" or "—" is its own sentence (R10, and US12 scenario
#     2).
#
# Cases: question, todo, statement, boilerplate, pleasantry, rhetorical,
# quoted, signature, list, copied, automated, instruction, other-addressee,
# mixed.

sent = "2026-09-26"

