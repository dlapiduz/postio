[package]
name = "postio-extract"
description = "The text inside an attachment, located: PDF pages, sheet rows, slides, paragraphs, lines (spec 010 D10). A pure leaf."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# A pure leaf (`check-crate-boundaries.py`): bytes in, located text out; no store, runtime, network
# or toolkit.
[dependencies]
# Panics on some malformed files, hence every call is under `catch_unwind` (research R5).
pdf-extract = "0.12.1"
postio-search = { workspace = true }
# No default features: they pull bzip2, zstd, lzma and AES, which an Office file does not use.
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2"] }
# 0.41 is the version already in the graph, so the workspace holds one copy.
quick-xml = "0.42.0"
encoding_rs = "0.8.44"
postio-workspace-hack.workspace = true

# Platform sections at the foot (`check-target-sections-last.py`).
# rustix's safe `setrlimit` lets the helper lower its ceilings while the workspace's
# `forbid(unsafe_code)` holds.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[lints]
workspace = true
