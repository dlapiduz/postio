[package]
name = "postio-test-support"
description = "One deadline, one backoff, one timeout message: the wait primitive every suite in this workspace shares."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# `time` only: `settle_until_async` backs off with `tokio::time::sleep`, because a
# thread sleep in an async waiter parks a runtime worker.
tokio = { workspace = true, features = ["time"] }
# Behind `logs`: the capturing writer tests read log lines back through.
tracing-subscriber = { workspace = true, optional = true }
# Behind `fidelity`: decode and write the reference renders (spec 006). Pure
# Rust; already in the lockfile through the image stack.
png = { version = "0.18", optional = true }

[features]
logs = ["dep:tracing-subscriber"]
fidelity = ["dep:png"]

[lints]
workspace = true
