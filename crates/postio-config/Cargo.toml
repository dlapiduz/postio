[package]
name = "postio-config"
description = "TOML configuration: schema, validation, file watching, and live reload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true }
notify = "8.2.2"
postio-model.workspace = true
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25"
# Parsing only: nothing here connects.
url = { workspace = true }
postio-workspace-hack.workspace = true

[lints.rust]
# `tests/validation_cost.rs` installs a counting global allocator, which is `unsafe impl`; a test
# target cannot opt out of `forbid`.
# No library code here uses `unsafe` (check-lint-floor.py EXCEPTIONS).
unsafe_code = "deny"
missing_docs = "allow"
# A crate with its own `[lints.rust]` inherits no workspace lints, so the clippy floor's
# `let_underscore_future` rule is restated.
[lints.clippy]
let_underscore_future = "deny"

[lints.cargo]
unused_dependencies = "allow"
