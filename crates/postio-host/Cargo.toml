[package]
name = "postio-host"
description = "The one process that owns Postio's store, and serves every frontend (ADR 0041)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "postio-daemon"
path = "src/bin/postio-daemon.rs"

[lints]
workspace = true

[dependencies]
async-channel = { workspace = true }
postio-client.workspace = true
postio-core.workspace = true
postio-model.workspace = true
postio-session.workspace = true
postio-storage.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
postio-account.workspace = true
postio-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
