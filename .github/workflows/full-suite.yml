name: Full suite on request

# The nightly's whole run on a pull request, when asked: label it `full-suite`, or
# `scripts/issue-land.sh --detach --full-suite`.
# `Full suite on request` is required: it passes in seconds without the label, and with it only if
# the full suite does.
# Its own workflow, since label events would re-run all of ci.yml and a skipped re-run can mask a
# failing one.
# A label added by the workflow token triggers nothing; add it with your own `gh`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requested:
    name: Asked for
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Is the full suite requested?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$LABELLED" = true ]; then
            echo "Requested ($EVENT) -- running the full suite on this ref."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not requested: no full-suite label."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The nightly itself, reused so there is one definition of the full suite. Runs called this way
  # never count as "the last nightly".
  suite:
    name: Full suite
    needs: requested
    if: needs.requested.outputs.run == 'true'
    uses: ./.github/workflows/nightly.yml

  result:
    name: Full suite on request
    needs: [requested, suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        env:
          RUN: ${{ needs.requested.outputs.run }}
          SUITE: ${{ needs.suite.result }}
        run: |
          if [ "$RUN" != true ]; then
            echo "Not requested. Label the pull request full-suite to run it."
            exit 0
          fi
          if [ "$SUITE" = success ]; then
            echo "The full suite passes on this pull request."
            exit 0
          fi
          echo "::error::The full suite was requested and did not pass (${SUITE})."
          exit 1
