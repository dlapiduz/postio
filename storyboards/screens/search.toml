# The command bar after a search has run: the hits under the field (screen 07).
#
# Focus's design references are never committed
# (specs/007-postio-focus/screens.md records each one).
apps   = ["focus"]
source = { kind = "design", ref = "focus 07" }

[[step]]
command = "search"

[[step]]
type    = "harbour"

[[step]]
key     = "Return"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
