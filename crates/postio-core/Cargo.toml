[package]
name = "postio-core"
description = "UI-agnostic runtime: command bus, event stream, app state, undo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
postio-config.workspace = true
postio-model.workspace = true
postio-storage = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time"] }

[features]
# The composition root: the half of this crate that owns a database and reads
# it. Off by default, and it has to be, because `postio-gtk` depends on
# `postio-core` and must not have `rusqlite` anywhere in its dependency graph
# — `scripts/check-crate-boundaries.py` enforces exactly that. Whatever
# assembles the running application turns this on; the view layer never does.
runtime = ["dep:postio-storage"]

[dev-dependencies]
criterion = "0.7.0"
postio-storage = { workspace = true, features = ["test-support"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "perf_budgets"
harness = false
