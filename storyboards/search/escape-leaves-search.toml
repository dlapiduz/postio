# Escape leaves a search, and the list is the folder again (#1474, #1011).
#
# The defect: once a search had run, Escape did nothing, and the window
# stayed stuck on the hits. The folder's own rows must be what is left.
#
# Re-expressed for Focus (T265): Focus's command bar does not narrow the
# inbox behind it. Typing offers to search, Return runs the search and lists
# the matches in the bar, which keeps the keyboard, and Escape closes the
# bar over an inbox that never changed.
apps   = ["focus"]
source = { kind = "issue", ref = "#1474" }
proof  = "pinned"

[[step]]
command = "search"
check   = { overlay.kind = "finder", keyboard.region = "search", keyboard.typing = true }

[[step]]
type    = "harbour"
check   = { keyboard.region = "search", rows.count = { same_as = 0 }, app.focus.bar.highlighted = "search" }
expect  = "The bar offers to search mail for what was typed; the inbox behind it is not narrowed."

[[step]]
key     = "Return"
settle  = { until = { app.focus.bar.messages = { changed = true } } }
check   = { keyboard.region = "search", keyboard.typing = true, overlay.kind = "finder", app.focus.bar.messages = { changed = true } }
expect  = "Return runs the search and the bar lists the matches under the field, headed by their count; the keyboard stays in the bar."

[[step]]
command = "back"
check   = { keyboard.region = "list", overlay.kind = "none", view = "list", rows.count = { same_as = 0 } }
expect  = "The bar is gone and the list is the Inbox, every row there; nothing of the search is left."
