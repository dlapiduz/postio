name: Release

# A release is the push that merges a release pull request (#1714).
#
# The version moves in that pull request -- `scripts/release-prepare.sh
# X.Y.Z` makes it: the bump, the notes in docs/releases/X.Y.Z.md, one commit
# -- so `main` always says the version it is. This workflow runs on every
# push to `main`, and its first job answers "is this a release?" in seconds:
# only when `Cargo.toml` names a version with no tag yet, newer than the
# newest one. Every other push stops there.
#
# It used to run on a tag and bump the version itself, in every build job, on
# a copy of the tree it could never commit -- an automated push cannot pass
# `main`'s ruleset. So `main` said 0.3.0 while v0.4.2 was out.
#
# What a release ships is `.github/release-variants.json`, one row per
# package. Each kind of package is one job below, run once per row of that
# kind, so a second Flatpak or a second tarball is a row, not a job. Every
# package carries its own SBOM and a provenance attestation.
#
# Nothing is published until everything is built: `publish` creates the
# release as a draft, attaches every asset and `SHA256SUMS`, checks the list
# against the variants file, and only then publishes -- which is also what
# creates the tag. A package that fails to build leaves no release and no
# tag, rather than a release with a hole in it (v0.3.0, v0.4.0 and v0.4.1 are
# tags with no release, from the old shape).
#
# `workflow_dispatch` builds every package as a workflow artifact, versioned
# `<version>-dev.<sha>`, and publishes nothing.
#
# A Flatpak build compiles the whole workspace --release inside a sandbox
# against a ~3 GB runtime it has to download first; that is why none of this
# is part of CI.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-suite:
        description: "Skip the full suite (a dispatch publishes nothing either way)"
        type: boolean
        default: false

permissions:
  contents: write        # to create the release and upload the packages
  id-token: write        # to mint the Sigstore signature behind an attestation
  attestations: write    # to publish the provenance and SBOM attestations
  actions: read          # `plan` asks whether the nightly passed this commit

# Never cancel a release half-way: a cancelled `publish` is a draft with half
# its assets. A newer push waits, and is almost always "nothing to release".
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Is this a release?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      suite: ${{ steps.plan.outputs.suite }}
      flatpaks: ${{ steps.matrices.outputs.flatpaks }}
      tarballs: ${{ steps.matrices.outputs.tarballs }}
      macos: ${{ steps.matrices.outputs.macos }}
    steps:
      # One commit is enough: `release-plan.sh` asks origin for its tags
      # (`git ls-remote`) rather than trusting this clone, which has none at
      # this depth whatever `fetch-tags` says.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_SUITE: ${{ inputs.skip-suite && '--skip-suite' || '' }}
        run: |
          # shellcheck disable=SC2086  # an empty $SKIP_SUITE is no argument
          scripts/release-plan.sh $SKIP_SUITE | tee -a "$GITHUB_OUTPUT"

      # One JSON list per kind of package, for each build job's matrix.
      - name: Read what the release ships
        id: matrices
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 scripts/release-variants.py check
          {
            echo "flatpaks=$(python3 scripts/release-variants.py matrix flatpak --version "$VERSION")"
            echo "tarballs=$(python3 scripts/release-variants.py matrix tarball --version "$VERSION")"
            echo "macos=$(python3 scripts/release-variants.py matrix macos-app --version "$VERSION")"
          } | tee -a "$GITHUB_OUTPUT"

  # **The full suite, and nothing ships without it** (2026-09-19).
  #
  # The pull-request gate is the sanity tier, so the integration suites that
  # catch layers which each pass and were never joined up run on the nightly
  # timer and here. A release is the last point at which finding one is
  # cheaper than shipping it.
  #
  # Skipped when the nightly already passed this exact commit
  # (`scripts/release-plan.sh` asks): it runs the identical suite -- the same
  # `--profile ci-full` through the same flake-retry script, and the doctests
  # -- so that is this answer already given. Anything short of the exact
  # commit runs it here.
  #
  # `--profile ci-full`: the measurement tier runs too, minus the one
  # measurement that asserts on a stopwatch, which a shared runner cannot
  # defend. `.config/nextest.toml` says which and why.
  suite:
    name: Full suite
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.suite == 'run'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-workspace

      - name: Give the GTK suites a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('scripts/install-nextest.sh') }}

      - name: Install cargo-nextest
        run: scripts/install-nextest.sh

      # Through the flake-retry script, not a bare nextest run. A release does
      # not ship on a test that only failed because this runner was busy, and
      # it does not *fail to ship* on one either: a target that fails once is
      # retried alone before it is allowed to block anything, and one that
      # fails twice still blocks.
      - name: Run the release gate
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- scripts/test-with-flake-retry.sh ci-full

      # nextest does not run doctests and does not say so.
      - name: cargo test --doc
        env:
          POSTIO_TEST_PATIENCE: "3"
        run: dbus-run-session -- cargo test --workspace --doc

  # One job per Flatpak row of the variants file. A build job reads the tree
  # as it is: the version is already in it, because the release pull request
  # put it there, and the manifests build from the checkout (`"type": "dir"`).
  flatpak:
    name: Flatpak (${{ matrix.variant.id }})
    needs: [plan, suite]
    # `always()` because `suite` is skipped whenever the nightly already
    # answered, and a skipped need otherwise skips this too.
    if: >-
      always() && needs.plan.outputs.build == 'true'
      && needs.plan.outputs.flatpaks != '[]'
      && (needs.suite.result == 'success' || needs.suite.result == 'skipped')
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.flatpaks || '[]') }}
    env:
      MANIFEST: ${{ matrix.variant.manifest }}
      APP_ID: ${{ matrix.variant.app_id }}
      ASSET: ${{ matrix.variant.asset }}
      SBOM: ${{ matrix.variant.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A cold debug build already ran a runner out of disk once and killed
      # lld with SIGBUS mid-link. This build is --release and additionally
      # needs the runtime and SDK, so reclaim the preinstalled toolchains
      # nothing here uses before starting rather than diagnosing it again.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Give flatpak a runtime directory
        run: |
          runtime="${RUNNER_TEMP:-/tmp}/xdg"
          mkdir -p "$runtime" && chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # The runtime and SDK are read from the manifest rather than repeated
      # here. The SDK *extensions* are not: `rust-stable` is a freedesktop
      # extension whose branches follow freedesktop's versions, not GNOME's,
      # so naming it with the manifest's runtime version resolves to nothing.
      # `flatpak-builder --install-deps-from` below reads the manifest and
      # installs what it actually requires.
      - name: Install the runtime the manifest asks for
        run: |
          RUNTIME=$(jq -r '.runtime + "//" + (."runtime-version"|tostring)' "$MANIFEST")
          SDK=$(jq -r '.sdk + "//" + (."runtime-version"|tostring)' "$MANIFEST")
          echo "runtime: $RUNTIME"
          echo "sdk:     $SDK"
          flatpak install --user -y flathub "$RUNTIME" "$SDK"

      # Flatpak builds offline, so every crate is pinned by checksum up front.
      # Generated rather than committed: a stale copy is worse than none,
      # since it would silently build something other than what Cargo.lock
      # resolves.
      - name: Generate the offline cargo sources
        run: |
          pip install --quiet aiohttp PyYAML tomlkit
          python3 flatpak/flatpak-cargo-generator.py Cargo.lock \
            -o flatpak/cargo-sources.json
          echo "$(jq length flatpak/cargo-sources.json) crate sources pinned"

      - name: Cache flatpak-builder state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: ${{ runner.os }}-flatpak-${{ matrix.variant.app_id }}-${{ hashFiles('Cargo.lock', matrix.variant.manifest) }}
          restore-keys: ${{ runner.os }}-flatpak-${{ matrix.variant.app_id }}-

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub \
            --repo=repo build-dir "$MANIFEST"

      # The bundle carries two apps: the desktop app, and Postio Focus as a
      # second launcher (specs/007-postio-focus research R3). A manifest that
      # stops building either one still builds, so look inside before
      # publishing rather than finding out from a user. `packaging.rs` in
      # postio-focus's tests holds this list to the manifest.
      - name: Check the build carries both apps
        run: |
          for path in \
            files/bin/postio \
            files/bin/postio-focus \
            files/share/applications/dev.postio.Postio.desktop \
            files/share/applications/dev.postio.Postio.Focus.desktop
          do
            test -e "build-dir/$path" || { echo "::error::the build has no $path"; exit 1; }
          done

      - name: Bundle
        run: |
          flatpak build-bundle repo "$ASSET" "$APP_ID" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          ls -lh "$ASSET"

      # What actually went into this build, from the same Cargo.lock
      # flatpak-cargo-generator read for the offline sources.
      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      # A signed SLSA provenance statement tying the package to this
      # repository, commit, workflow and runner, and the SBOM to the package.
      # Verify with: gh attestation verify <asset> --repo dlapiduz/postio
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant.asset }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}
          if-no-files-found: error

  # One job per tarball row: a binary for a machine without Flatpak -- for the
  # terminal app, usually a server reached over SSH -- with its README beside
  # it.
  tarball:
    name: Tarball (${{ matrix.variant.id }})
    needs: [plan, suite]
    if: >-
      always() && needs.plan.outputs.build == 'true'
      && needs.plan.outputs.tarballs != '[]'
      && (needs.suite.result == 'success' || needs.suite.result == 'skipped')
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.tarballs || '[]') }}
    env:
      ASSET: ${{ matrix.variant.asset }}
      SBOM: ${{ matrix.variant.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-workspace

      - name: Build
        env:
          PROFILE: ${{ matrix.variant.profile }}
          PACKAGE: ${{ matrix.variant.package }}
          BIN: ${{ matrix.variant.bin }}
        run: cargo build --profile "$PROFILE" -p "$PACKAGE" --bin "$BIN"

      - name: Package
        env:
          PROFILE: ${{ matrix.variant.profile }}
          BIN: ${{ matrix.variant.bin }}
          README: ${{ matrix.variant.readme }}
        run: |
          DIR="${ASSET%.tar.zst}"
          mkdir -p "$DIR"
          install -m755 "target/${PROFILE}/${BIN}" "$DIR/"
          cp "$README" "$DIR/README.md"
          tar --zstd -cf "$ASSET" "$DIR"
          ls -lh "$ASSET"

      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant.asset }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}
          if-no-files-found: error

  # The macOS app, zipped. Ad-hoc signed and not notarized (maintainer,
  # 2026-10-01, revising ADR 0019 Q8): Gatekeeper refuses it on a double
  # click, and a person opens it once with right-click -> Open. A Developer ID
  # and notarization would remove that step; neither exists yet. Built on
  # macos-latest, so Apple Silicon only.
  macos:
    name: macOS (${{ matrix.variant.id }})
    needs: [plan, suite]
    if: >-
      always() && needs.plan.outputs.build == 'true'
      && needs.plan.outputs.macos != '[]'
      && (needs.suite.result == 'success' || needs.suite.result == 'skipped')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.macos || '[]') }}
    env:
      ASSET: ${{ matrix.variant.asset }}
      SBOM: ${{ matrix.variant.sbom }}
      APP: macos/build/${{ matrix.variant.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pin decides; see ci.yml's `fmt` job.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install the linker and cc shims
        run: scripts/install-shims.sh

      # A release build of `postio-ffi`, so not CI's debug `macos-ffi`
      # cache. Written from `main`, which is where a release runs.
      - name: Restore the build cache
        uses: ./.github/actions/build-cache
        with:
          name: macos-release

      - name: Build
        run: scripts/macos-build.sh --release

      - name: Assemble the app
        run: scripts/macos-bundle.sh --release

      # `ditto`, not `zip`: it keeps the bundle's extended attributes and the
      # ad-hoc signature intact, which `zip -r` does not.
      - name: Zip
        run: |
          ditto -c -k --keepParent "$APP" "$ASSET"
          ls -lh "$ASSET"

      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant.asset }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}
          if-no-files-found: error

      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-cache-save

  # Everything built, so: one draft, every asset, the checksums, and a check
  # against the variants file that nothing is missing -- then publish, which
  # creates the tag at the commit that was built. Anything short of that
  # leaves a draft and no tag, so re-running the failed jobs finishes it.
  publish:
    name: Publish
    needs: [plan, flatpak, tarball, macos]
    if: >-
      always() && needs.plan.outputs.publish == 'true'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.flatpak.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.tarball.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.macos.result)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      # Full history: drafting notes, when the release PR somehow left none,
      # reads the commits since the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Check every package is here
        run: |
          missing=0
          for asset in $(python3 scripts/release-variants.py assets --version "$VERSION"); do
            if [ -f "assets/$asset" ]; then
              echo "  have $asset"
            else
              echo "::error::missing $asset"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # docs/releases/<version>.md is the release PR's; drafted from commit
      # subjects only if it is somehow absent.
      - name: Notes
        run: |
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -s "$NOTES" ]; then
            # shellcheck source=scripts/lib/release.sh
            source scripts/lib/release.sh
            release_draft_notes "$(release_newest_tag)" > "$NOTES"
            [ -s "$NOTES" ] || echo "- Maintenance release" > "$NOTES"
          fi
          cp "$NOTES" release-notes.md
          cat release-notes.md

      # A 0.x is a pre-release on the release page too: it stays off the
      # "Latest" badge, which is what the version number already says. The
      # same rule marks the AppStream entry `type="development"`.
      #
      # A re-run finds its own draft and fills it again. A release that is
      # already published is refused here even though `plan` should never
      # have got this far for one: on 2026-10-01 a plan that could not see
      # the tags set out to re-release v0.4.2, and `--clobber` below would
      # have replaced its assets. The step that writes is the one that must
      # not trust its inputs.
      - name: Draft, attach, publish
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error::$TAG is already published. Refusing to change it."
            exit 1
          fi
          if [ "$draft" = none ]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file release-notes.md "${flags[@]}"
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false
          echo "published $(gh release view "$TAG" --json url --jq .url)"

  # SC-004 (specs/005-tui-frontend): the terminal binaries are under half the
  # desktop ones, and the terminal Flatpak with its runtime under two-thirds. Beside `publish`, not in front of it: a size is not a reason
  # to withhold a working release, it is a reason the next one has to shrink,
  # and a red job on the run says so.
  #
  # The binaries comparison follows each executable's shared libraries with
  # `ldd`, so it needs the desktop binary built here against host GTK -- the
  # one inside the Flatpak links against the runtime's.
  package-sizes:
    name: Terminal packages are small enough (SC-004)
    needs: [plan, flatpak, tarball]
    if: always() && needs.flatpak.result == 'success' && needs.tarball.result == 'success'
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-workspace

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Is the terminal binary under half the desktop one?
        run: |
          cargo build --release -p postio-app --bin postio
          tar --zstd -xf "assets/postio-tui-${VERSION}-linux-x86_64.tar.zst"
          scripts/measure-package-size.sh binaries \
            "postio-tui-${VERSION}-linux-x86_64/postio-tui" -- target/release/postio

      - name: Install both Flatpaks and their runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          for bundle in "assets/postio-${VERSION}-linux-x86_64.flatpak" \
                        "assets/postio-tui-${VERSION}-linux-x86_64.flatpak"; do
            flatpak install --user -y --noninteractive "$bundle"
          done

      - name: Is the terminal Flatpak under two-thirds of the desktop one?
        run: scripts/measure-package-size.sh flatpak dev.postio.PostioTui dev.postio.Postio
